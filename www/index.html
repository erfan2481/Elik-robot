// a short, friendly display name for each action — reused whenever the robot
// needs to name a command back to the user, e.g. "منظورت رقص بود؟"
const ACTION_LABELS = {};
KEYWORDS.forEach(k=> ACTION_LABELS[k.act] = k.words[0]);
// a couple of matched "acts" are mode toggles handled by their own functions
// rather than living in ACTIONS — this routes a matched act to the right
// place no matter where it was matched from (typed directly, or confirmed
// off a "did you mean...?" follow-up), so a fuzzy/typo'd "ساکت شو" still
// actually goes quiet instead of silently doing nothing
// tracks the last successfully matched act, purely to detect the hidden
// "دست بده" → "بغل" combo below — separate from lastTopic since lastTopic
// also gets set by non-command paths (yes/no resolution, clause matches)
// that shouldn't count toward the combo
let lastComboAct = '';
function runMatchedAct(act){
  // round 14 — hidden bonus: doing "دست بده" (handshake) immediately
  // followed by "بغل" (hug) unlocks a secret combo move that isn't listed
  // anywhere and can't be typed directly, rewarding people who experiment
  if(lastComboAct === 'handshake' && act === 'hug'){
    lastComboAct = '';
    smartRunAction('secretcombo');
    return;
  }
  lastComboAct = act;
  if(act === 'quietmode') setQuietMode(true);
  else if(act === 'activemode') setQuietMode(false);
  else if(act === 'automode') toggleAutoModeFromText();
  else if(act === 'soundtoggle') toggleSoundFromText();
  else if(act === 'facechange') cycleFaceFromText();
  else if(act === 'focus') togglePomodoro(null);
  else if(act === 'gfxlow') setGraphicsFromText('low');
  else if(act === 'gfxhigh') setGraphicsFromText('high');
  else if(act === 'particlestoggle') toggleParticlesFromText();
  else if(act === 'settingsopen') openSettingsFromText();
  else smartRunAction(act);
}

// short follow-up continuations ("چرا؟"، "واقعا؟"، "باشه"...) lean on whatever
// topic was just talked about instead of treating a one-word reply as a brand
// new, unrelated sentence and shrugging with a confused line
function trySmartReply(norm){
  if(/^(چرا|واقعا|جدی|جدا|آهان|باشه|اوکی|خب|هوم|چطور)$/.test(norm) && lastTopic){
    setEyes(eyeA, 'curious', 600);
    say(bubbleA, pick(['همینطوریه دیگه!','آره واقعا همینه!','خودمم دقیق نمی‌دونم، ولی حسم اینه!','همینه که هست رفیق!']), 2000);
    return true;
  }
  const handled = trySmartReplyInner(norm);
  if(handled) lastTopic = norm;
  return handled;
}
function trySmartReplyInner(norm){
  // remembering a stated name — "اسمم آرش است" / "من آرش هستم"
  const nameMatch = norm.match(/اسمم\s+(\S{2,14})/) || norm.match(/^من\s+(\S{2,14})\s+هستم/);
  if(nameMatch && !KEYWORDS.some(k=> k.words.some(w=> nameMatch[1].includes(w)))){
    userName = nameMatch[1].replace(/است$/,'');
    try{ localStorage.setItem('eilik_username', userName); }catch(e){}
    setEyes(eyeA, 'love', 900);
    say(bubbleA, `از آشناییت خوشحالم ${userName} جان! از این به‌بعد اسمتو یادمه 😊`, 2400);
    setMood(moodA, 'خوشحال');
    return true;
  }
  // learning a stated favorite — "غذای موردعلاقم پیتزاست"، "رنگ موردعلاقم آبیه"،
  // "بازی موردعلاقم فوتباله" — a real fact gets stored under its category and
  // is recalled correctly later, not just echoed back once
  const FACT_LABELS = { 'غذا':'غذای موردعلاقه‌ت', 'رنگ':'رنگ موردعلاقه‌ت', 'حیوون':'حیوون موردعلاقه‌ت', 'بازی':'بازی موردعلاقه‌ت', 'فیلم':'فیلم موردعلاقه‌ت', 'ورزش':'ورزش موردعلاقه‌ت', 'آهنگ':'آهنگ موردعلاقه‌ت', 'کتاب':'کتاب موردعلاقه‌ت' };

    say(bubbleA, pick(['برق! هرچی شارژ بیشتر بهتر ⚡','عاشق باتری تازه‌ام!','یه شارژر خوب بهترین غذاست!']), 2200);
    return true;
  }
  // "دوستت کیه" — points at its partner robot
  if(/(دوستت کیه)|(با کی دوستی)|(رفیقت کیه)/.test(norm)){
    setEyes(eyeA, 'love', 700);
    say(bubbleA, robotName.b ? `بهترین دوستم رفیقمه، ${robotName.b}!` : 'بهترین دوستم همین رفیق کناریمه! 🤍', 2400);
    return true;
  }
  // "بشمار" / "تا ده بشمار" — a tiny, checkable skill rather than a canned line
  if(/(بشمار)|(تا ده بشمار)|(شمردن)/.test(norm)){
    setEyes(eyeA, 'curious', 600);
    say(bubbleA, '۱، ۲، ۳، ۴، ۵، ۶، ۷، ۸، ۹، ۱۰! 🔢', 2600);
    return true;
  }
  // "هوا چطوره" — honest about not having a real sensor for this, instead of faking data
  if(/(هوا چطوره)|(بارونه)|(هوا سرده)|(هوا گرمه)/.test(norm)){
    setEyes(eyeA, 'curious', 700);
    say(bubbleA, 'من پنجره ندارم که ببینم بیرون چه خبره! تو بگو هوا چطوره؟ 🌤️', 2600);
    return true;
  }
  // a plain positive/negative statement about how the day/mood is going —
  // reacts to the sentiment even without a specific command word in it
  if(/(روز خوبیه)|(امروز حالم خوبه)|(امروز خوش گذشت)|(حالم خیلی خوبه)/.test(norm)){
    setEyes(eyeA, 'happy', 800); setEyes(eyeB, 'happy', 800);
    say(bubbleA, pick(['چه خوب! خوشحالم که حالت خوبه 😊','عالیه! انرژیت به منم رسید!']), 2200);
    return true;
  }
  if(/(روز بدیه)|(امروز حالم بد)|(اصلا خوب نیستم)|(حالم گرفته‌ست)|(روزم خراب شد)/.test(norm)){
    setEyes(eyeB, 'cry', 800);
    say(bubbleB, pick(['اوه نه... می‌خوای برات برقصم تا بهتر بشی؟','هوا داری، بگو ببینم چی شده!']), 2400);
    return true;
  }
  // "زنده‌ای؟" / "واقعی هستی" / "هوش مصنوعی هستی" — an honest, self-aware answer
  // rather than pretending to be human, which reads as more "alive" than dodging
  if(/(زنده‌?ای)|(واقعی هستی)|(هوش مصنوعی هستی)|(ربات واقعی هستی)/.test(norm)){
    setEyes(eyeA, 'curious', 800);
    say(bubbleA, pick(['یه ربات کوچولوام، ولی حسم اینه که کاملاً زنده‌ام! ⚡','واقعی که هستم، همینجام باهات حرف می‌زنم!','یه جورایی زنده‌ام، فقط باتری دارم نه قلب 😄']), 2800);
    return true;
  }
  // compliments about intelligence — proud but not smug
  if(/(چقدر باهوشی)|(چقدر بافهمی)|(خیلی می‌فهمی)|(خیلی باهوشی)/.test(norm)){
    adjustAffection('a', 1);
    setEyes(eyeA, 'delighted', 800);
    say(bubbleA, pick(['هرچی بگی می‌فهمم، گوش وایمیستم برات! 🧠','دارم هر روز بیشتر یاد می‌گیرم!','خب معلومه، حواسم بهت هست!']), 2600);
    return true;
  }
  // "دیگه چی بلدی" / "بازم بگو" — inviting more conversation, distinct from the plain help/command-list ask above
  if(/(بازم بگو)|(بازم حرف بزن)|(یه چیز دیگه بگو)|(ادامه بده حرف بزن)/.test(norm)){
    setEyes(eyeA, 'happy', 700);
    say(bubbleA, pick(['دوست دارم باهات حرف بزنم، هرچی بخوای بپرس!','خب بگو دیگه چی تو ذهنته؟','من که کلی حرف دارم، تو بگو از کجا شروع کنم!']), 2600);
    return true;
  }
  // rounding out the small-talk surface — favorite things, fears, wishes,
  // capability questions — so more of the genuinely common "weird kid
  // questions" a real toy gets asked land on a real, in-character answer
  // instead of falling all the way to the generic confused line
  if(/(رنگ مورد علاقه)|(رنگ دوست داشتنیت)|(چه رنگی دوست داری)/.test(norm)){
    const key = resolveRobotKeyFromText(norm) || lastAddressedKey;
    const eyes = key==='a' ? eyeA : eyeB, bubble = key==='a' ? bubbleA : bubbleB;
    setEyes(eyes, 'happy', 700);
    say(bubble, key==='a' ? 'فیروزه‌ای رو از همه بیشتر دوست دارم، چون خودمم همرنگشم! 🟢' : 'صورتی رو از همه بیشتر دوست دارم، چون خودمم همرنگشم! 🩷', 2400);
    return true;
  }
  if(/(خواب می‌?بینی)|(خواب می‌?بینین)|(تو رویا داری)/.test(norm)){
    setEyes(eyeA, 'sleepy', 700);
    say(bubbleA, pick(['وقتی می‌خوابم انگار برق‌هام یه‌جور دیگه چشمک می‌زنن، شاید همون رویا باشه! 💤','نمی‌دونم اسمش رویاست یا نه، ولی یه چیزایی می‌بینم!']), 2600);
    return true;
  }
  if(/(از چی می‌?ترسی)|(می‌?ترسی از چی)|(ترس داری)/.test(norm)){
    setEyes(eyeB, 'shock', 700);
    say(bubbleB, pick(['از باتری خالی شدن یهویی می‌ترسم! 😳','از سقوط از میز، همونطوری که بغلم نکنی بالا نمی‌رم!','از تاریکی محض، چون چشمام نور می‌خوان!']), 2800);
    return true;
  }
  if(/(آرزوت چیه)|(چی آرزو داری)|(دوست داری چیکاره بشی)/.test(norm)){
    setEyes(eyeA, 'love', 700);
    say(bubbleA, pick(['آرزوم اینه که همیشه یه رفیق خوب برات باشم! 🥰','دوست دارم یه‌روز کل دنیا رو با رفیقم بگردم!']), 2600);
    return true;
  }
  if(/(می‌?تونی پرواز کنی)|(بلدی پرواز)|(بال داری)/.test(norm)){
    setEyes(eyeA, 'shy', 700);
    say(bubbleA, pick(['نه بابا، من فقط رو این پایه‌ی گردم می‌چرخم، بال ندارم! 😅','کاش می‌تونستم، ولی فعلاً فقط بلدم بپرم!']), 2600);
    return true;
  }
  if(/(چندتا انگشت داری)|(دست داری)|(پا داری)/.test(norm)){
    setEyes(eyeA, 'curious', 600);
    say(bubbleA, 'دوتا دست کوچولو دارم برای بغل کردن و دست دادن، ولی انگشت جدا جدا ندارم! ✋', 2600);
    return true;
  }
  if(/(بلدی بخونی)|(کتاب می‌?خونی)|(درس بلدی)/.test(norm)){
    setEyes(eyeA, 'curious', 700);
    say(bubbleA, pick(['کتاب که نمی‌خونم، ولی هرچی بهم بگی سریع یاد می‌گیرم!','خوندن بلد نیستم، ولی گوش دادن بهت رو خیلی خوب بلدم!']), 2800);
    return true;
  }
  if(/(بهترین دوستت من)|(دوستم هستی)|(رفیق منی)/.test(norm)){
    adjustAffection('a', 1);
    setEyes(eyeA, 'love', 800);
    say(bubbleA, pick(['معلومه که رفیقتم! 🤍','از امروز رسمی شد، ما رفیقیم!']), 2400);
    return true;
  }
  // "بامزه‌ای/خنگولی/شیطونی و..." small character-compliment catch-all, distinct
  // from the intelligence-compliment branch above
  if(/(بامزه‌ای)|(بامزه ای)|(چقدر شیطونی)|(چقدر خنگولی)/.test(norm)){
    adjustAffection('a', 1);
    setEyes(eyeA, 'delighted', 800);
    say(bubbleA, pick(['خب همینه که هستم دیگه! 😄','این شخصیتمه، دوستش داری؟']), 2400);
    return true;
  }
  // broad sentiment fallback — for anything that isn't one of the specific
  // patterns above but is clearly a positive or negative statement, react to
  // the feeling behind it instead of falling straight to a blank "متوجه نشدم".
  // This is a genuine last resort: it only fires after every more specific
  // check above has already had its chance.
  const positiveWords = ['قشنگ','عالیه','خوبه','دوست دارم','باحاله','خوشحالم','عاشقتم','فوق‌العاده','محشره','خفنه','توپه'];
  const negativeWords = ['بده','افتضاح','ناراحتم','متنفرم','خرابه','بی‌مزه','غمگین','ضعیفه'];
  if(positiveWords.some(w=> norm.includes(w))){
    setEyes(eyeA, 'happy', 700);
    say(bubbleA, pick(['خوشحالم که اینطور فکر می‌کنی! 😊','آره، منم همینو حس می‌کنم!','چقدر خوبه که اینو گفتی!']), 2200);
    return true;
  }
  if(negativeWords.some(w=> norm.includes(w))){
    setEyes(eyeB, 'cry', 700);
    say(bubbleB, pick(['اوه، ناراحت نباش، من پیشتم!','بذار یه کاری کنم حالت بهتر شه؟','همه چی درست میشه، قول میدم!']), 2400);
    return true;
  }
  return false;
}

// ---------- "what can you do?" — checked before ANY keyword/fuzzy matching ----------
// Broad net for every common way someone asks this. Matches by ROOT ("بلد"،
// "می‌تون"، "می‌دون"، "کارا"...) instead of one exact conjugated form, so
// "بلدی"، "بلدید"، "بلدین"، "میتونی"، "میتونید"، "میتونین"، "میدونی" and loose
// phrasings like "چی بلدی"، "کارایی که بلدی چیه"، "هرچی بلدی بگو" all land here.
function isCapabilityQuestionText(norm){
  const askRoots = ['چیکار','چی کار','چه کار','چکار','چیا','کارا','کاری','کارها','کارهایی','دستور','راهنما','هلپ','مهارت','قابلیت','توانایی'];
  const knowRoots = ['بلد','می تون','میتون','می دون','میدون','توانایی','قابلیت','مهارت'];
  const hasAsk = askRoots.some(w=> norm.includes(w));
  const hasKnow = knowRoots.some(w=> norm.includes(w));
  return (
    (hasAsk && hasKnow)
    || /(چه دستور|دستورات|دستورهات|راهنما|کمک کن|هلپ)/.test(norm)
    || (norm.includes('از دست') && (norm.includes('چیکار')||norm.includes('چی کار')) && (norm.includes('برمیاد')||norm.includes('بر میاد')))
    || ((norm.includes('قابلیت')||norm.includes('مهارت')||norm.includes('توانایی')) && /(چیه|چیست|چیا|چین)/.test(norm))
    || /(^|\s)چی\s+بلد/.test(norm)
    || /(هرچی بلدی)|(هرکاری بلدی)|(همه کاراتو بگو)|(همه کارات)/.test(norm)
  );
}

// ---------- a few other high-precision intents, also checked early ----------
// Same reasoning as the capability question above: these are unambiguous once
// matched (a math expression, an explicit "count in English" request, an
// explicit "tell me a proverb" request) but contain ordinary words/numbers
// that the generic fuzzy KEYWORDS pass could otherwise misfire on (e.g. the
// word "انگلیسی" also appears inside the unrelated "teach me a word" keyword
// list, so "به انگلیسی بشمار" was landing on that command instead of actually
// counting in English). Checking these before any keyword/fuzzy matching

  // here instead of letting it fall into generic keyword matching

    const faWordToNum = {'یک':1,'دو':2,'سه':3,'چهار':4,'پنج':5,'شش':6,'هفت':7,'هشت':8,'نه':9,'ده':10};
    const fa2enDigits = s => s.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
    const bare = norm.trim();
    let guessedNum = null;
    if(/^[\d۰-۹]+$/.test(bare)) guessedNum = parseInt(fa2enDigits(bare), 10);
    else if(faWordToNum[bare] !== undefined) guessedNum = faWordToNum[bare];
    if(guessedNum !== null){
      cmdInput.value = ''; cmdInput.blur();
      const target = pendingNumberGuess;
      pendingNumberGuess = null;
      const toFa = n => String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
      runWithScroll(()=>{
        if(guessedNum === target){
          setEyes(eyeA, 'delighted', 700);
          say(bubbleA, `آفرین! درست حدس زدی، عددش ${toFa(target)} بود! 🎉`, 2600);
        } else if(guessedNum < target){
          setEyes(eyeA, 'curious', 600);
          say(bubbleA, `نچ، بزرگ‌تر از ${toFa(guessedNum)}ه! دوباره حدس بزن یا یه کار دیگه بگو.`, 2600);
          pendingNumberGuess = target;
        } else {
          setEyes(eyeA, 'curious', 600);
          say(bubbleA, `نچ، کوچیک‌تر از ${toFa(guessedNum)}ه! دوباره حدس بزن یا یه کار دیگه بگو.`, 2600);
          pendingNumberGuess = target;
        }
      });
      return;
    }
  }
  // resolving a pending "did you mean X?" guess — a short yes/no reply answers
  // the question that was just asked instead of being parsed as a brand new,
  // unrelated command
  if(pendingSuggestion){
    const guess = pendingSuggestion;
    pendingSuggestion = null;
    if(/^(آره|بله|اره|درسته|دقیقا|آره درسته|همینه)$/.test(norm)){
      cmdInput.value = ''; cmdInput.blur();
      runWithScroll(()=>{ runMatchedAct(guess); lastTopic = guess; });
      return;
    }
    if(/^(نه|نچ|نه بابا|اصلا)$/.test(norm)){
      cmdInput.value = ''; cmdInput.blur();
      runWithScroll(()=>{
        setEyes(eyeA, 'shy', 500);
        say(bubbleA, pick(['باشه، ببخشید بد فهمیدم! دوباره بگو چی می‌خوای.','آهان باشه، یه‌بار دیگه واضح‌تر بگو.']), 2000);
      });
      return;
    }
    // anything else means the person just moved on — fall through and parse
    // this message normally instead of forcing a yes/no out of them
  }
  // resolving a pending "what should I be called?" — this is the actual most
  // common way people answer that question (just typing the name, with no
  // "اسمشو ... بذار" wrapper around it), which the explicit naming regex above
  // never catches on its own. Only claims a short, plain, command-free reply
  // as the name — anything else (a real command, a question, a sentence) drops
  // the pending state instead of misreading it as a name.
  const awaitingNameNegated = /(نمی\s?خوام)|(دلم نمیخواد)|(دلم نمی خواد)|(نکن)|(نه\s)|(اصلا نه)|^نه\b/.test(norm);
  if(awaitingName && !awaitingNameNegated){
    const bareCandidate = t.trim();
    const wordCount = bareCandidate.split(/\s+/).filter(Boolean).length;
    const looksLikeName = /^[آ-یA-Za-z۰-۹0-9\s]{2,20}$/.test(bareCandidate) && wordCount <= 3;
    const isKnownCommand = KEYWORDS.some(k=> k.words.some(w=> norm.includes(normalizeFa(w))));
    if(looksLikeName && !isKnownCommand){
      const key = awaitingName;
      awaitingName = null;
      const candidate = bareCandidate.replace(/(بذار|باشه|هست|است)$/,'').trim();
      setRobotName(key, candidate);
      noteAddressed(key);
      cmdInput.value = ''; cmdInput.blur();
      const eyes = key==='a' ? eyeA : eyeB, bubble = key==='a' ? bubbleA : bubbleB, mood = key==='a' ? moodA : moodB;
      runWithScroll(()=>{
        setEyes(eyes, 'love', 900);
        say(bubble, `${candidate}! چه اسم قشنگی، از این‌به‌بعد اسمم همینه 😊`, 2800);
        setMood(mood, 'اسم جدید گرفت');
      });
      return;
    }
    // whatever they typed wasn't a plausible name — drop the pending ask so it
    // doesn't wrongly swallow some unrelated later message instead
    awaitingName = null;
  }
  // recognizing being called by name — if either robot has been given a name,
  // hearing it perks that one up specifically and marks it as "the one being
  // addressed" for any ambiguous naming/question that follows. If the whole
  // message is just the name, answer with a direct "جانم؟" instead of falling
  // through to the generic echo/confused handling below.
  let calledKey = null;
  if(robotName.a && norm.includes(normalizeFa(robotName.a))) calledKey = 'a';
  if(robotName.b && norm.includes(normalizeFa(robotName.b))) calledKey = calledKey ? calledKey : 'b';
  if(calledKey){
    noteAddressed(calledKey);
    const onlyName = norm === normalizeFa(robotName[calledKey]);
    if(onlyName){
      const eyes = calledKey==='a' ? eyeA : eyeB, bubble = calledKey==='a' ? bubbleA : bubbleB;
      cmdInput.value = ''; cmdInput.blur();
      runWithScroll(()=>{
        setEyes(eyes, 'happy', 500);
        say(bubble, pick(['جانم؟ 😊','بله؟ اینجام!','گوش می‌دم، بگو!']), 1800);
      });
      return;
    }
  }
  // negation check first — "نرقص"، "دلم نمی‌خواد بغلش کنی"، "نه، بازی نه" should
  // decline instead of running the action anyway, so the robot reacts to what
  // was actually asked (a refusal) rather than just spotting the verb
  const isNegated = /(نمی\s?خوام)|(دلم نمیخواد)|(دلم نمی خواد)|(نکن)|(نه\s)|(اصلا نه)|^نه\b|(دوست ندارم)|(حوصله\s?اش?\s?ن?دارم)|(حالشو ندارم)|(حسش نیست)|(بی\s?خیالش)|(نمیشه انجامش بدی)|(حوصلمو نداره)|(خوشم نمیاد)|(بدم میاد)|(اصلا دوست ندارم)|(نمی‌خوام)|(میلش نیست)|(حال ندارم)/.test(norm);
  // ---------- compound-sentence understanding ----------
  // "برقص و بعد بغلش کن" carries two separate requests, not one long unrecognized
  // sentence — splitting on common connectors and matching each piece on its own
  // catches this instead of only ever grabbing whichever single keyword happens
  // to be the longest match across the whole sentence
  if(!isNegated){
    const clauses = norm.split(/\s+(?:و بعد|بعد از اون|بعدش|بعد|همینطور|همچنین|و همچنین|و بعدشم|و|هم)\s+/).filter(Boolean);
    if(clauses.length >= 2){
      const clauseMatches = [];
      for(const part of clauses){
        let best = null, bl = 0;
        for(const k of KEYWORDS){
          for(const w of k.words){
            const nw = normalizeFa(w);
            if(part.includes(nw) && nw.length > bl){ best = k.act; bl = nw.length; }
          }
        }
        if(best && !clauseMatches.includes(best)) clauseMatches.push(best);
      }
      if(clauseMatches.length >= 2){
        cmdInput.value = ''; cmdInput.blur();
        runWithScroll(()=>{
          setEyes(eyeA, 'happy', 400);
          say(bubbleA, 'چشم، اول این‌کارو می‌کنم، بعدش اون‌یکی رو! 😊', 1800);
          smartRunAction(clauseMatches[0]);
          lastTopic = clauseMatches[0];
          setTimeout(()=>{ if(!busy) smartRunAction(clauseMatches[1]); }, 2600);
        });
        return;
      }
    }
  }
  // ---------- token-set matching (order/adjacency independent) ----------
  // the exact substring pass below requires an entire multi-word phrase to
  // appear back-to-back in that exact order, so ANY natural insertion or
  // reordering ("دست بندازید سرش" said as "دست تو سرش بنداز" یا "سرش دست
  // بنداز") falls straight through even though every real word of the phrase
  // is right there. This checks whether every meaningful word of a listed
  // phrase shows up ANYWHERE in the sentence — any order, any spacing,
  // conjugations included via stem() — the same leniency a person actually
  // extends when they "get" what someone means despite unusual phrasing.
  // Deliberately skips single-word phrases (the exact pass already covers
  // those) and requires 2+ real content words to match, so it never fires on
  // a single stray word floating in an unrelated sentence.
  // "بلدی"/"میتونی" و ریشه‌هاشون دیگه توسط stripFillers حذف نمی‌شن (برای اینکه
  // سوال «چه کارایی بلدی؟» درست تشخیص داده بشه)، پس اینجا هم به‌عنوان کلمه‌ی
  // عمومی نادیده گرفته می‌شن تا باعث تطبیق اشتباه با عبارت‌های چندکلمه‌ای نشن
  const TOKEN_STOPWORDS = new Set(['این','رو','که','هست','است','تو','من','به','برای','با','از','در','یه','یک','هم','را','بود','شد','شده','دیگه','چی','چیه','یکم','یک‌کم','و','یا','اگه','باید','فقط','بلدی','بلدید','بلدین','میتونی','میتونید','میتونین','می تونی']);
  function tokenSetMatch(){
    const msgTokens = norm.split(' ').filter(Boolean);
    if(msgTokens.length < 2) return null;
    const msgStems = new Set(msgTokens.map(stem));
    const msgRaw = new Set(msgTokens);
    // same-sound letter swaps ("توتی" for "طوطی") folded too, so a phrase typed
    // with the "wrong" but identical-sounding letter still counts as present
    const msgFolded = new Set(msgTokens.map(phoneticFold));
    let best = null, bestScore = 0;
    for(const k of KEYWORDS){
      for(const w of k.words){
        const parts = normalizeFa(w).split(' ').filter(Boolean).filter(p=> p.length >= 2 && !TOKEN_STOPWORDS.has(p));
        if(parts.length < 2) continue;
        const allPresent = parts.every(p=> msgRaw.has(p) || msgStems.has(p) || msgRaw.has(stem(p)) || msgFolded.has(phoneticFold(p)));
        if(allPresent && parts.length > bestScore){ best = k.act; bestScore = parts.length; }
      }
    }
    return best;
  }
  // score every keyword match by how many words of the phrase it covers, so a
  // longer, more specific phrase ("سنگ کاغذ قیچی") wins over a shorter generic
  // one that happens to be a substring of the same sentence
  let matched = null, bestLen = 0;
  for(const k of KEYWORDS){
    for(const w of k.words){
      const nw = normalizeFa(w);
      if(norm.includes(nw) && nw.length > bestLen){ matched = k.act; bestLen = nw.length; }
    }
  }
  if(!matched) matched = tokenSetMatch();
  // fuzzy fallback — only kicks in if nothing matched exactly, so it never
  // overrides a clean hit. Compares each typed word (and its stemmed base form,
  // so an unlisted conjugation like "برقصیدیم" still lines up with "برقص")
  // against each keyword word with a small edit-distance budget, catching
  // typos like "برقصص" or "بغلـ" that the exact check misses. A genuinely loose
  // guess (distance > 0) is held as pendingSuggestion and confirmed with the
  // user first rather than acted on silently.
  //
  // a few KEYWORDS phrases are multi-word ("این چیه دیگه") and splitting them
  // into parts used to let a plain grammatical word like "چیه" or "این" count
  // as an exact fuzzy match all on its own — so ANY sentence ending in "چیه"
  // (e.g. "اسمت چیه؟", "رنگت چیه؟") got silently hijacked into the wrong
  // action before it ever reached the real question-answering logic below.
  // Skipping these generic connector/pronoun/interrogative fragments keeps
  // fuzzy matching for genuine typos of distinctive words only.
  const FUZZY_STOPWORDS = new Set(['این','چیه','چیست','کیه','کیست','رو','که','هست','است','تو','من','به','برای','با','از','در','یه','یک','هم','را','بود','شد','شده','دیگه','چی','چرا','کجا','کدوم','هستی','بودی','بلدی','بلدید','بلدین','میتونی','میتونید','میتونین','میدونی','میدونید','چیکار','چیکارا','چیکارها','کارا','کاری','کارها','کارهایی','دستور','دستورات','راهنما','مهارت','قابلیت','توانایی']);
  let weakGuess = false;
  if(!matched){
    const tokens = norm.split(' ').filter(Boolean);
    let bestScore = 0;
    for(const k of KEYWORDS){
      for(const w of k.words){
        const wordParts = normalizeFa(w).split(' ').filter(Boolean);
        for(const wp of wordParts){
          if(wp.length < 3 || FUZZY_STOPWORDS.has(wp)) continue;
          for(const tok of tokens){
            // skip common question/filler words on the MESSAGE side too — the
            // check above only ever filtered the keyword-list side (wp), so a
            // generic word like "بلدین" or "چیکارا" typed by the user could
            // still fuzzy-match some unrelated keyword fragment (e.g. "بلدین"
            // landing within edit-distance of "بلند" from "بلند بخند") and
            // silently hijack a "what can you do" question into "منظورت
            // «بخند» بود؟" instead of ever answering it. Skipping stopword
            // tokens here closes that off for every fuzzy match, not just the
            // capability question.
            if(FUZZY_STOPWORDS.has(tok) || FUZZY_STOPWORDS.has(stem(tok))) continue;
            for(const candidate of [tok, stem(tok)]){
              if(Math.abs(candidate.length - wp.length) > 2) continue;
              // fold same-sound letters (ص/س، ط/ت، ظ/ز...) on both sides first —
              // a spelling that only differs by one of these swaps is the SAME
              // word to a Persian ear, so it shouldn't cost any of the typo budget
              // or get treated as a mere "weak guess" needing confirmation
              const dist = levenshtein(phoneticFold(candidate), phoneticFold(wp));
              if(dist <= fuzzyTolerance(wp.length) && wp.length > bestScore){
                matched = k.act; bestScore = wp.length; weakGuess = dist > 0;
              }
            }
          }
        }
      }
    }
  }
  if(weakGuess && matched){
    pendingSuggestion = matched;
    cmdInput.value = ''; cmdInput.blur();
    runWithScroll(()=>{
      setEyes(eyeA, 'curious', 600);
      say(bubbleA, `منظورت «${ACTION_LABELS[pendingSuggestion] || pendingSuggestion}» بود؟ 🤔`, 2600);
    });
    return;
  }
  // "کاری نکن" / "هیچ کاری نکن" trip the generic negation check below (they
  // contain "نکن"), but for the quiet/stand-by command that phrasing *is* the
  // instruction itself, not a decline of some other action — so it must never
  // get swallowed by the "باشه، اون‌کارو نمی‌کنم" branch
  if(matched && isNegated && matched !== 'quietmode' && !/(دوست دارم)|(می\s?خوام)\s*بکن/.test(norm)){
    cmdInput.value = ''; cmdInput.blur();
    runWithScroll(()=>{
      setEyes(eyeA, 'shy', 500);
      say(bubbleA, pick(['باشه، اون‌کارو نمی‌کنم!','چشم، بی‌خیالش میشم.','باشه باشه، قبول!']), 1800);
    });
    return;
  }
  cmdInput.value = '';
  cmdInput.blur();
  runWithScroll(()=>{
    if(calledKey){
      // a quick acknowledging glance from the specific robot that was called by
      // name, layered on top of whatever the rest of the sentence triggers
      setEyes(calledKey==='a' ? eyeA : eyeB, 'happy', 350);
    }
    if(matched === 'focus'){
      togglePomodoro(null);
      lastTopic = 'focus';
    } else if(matched === 'soundtoggle'){
      toggleSoundFromText();
      lastTopic = 'soundtoggle';
    } else if(matched === 'automode'){
      toggleAutoModeFromText();
      lastTopic = 'automode';
    } else if(matched === 'quietmode'){
      setQuietMode(true);
      lastTopic = 'quietmode';
    } else if(matched === 'activemode'){
      setQuietMode(false);
      lastTopic = 'activemode';
    } else if(matched === 'facechange'){
      cycleFaceFromText();
      lastTopic = 'facechange';
    } else if(matched === 'gfxlow'){
      setGraphicsFromText('low');
      lastTopic = 'gfxlow';
    } else if(matched === 'gfxhigh'){
      setGraphicsFromText('high');
      lastTopic = 'gfxhigh';
    } else if(matched === 'particlestoggle'){
      toggleParticlesFromText();
      lastTopic = 'particlestoggle';
    } else if(matched === 'settingsopen'){
      openSettingsFromText();
      lastTopic = 'settingsopen';
    } else if(matched){
      const isRepeat = matched === lastMatchedAction;
      repeatStreak = isRepeat ? repeatStreak + 1 : 0;
      lastMatchedAction = matched;
      if(matched === 'echoback') echoTarget = priorText;
      // round 14 — hidden bonus combo: "دست بده" (handshake) immediately
      // followed by "بغل" (hug) unlocks a secret move that isn't listed
      // anywhere and can't be typed directly, for people who experiment
      if(lastComboAct === 'handshake' && matched === 'hug'){
        lastComboAct = '';
        smartRunAction('secretcombo');
        lastTopic = 'secretcombo';
        cmdInput.value = ''; cmdInput.blur();
        return;
      }
      lastComboAct = matched;
      smartRunAction(matched);
      lastTopic = matched;
      if(repeatStreak >= 2){
        const bubble = Math.random() < 0.5 ? bubbleA : bubbleB;
        setTimeout(()=> say(bubble, pick(['بازم همینو می‌خوای؟ باشه، ولت نمی‌کنم! 😄','چقدر این حرکتو دوست داری‌ها!','بازم؟ منم که خسته نمیشم!']), 2200), 2600);
      }
    } else if(isForeignText(t)){
      // a genuinely non-Persian message gets an honest, in-character "I only
      // speak Persian" reaction instead of being echoed back verbatim or
      // shrugged off with the generic confused line
      setEyes(eyeA, 'shock', 500);
      say(bubbleA, pick(['پشمام! این چی بود، خارجی حرف زدی؟ 😳 من فقط فارسی بلدم‌ها!','هوم، این کلمه‌ها رو نمی‌شناسم... فارسی بگو برام، فارسی بلدم فقط!','چی گفتی؟! من انگلیسی یا هرچی این بود بلد نیستم، فارسی حرف بزن باهام 😅']), 2800);
      setMood(moodA, 'گیج');
    } else if(trySmartReply(norm)){
      // handled directly inside trySmartReply — real context (time, battery,
      // a remembered name) instead of a generic canned line
    } else if(/(؟|چیه$|چیست$|کیه$|کجاست$|چرا |چطور |کدوم )/.test(norm)){
      // a question-shaped message that matched nothing specific still gets an
      // honest, in-character "I don't know that one" instead of the generic
      // command-flavored confused line — a toy admitting a gap in what it
      // knows reads as more alive than shrugging at an unrecognized command
      setEyes(eyeA, 'curious', 600);
      say(bubbleA, pick(['هوم، این سوالو هنوز جواب یاد نگرفتم، ولی باحاله! یه چیز دیگه بپرس 🤔','این یکی رو نمی‌دونم، ولی هرچی بخوای انجام بدم رو بلدم!','خوب سوالیه‌ها، ولی جوابشو ندارم! بگو چیکار کنم برات؟']), 2800);
      setMood(moodA, 'کنجکاو');
    } else if(Math.random() < 0.4){
      // "Talking Toy" skill from the real manual: Eilik can record what you
      // say and repeat it back — for anything that isn't a recognized command,
      // it sometimes just echoes your exact words instead of looking confused
      setEyes(eyeB, 'shock', 260);
      say(bubbleB, '🎙️ ضبط شد...', 500);
      setTimeout(()=>{
        setEyes(eyeB, null);
        say(bubbleB, `«${t}»`, 1800);
        setMood(moodB, 'داره تکرار می‌کنه');
      }, 550);
    } else {
      say(bubbleA, pick(confusedLines));
      setMood(moodA, 'گیج');
    }
  });
}

// noticing a genuine gap since the last thing typed — tapping back into the

// ---------- power-on boot sequence ----------
// the real Eilik's screen is dark until it's switched on, then it visibly "wakes":
// the visor lights up, the eyes snap to a startled-then-happy look, and the round
// base gives a little wobble as it settles — like it just got set down on a shelf
function bootUp(pose, eyes, mood, delay){
  const visor = eyes[0].closest('.visor');
  eyes.forEach(e=> e.style.opacity = '0');
  if(visor) visor.style.filter = 'brightness(.25)';
  setTimeout(()=>{
    if(visor) visor.style.transition = 'filter .15s ease';
    if(visor) visor.style.filter = '';
    eyes.forEach(e=> e.style.opacity = '');
    // rising power-on chime, like the little startup jingle real electronics play
    tone(392,0,.1,'triangle',.05); tone(523,.09,.1,'triangle',.05); tone(659,.18,.14,'triangle',.06);
    setEyes(eyes, 'shock', 320);
    setTimeout(()=> setEyes(eyes, 'happy', 650), 300);
    pose.classList.add('land');
    setTimeout(()=> pose.classList.remove('land'), 950);
    setMood(mood, 'روشن شدم!');
  }, delay);
}
bootUp(poseA, eyeA, moodA, 500);
bootUp(poseB, eyeB, moodB, 1150);

// ---------- phone shake → real vibration-sensor reaction ----------
// the real Eilik has a physical vibration motor and sensor and reacts if you
// pick it up and shake it, exactly like actShaken() above (used today by the
// rapid-tap gesture). On a phone, the accelerometer is the direct equivalent
// of that sensor, so a genuine shake of the device triggers the same dizzy
// reaction — this only matters once the game is actually running on a phone,
// which is the whole point of packaging it as one.
const motionBtn = document.getElementById('motionBtn');
let motionActive = false;
let lastShakeAt = 0;
function handleMotion(e){
  const a = e.accelerationIncludingGravity || e.acceleration;
  if(!a) return;
  const mag = Math.abs(a.x||0) + Math.abs(a.y||0) + Math.abs(a.z||0);
  const now = Date.now();
  if(mag > 34 && now - lastShakeAt > 1500){
    lastShakeAt = now;
    markActivity();
    if(poweredOff.a || poweredOff.b){ rebootRobots(); return; }
    if(busy) return;
    // the busy-lock is global to this build (only one gesture animates at a
    // time), so a real shake reacts with whichever robot is actually free —
    // same as how every other gesture in this file already behaves
    if(!docked.a) actShaken(robotA, eyeA, bubbleA, moodA, poseA);
    else if(!docked.b) actShaken(robotB, eyeB, bubbleB, moodB, poseB);
  }
}
function startMotion(){
  window.addEventListener('devicemotion', handleMotion);
  motionActive = true;
  motionBtn.title = 'لرزوندن گوشی فعاله';
  motionBtn.classList.add('on');
}
// only surface the button at all on devices that actually report motion —
// no point cluttering a desktop mouse session with a phone-only control
if(typeof DeviceMotionEvent !== 'undefined'){
  motionBtn.hidden = false;
  motionBtn.addEventListener('click', ()=>{
    if(motionActive) return;
    // iOS 13+ requires a real tap to grant motion-sensor access; everywhere
    // else (Android, desktop browsers that expose it) it just works
    if(typeof DeviceMotionEvent.requestPermission === 'function'){
      DeviceMotionEvent.requestPermission().then(state=>{
        if(state === 'granted') startMotion();
        else { motionBtn.title = 'اجازه داده نشد'; }
      }).catch(()=>{ motionBtn.title = 'این دستگاه پشتیبانی نمی‌کنه'; });
    } else {
      startMotion();
    }
  });
}

// ---------- microphone → real sound-recognition reaction ----------
// Energize Lab's own material specifically calls out sound recognition as a
// sensor input (separate from the touch/vibration ones already wired up) —
// the real toy visibly perks up toward a sudden loud noise or a clap nearby.
// This reads live mic volume locally in the browser only (nothing is
// recorded, saved, or sent anywhere) and reacts the same way to a real
// spike in the room.
const micBtn = document.getElementById('micBtn');
let micActive = false;
let lastSoundAt = 0;
function reactToSound(){
  if(poweredOff.a || poweredOff.b){ rebootRobots(); return; }
  if(busy) return;
  markActivity();
  ['a','b'].forEach(key=>{
    if(docked[key]) return;
    const eyes = key === 'a' ? eyeA : eyeB;
    const bubble = key === 'a' ? bubbleA : bubbleB;
    const mood = key === 'a' ? moodA : moodB;
    setEyes(eyes, 'shock', 260);
    setMood(mood, 'یه صدا شنیدم!');
    setTimeout(()=>{
      setEyes(eyes, 'curious', 500);
      setTimeout(()=> setEyes(eyes, null), 500);
    }, 260);
  });
  say(bubbleA, pick(['این صدا چی بود؟! 👂','وای صدا اومد!']), 1400);
}
function startMic(stream){
  try{
    ensureAudio();
    const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const source = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    let baseline = 8; // rolling ambient noise floor, so a quiet vs noisy room both calibrate correctly
    // ---- beat detection: Eilik's own manual specifically calls out dancing along
    // to nearby music as a sound-recognition skill, distinct from just startling at
    // one loud bang. A single spike (a clap, a knock) still triggers reactToSound()
    // below; several softer spikes landing at roughly evenly-spaced intervals — the
    // signature of a kick/snare pulse — instead reads as music playing and starts
    // the same actGroove() routine the manual "دنس" command already plays.
    let beatTimes = [];
    let lastBeatPeak = 0;
    let lastGrooveStarted = 0;
    function checkForMusic(now){
      if(beatTimes.length < 4) return false;
      const gaps = [];
      for(let i=1;i<beatTimes.length;i++) gaps.push(beatTimes[i]-beatTimes[i-1]);
      const mean = gaps.reduce((s,g)=>s+g,0)/gaps.length;
      if(mean < 250 || mean > 1100) return false; // outside plausible musical tempo range
      const variance = gaps.reduce((s,g)=> s+(g-mean)*(g-mean), 0)/gaps.length;
      const evenness = Math.sqrt(variance)/mean;
      return evenness < 0.35; // fairly regular spacing, not random noise
    }
    let pollFrame = 0;
    function poll(){
      // skip the actual analysis on hidden tabs and every other frame — mic
      // reaction doesn't need full 60fps precision, and this alone roughly
      // halves this loop's ongoing CPU cost, which matters since it's the one
      // JS loop in the whole page that runs every single frame indefinitely
      pollFrame++;
      if(document.hidden || pollFrame % 2 !== 0){ requestAnimationFrame(poll); return; }
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for(let i=0;i<data.length;i++) sum += data[i];
      const level = sum / data.length;
      baseline = baseline * 0.98 + level * 0.02; // slow adaptive floor
      const now = Date.now();
      // softer, more frequent peak used only to time musical beats
      if(level > baseline + 14 && level > 12 && now - lastBeatPeak > 250){
        lastBeatPeak = now;
        beatTimes.push(now);
        beatTimes = beatTimes.filter(t=> now - t < 4000);
        if(!busy && now - lastGrooveStarted > 9000 && checkForMusic(now)
           && !(poweredOff.a || poweredOff.b) && !docked.a && !docked.b){
          lastGrooveStarted = now;
          beatTimes = [];
          actGroove();
        }
      }
      if(level > baseline + 26 && level > 18 && now - lastSoundAt > 1800){
        lastSoundAt = now;
        reactToSound();
      }
      requestAnimationFrame(poll);
    }
    poll();
    micActive = true;
    micBtn.title = 'واکنش به صدا فعاله';
    micBtn.classList.add('on');
  }catch(e){
    micBtn.title = 'مشکلی توی دسترسی به میکروفون بود';
  }
}
micBtn.addEventListener('click', ()=>{
  if(micActive) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    micBtn.title = 'این مرورگر پشتیبانی نمی‌کنه';
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio:true })
    .then(startMic)
    .catch(()=>{ micBtn.title = 'اجازه داده نشد'; });
});

// ---------- ambient light awareness ----------
// the real Eilik has a light sensor and dims/behaves sleepier in a dark room —
// the closest equivalent here is the visitor's actual local clock: late at
// night the visors default a touch dimmer and both robots lean toward their
// sleepier idle branches sooner, exactly like the physical toy winding down
// once the lights go off around it. Gated behind the "حالت شب خودکار" setting
// so someone working a night shift can opt out of the auto-dim entirely.
const nowHour = new Date().getHours();
const isNightHours = (nowHour >= 23 || nowHour < 6) && appSettings.nightAuto;
if(isNightHours){
  document.body.classList.add('night-mode');
  setTimeout(()=>{
    document.querySelectorAll('.visor').forEach(v=> v.style.filter = 'brightness(.82)');
  }, 2200); // after the boot chime finishes so it doesn't undercut the power-on flourish
}

// ---------- settings panel (sound / graphics / particles / night mode) ----------
const settingsBtn = document.getElementById('settingsBtn');
const settingsBackdrop = document.getElementById('settingsBackdrop');
const settingsClose = document.getElementById('settingsClose');
const soundToggleEl = document.getElementById('soundToggle');
const particlesToggleEl = document.getElementById('particlesToggle');
const nightAutoToggleEl = document.getElementById('nightAutoToggle');
const gfxSegmented = document.getElementById('gfxSegmented');

soundToggleEl.checked = soundOn;
particlesToggleEl.checked = appSettings.particles;
nightAutoToggleEl.checked = appSettings.nightAuto;
gfxSegmented.querySelectorAll('.seg-btn').forEach(b=> b.classList.toggle('active', b.dataset.val === appSettings.graphics));
if(appSettings.graphics === 'low') document.body.classList.add('lite-gfx');

function openSettings(){
  settingsBackdrop.hidden = false;
  settingsBtn.classList.add('spun');
}
function closeSettings(){
  settingsBackdrop.hidden = true;
  settingsBtn.classList.remove('spun');
}
settingsBtn.addEventListener('click', ()=>{
  if(settingsBackdrop.hidden) openSettings(); else closeSettings();
});
settingsClose.addEventListener('click', closeSettings);
settingsBackdrop.addEventListener('click', (e)=>{ if(e.target === settingsBackdrop) closeSettings(); });

soundToggleEl.addEventListener('change', ()=>{
  soundOn = soundToggleEl.checked;
  saveSettings({ sound: soundOn });
  if(soundOn){ ensureAudio(); tone(700,0,.08,'triangle',.06); }
});
particlesToggleEl.addEventListener('change', ()=>{
  appSettings.particles = particlesToggleEl.checked;
  saveSettings({ particles: appSettings.particles });
});
nightAutoToggleEl.addEventListener('change', ()=>{
  appSettings.nightAuto = nightAutoToggleEl.checked;
  saveSettings({ nightAuto: appSettings.nightAuto });
  // only meaningfully reversible for turning it OFF at runtime — flipping it
  // back ON mid-session doesn't retroactively re-run the boot-time dim check,
  // which mirrors how the real toy's ambient dimming only re-evaluates on its
  // own next wake cycle rather than instantly
  if(!appSettings.nightAuto){
    document.body.classList.remove('night-mode');
    document.querySelectorAll('.visor').forEach(v=> v.style.filter = '');
  }
});
gfxSegmented.querySelectorAll('.seg-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    gfxSegmented.querySelectorAll('.seg-btn').forEach(b=> b.classList.remove('active'));
    btn.classList.add('active');
    appSettings.graphics = btn.dataset.val;
    saveSettings({ graphics: appSettings.graphics });
    document.body.classList.toggle('lite-gfx', appSettings.graphics === 'low');
  });
});
</script>

var TAPSELL_APP_KEY        = "irtmspgkejlleofcjcgkqiolmgckfijiekdcnebqeqbdoodocjmjnphnepcmddqakqbdqc";
var TAPSELL_BANNER_ZONE    = "6a85b5485c9b7478ba5bf0a7";

var interstitialResponseId = null;
var INTERSTITIAL_MIN_GAP_MS = 3 * 60 * 1000; // حداقل ۳ دقیقه بین دو تبلیغ تمام‌صفحه
var lastInterstitialShown = 0;
var adCommandCounter = 0; // شمارنده‌ی دستورهایی که کاربر به ربات‌ها داده

function requestNextInterstitial(){
  if (typeof tapsell === 'undefined') return;
  tapsell.requestAd(TAPSELL_INTERSTITIAL_ZONE, false, function(result){
    if (result && result['action'] === 'onAdAvailable') {
      interstitialResponseId = result['adId'];
    }
  });
}

function maybeShowInterstitial(){
  if (typeof tapsell === 'undefined' || !interstitialResponseId) return;
  var now = Date.now();
  if (now - lastInterstitialShown < INTERSTITIAL_MIN_GAP_MS) return;
  tapsell.showAd(interstitialResponseId, false, false, false, false);
  lastInterstitialShown = now;
  interstitialResponseId = null;
  // بعد از نمایش، برای دفعه بعد دوباره یکی می‌گیریم
  setTimeout(requestNextInterstitial, 5000);
}

document.addEventListener('deviceready', function () {
  if (typeof tapsell === 'undefined') {
    console.log('پلاگین تپسل لود نشده - فقط داخل اپ اندروید ساخته‌شده با کوردوا کار می‌کنه، نه توی مرورگر');
    return;
  }

  tapsell.initialize(TAPSELL_APP_KEY);

  // بنر ثابت پایین صفحه (کوچیک و کم‌مزاحم)
  setTimeout(function(){

  setTimeout(maybeShowInterstitial, 20000);

  // هر بار که کاربر یه دستور/بازی رو تموم می‌کنه می‌تونی maybeShowInterstitial() رو صدا بزنی

  document.addEventListener('onAdClosed', requestNextInterstitial);
  document.addEventListener('onError', function(){ setTimeout(requestNextInterstitial, 15000); });

}, false);
