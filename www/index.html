<script>
const robotA = document.getElementById('robotA');
const robotB = document.getElementById('robotB');
const poseA = document.getElementById('poseA');
const poseB = document.getElementById('poseB');
const eyeA = [document.getElementById('eyeA1'), document.getElementById('eyeA2')];
const eyeB = [document.getElementById('eyeB1'), document.getElementById('eyeB2')];
const mouthA = document.getElementById('mouthA');
const mouthB = document.getElementById('mouthB');
const mouthFor = new Map([[eyeA, mouthA], [eyeB, mouthB]]);
const bubbleA = document.getElementById('bubbleA');
const bubbleB = document.getElementById('bubbleB');
const moodA = document.getElementById('moodA');
const moodB = document.getElementById('moodB');
const scene = document.getElementById('scene');
const stage = document.getElementById('stage');
const ball = document.getElementById('ball');
const dock = document.getElementById('dock');

let busy = false;
let autoMode = false;
// quiet/stand-by mode — when true, both robots stop doing anything on their own
// (no spontaneous togetherness, no auto-mode ticks, no idle "party" beats) and
// just sit there attentively, exactly like pressing the real toy's hold/mute
// gesture. They keep listening the whole time: any typed command still runs
// normally and immediately takes them back out of quiet mode.
let quietMode = false;
// a command typed while a robot is mid-animation used to just get silently
// dropped (every act function bails out early with "if(busy) return"). This
// remembers the most recently requested action so it fires the instant the
// current one finishes, instead of the person's word being ignored — matches
// "listens no matter what it's doing" without needing to hard-cut every one
// of the ~55 animations mid-frame, which would look glitchy.
let queuedActionKey = null;
let lastSpontaneous = 0; // throttle for the unprompted together-moments added to actIdleShuffle below
let lastMemoryCallback = 0; // throttle for unprompted references to remembered facts/name
let autoTimer = null;
let sleepTimer = null;

// ---------- organic motor jitter ----------
// a real servo-driven toy never repeats an idle cycle at an identical, perfectly
// even tempo — small load/friction/battery variance nudges the timing every
// cycle. A CSS animation on a fixed loop reads as a GIF; re-rolling the
// bobwrap's duration (and restarting it) by a few percent on every cycle keeps
// the rocking feeling like a motor holding a rough rhythm rather than a
// looping clip. Runs independently per robot so they never fall back into
// perfect sync with each other.
function jitterLoop(el, baseMs){
  if(!el) return;
  const wobble = baseMs * (0.9 + Math.random()*0.2); // ±10%
  el.style.animationDuration = wobble.toFixed(0) + 'ms';
  setTimeout(()=> jitterLoop(el, baseMs), wobble);
}
document.querySelectorAll('.robot-a .bobwrap, .robot-a .rshadow').forEach(el=> jitterLoop(el, 3100));
document.querySelectorAll('.robot-b .bobwrap, .robot-b .rshadow').forEach(el=> jitterLoop(el, 3600));

// ---------- evolving personality ----------
// Energize Lab's own material is explicit about this: Eilik's personality
// evolves based on how it's treated — gentle handling (petting, tickling)
// makes it warmer over time, while frequent rough handling (shaking it,
// repeated hard pokes to the head) makes it noticeably naughtier. This tracks
// a small affection score per robot, saved so it carries over the next time
// this page is opened, just like the personality on the real toy persists
// between charges rather than resetting every session.
const AFF_KEY = { a:'eilik_affection_a', b:'eilik_affection_b' };
const affection = { a:0, b:0 };
try{
  affection.a = parseInt(localStorage.getItem(AFF_KEY.a), 10) || 0;
  affection.b = parseInt(localStorage.getItem(AFF_KEY.b), 10) || 0;
}catch(e){}
function robotKey(r){ return r === robotA ? 'a' : 'b'; }

// ---------- remembering the user's name ----------
// small persistent memory (same localStorage already used for affection/battery)
// so the pair can actually address the person by name once told it — a concrete,
// checkable sign of "understanding" something instead of only reacting blindly
let userName = '';
try{ userName = localStorage.getItem('eilik_username') || ''; }catch(e){}

// ---------- long-term memory: facts learned about the person ----------
// beyond just a name, the pair can now hold onto specific things the person
// tells them ("غذای موردعلاقم پیتزاست", "رنگ موردعلاقم آبیه") and actually
// recall them correctly later when asked — real persistent knowledge instead
// of a single name slot, which is what makes them start to feel like they
// know the person rather than just reacting to whatever was typed last
let userFacts = {};
try{ userFacts = JSON.parse(localStorage.getItem('eilik_userfacts') || '{}'); }catch(e){ userFacts = {}; }
function rememberFact(category, value){
  userFacts[category] = value;
  try{ localStorage.setItem('eilik_userfacts', JSON.stringify(userFacts)); }catch(e){}
}
// ---------- a custom taught move (round 20) ----------
// stored the same way as userFacts — the person can name a made-up move on
// the spot ("یه حرکت جدید به اسم X یادت میدم") and the robots genuinely
// remember that exact name afterward and reference it later, instead of the
// "learning" always being a canned/generic line
let customMoveName = '';
try{ customMoveName = localStorage.getItem('eilik_custommove') || ''; }catch(e){}
function rememberMove(name){
  customMoveName = name;
  try{ localStorage.setItem('eilik_custommove', name); }catch(e){}
}
// ---------- a simple personal diary (round 21) ----------
// distinct from userFacts (single-value categories like favorite color) and
// customMoveName (one taught move) — this holds a running list of freeform
// notes the person actually dictates, each with its own real timestamp, so
// "چی نوشتم توی دفترچه" recalls genuine dated entries instead of one slot
let diaryEntries = [];
try{ diaryEntries = JSON.parse(localStorage.getItem('eilik_diary') || '[]'); }catch(e){ diaryEntries = []; }
function addDiaryEntry(text){
  diaryEntries.push({ text, ts: Date.now() });
  if(diaryEntries.length > 20) diaryEntries = diaryEntries.slice(-20);
  try{ localStorage.setItem('eilik_diary', JSON.stringify(diaryEntries)); }catch(e){}
}
function formatDiaryDate(ts){
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
// ---------- how long we've known each other ----------
// stamped the very first time the pair is ever talked to, on this device —
// lets them answer "از کی همو می‌شناسیم؟" with a real, growing number instead
// of a canned line, the same way a real companion's relationship deepens the
// longer you've had it
let firstMetAt = 0;
try{
  firstMetAt = parseInt(localStorage.getItem('eilik_first_met'), 10) || 0;
  if(!firstMetAt){ firstMetAt = Date.now(); localStorage.setItem('eilik_first_met', String(firstMetAt)); }
}catch(e){}
function daysTogether(){ return Math.max(0, Math.floor((Date.now() - firstMetAt) / 86400000)); }

// ---------- short-term conversation memory ----------
// tracks what the last exchange was about so a short one-word follow-up
// ("چرا؟", "واقعا؟", "باشه") can get a reply that actually relates to what was
// just said, instead of falling through to the generic confused/echo lines —
// this is a light, honest version of "remembering the topic", not a full chat log
let lastTopic = '';
// notices when the exact same command is asked for again right after itself,
// so a third "برقص" in a row gets an aware little comment instead of silently
// replaying the identical clip as if it were the first time
let lastMatchedAction = null;
let repeatStreak = 0;
// notices real elapsed time since the last thing typed — coming back to the
// input after a genuine gap gets an aware "you were gone a while" reaction
// instead of treating every visit as identical to the last one
let lastCommandAt = 0;
let welcomedBack = false;
// a fuzzy match that's only a loose guess (not a clean hit) gets confirmed
// with the user first ("منظورت رقص بود؟") instead of silently acting on a
// guess — this holds that guess until the next message answers yes or no
let pendingSuggestion = null;
// holds the message typed right before the current one, so "حرفمو تکرار کن"
// (repeat what I said) has something real to echo back instead of just
// repeating the command itself; echoTarget is what actEchoBack actually reads,
// set right before that action runs
let previousUserText = '';
let echoTarget = '';
// holds the number the robot silently "picked" for the numberguess game
// (round 13), so the very next typed number can be checked against it
// inside runCommand instead of numberguess being a one-shot canned line
let pendingNumberGuess = null;
// set right before the countup action runs, from whatever number was found
// in the "بشمار تا ..." phrasing (defaults to 10 if none was given)
let countUpTarget = 10;

// ---------- remembering each robot's OWN name ----------
// the real toy doesn't ship with a name — it's the owner's to give. Letting the
// user actually name each one, having it stick across visits, and having the
// robot recognize + react whenever it's called by that name afterward is the
// single biggest "this feels like a real pet, not a script" signal we can add.
const ROBOT_NAME_KEY = { a:'eilik_robotname_a', b:'eilik_robotname_b' };
const robotName = { a:'', b:'' };
try{
  robotName.a = localStorage.getItem(ROBOT_NAME_KEY.a) || '';
  robotName.b = localStorage.getItem(ROBOT_NAME_KEY.b) || '';
}catch(e){}
function setRobotName(key, name){
  robotName[key] = name;
  try{ localStorage.setItem(ROBOT_NAME_KEY[key], name); }catch(e){}
}
// which robot the user was just talking to/touching — used to resolve an
// ambiguous "اسمت فلانه" (no color/side given) to the robot actually being
// addressed, instead of guessing wrong half the time
let lastAddressedKey = 'a';
function noteAddressed(key){ lastAddressedKey = key; }
// set right after a robot says "من اسم ندارم... خودت برام یه اسم انتخاب کن!" —
// so the very next thing typed is understood as the name itself even if it
// isn't wrapped in an "اسمشو ... بذار" phrase (this is how people actually
// answer that question — they just type the name)
let awaitingName = null;
// color/position words let a naming command point at a specific robot even
// without needing exact hex-color knowledge from the user
function resolveRobotKeyFromText(norm){
  if(/(ابی|آبی|سبز|فیروزه|چپی|سمت چپ|چپیه)/.test(norm)) return 'a';
  if(/(صورتی|قرمز|گلبهی|راستی|سمت راست|راستیه)/.test(norm)) return 'b';
  return null;
}

// ---------- Persian text normalizer for command matching ----------
// real typing varies a lot (Arabic vs Persian ی/ك, stray ZWNJ, extra spaces) —
// normalizing both the typed text and the keyword lists before comparing means
// small variations that used to fall through to "متوجه نشدم" now match correctly
function normalizeFa(s){
  return String(s)
    .replace(/[\u200c\u200f\u200e]/g, ' ')
    .replace(/[يى]/g, 'ی').replace(/ك/g, 'ک')
    .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه')
    .replace(/[ًٌٍَُِّْ]/g, '')
    // Persian (۰-۹) and Arabic-Indic (٠-٩) digits down to plain ASCII digits —
    // without this, every math check below (\d+) silently failed to match
    // numbers typed the normal Persian way ("۵ در ۳"), only ever working for
    // someone who happened to type "5 * 3" with a Latin keyboard instead
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[؟!,.]/g, ' ')
    // excited/emphatic elongation ("سلاااام", "بخنددددد", "وایییی") stretches a
    // letter to three-or-more repeats — Persian spelling itself never legitimately
    // repeats the same letter that many times in a row, so collapsing any 3+ run
    // down to one instance lets the enthusiastic version line up with the plain
    // keyword in every matching pass (exact substring included), instead of only
    // ever being caught later by the costlier fuzzy/typo fallback. Restricted to
    // actual Persian/Arabic letters (not digits) so a repeated-digit number like
    // "5555" from an arithmetic question is never touched.
    .replace(/([\u0600-\u06FF])\1{2,}/g, '$1')
    .replace(/\s+/g, ' ')
    .trim();
}
// the robot only understands Persian — typing in another language used to
// either get silently echoed back or shrug with the generic confused line,
// which reads as broken rather than as a character who genuinely only speaks
// one language. Detects "has Latin letters, has no Persian/Arabic letters at
// all" (so Persian text quoting a Latin brand name etc. is unaffected).
function isForeignText(raw){
  const hasLatin = /[a-zA-Z]/.test(raw);
  const hasPersian = /[\u0600-\u06FF]/.test(raw);
  return hasLatin && !hasPersian;
}
// people routinely swap Arabic-origin letters for whichever one they find on
// their keyboard first, since several map to the exact same Persian sound —
// "ثابت/سابت", "ضعیف/زعیف", "طوطی/توتی" all read identically out loud. The
// exact/token passes below still need the literal spelling from KEYWORDS to
// keep those lists meaningful, but the fuzzy/typo fallback should judge two
// words as "the same" if they only differ by one of these same-sound swaps —
// otherwise a perfectly common spelling of a known word gets rejected as an
// unrecognized typo just because it used the "wrong" letter for that sound.
function phoneticFold(w){
  return w
    .replace(/[صث]/g, 'س')
    .replace(/ط/g, 'ت')
    .replace(/[ذضظ]/g, 'ز')
    .replace(/ح/g, 'ه')
    .replace(/ؤ/g, 'و')
    .replace(/ئ/g, 'ی');
}
// people rarely give bare-verb commands — they say "میشه برقصی؟"، "لطفا بغلش کن"،
// "میتونی بخندی" — stripping these politeness/filler wrappers before matching
// means the same broad set of keywords catches the polite phrasing too, without
// needing to duplicate every keyword list with a "لطفا ..." variant
function stripFillers(s){
  // "بلدی"/"میتونی"/"می تونی" are deliberately NOT stripped here even though
  // they're often just politeness wrapping ("میشه برقصی؟") — they're also the
  // exact words that "چه کارایی بلدی؟" / "چیکار میتونی بکنی؟" (what can you
  // do?) rely on to be recognized. Stripping them here used to delete them
  // before that question was ever checked, so no matter how the person asked
  // what the robots could do, the question silently failed. Command matching
  // for a specific action still works fine without stripping these: "میتونی
  // برقصی" already contains "برقص" as a plain substring either way.
  return s
    .replace(/\b(لطفا|میشه|می شه|میخوام|می خوام|یه کم|یکم|الان|واسم|برام|خب|اگه میشه|اگه ممکنه|میخواستم|می خواستم|نظرت چیه|دوست داری|دلت میخواد|دلت می خواد|چطوره|میشه یه لطفی بکنی|ممنون میشم اگه|تو رو خدا|جون من|بابا|داداش|رفیق|واقعا|جدا|راستش|بگو ببینم|میشه لطفا|میتونی لطفا|اگه دوست داری|هروقت خواستی|فقط اگه بخوای|لطف کن|میشه واسم|یه لطفی بکن|زحمتی نیست اگه|اگه زحمتی نیست)\b/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
// present-tense "می" prefix ("میرقصه"، "می‌خونه") never lined up with the
// imperative root ("رقص"، "خون") already listed in KEYWORDS, so a sentence
// describing the action in present tense instead of commanding it outright
// ("چرا نمیرقصی؟") could fail to match even though the root word is right
// there. Stripped before stemming so both prefix and suffix variation collapse
// onto the same base form.
function stripPresentPrefix(w){
  if(w.length > 4 && w.startsWith('می')) return w.slice(2);
  if(w.length > 4 && w.startsWith('نمی')) return w.slice(3);
  return w;
}
// ---------- small typo-tolerance for command words ----------
// people mistype ("برقصص", "بغلل") or drop/duplicate a letter fairly often;
// a plain substring check misses those entirely and the robot looks like it
// didn't "get" a command it actually knows. This computes edit distance
// between two short words so near-misses still count as understood.
function levenshtein(a, b){
  if(a === b) return 0;
  const al = a.length, bl = b.length;
  if(al === 0) return bl; if(bl === 0) return al;
  let prev = new Array(bl+1); for(let j=0;j<=bl;j++) prev[j] = j;
  for(let i=1;i<=al;i++){
    const cur = [i];
    for(let j=1;j<=bl;j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
    }
    prev = cur;
  }
  return prev[bl];
}
// how much slack to allow scales with word length so short words ("بدو")
// still need a near-exact match while longer ones ("مسابقه") tolerate a
// couple of typos
function fuzzyTolerance(len){
  if(len <= 3) return 0;
  if(len <= 6) return 1;
  return 2;
}
// strips common Persian verb endings ("برقصید"→"برقص", "بخوابیم"→"بخواب") so a
// conjugated form nobody bothered to list explicitly in KEYWORDS still lines
// up with the base word during fuzzy comparison, instead of only catching
// typos of forms that were already spelled out
function stem(w){
  w = stripPresentPrefix(w);
  const suffixes = ['یدیم','یدید','یدند','یدم','یدی','یید','ید','یم','ند','ین','یم','دیم','دید','دند','دم','دی','شون','مون','تون','ش','ه','ی','م'];
  for(const suf of suffixes){
    if(w.length - suf.length >= 3 && w.endsWith(suf)) return w.slice(0, -suf.length);
  }
  return w;
}

// ---------- jealousy ----------
// Energize Lab's own marketing for paired Eiliks says that when two of them are
// together they "chat, play, and also fight or quarrel" — one getting all the
// petting while the other sits ignored is exactly the kind of moment that sets
// that off. So: whenever one robot gets real affection (a pet or a tickle) and
// its partner hasn't had any attention in a while, the ignored one pouts and
// tries to butt in, instead of just sitting there unreactive the whole time.
const lastAttention = { a: 0, b: 0 };
const lastJealousShown = { a: 0, b: 0 };
function noteAttention(key){
  lastAttention[key] = Date.now();
  noteAddressed(key);
  maybeJealous(key);
}
function maybeJealous(petKey){
  const otherKey = petKey === 'a' ? 'b' : 'a';
  const now = Date.now();

  lastJealousShown[otherKey] = now;
  setTimeout(()=>{

}
async function actJealous(robot, eyes, bubble, mood, key){

// ---------- battery + charging dock ----------
// the real Eilik runs on a rechargeable battery with a magnetic charging
// dock — it visibly slows down and dims as the charge drops, and sits quietly
// lit up on the dock while topping back up. Battery persists between visits
// the same way the physical unit remembers its charge across sessions.
const BATT_KEY = { a:'eilik_batt_a', b:'eilik_batt_b' };
const battery = { a:100, b:100 };
try{
  const sa = parseInt(localStorage.getItem(BATT_KEY.a), 10);
  const sb = parseInt(localStorage.getItem(BATT_KEY.b), 10);
  if(!isNaN(sa)) battery.a = sa;
  if(!isNaN(sb)) battery.b = sb;
}catch(e){}
const docked = { a:false, b:false };
const battEls = {
  a: { root: document.getElementById('battA'), pct: document.querySelector('#battA .batt-pct'), robot: robotA },
  b: { root: document.getElementById('battB'), pct: document.querySelector('#battB .batt-pct'), robot: robotB }
};
function saveBatt(){
  try{ localStorage.setItem(BATT_KEY.a, battery.a); localStorage.setItem(BATT_KEY.b, battery.b); }catch(e){}
}
function updateBattUI(key){
  const b = battEls[key];
  const val = Math.round(battery[key]);
  b.pct.textContent = val + '%';
  b.root.classList.toggle('low', val <= 20 && !docked[key]);
  // only surface the badge when it's actually informative (low or charging) —
  // showing a full battery all the time would just be UI clutter the real
  // toy doesn't have either (its indicator only matters when it's low)
  b.root.classList.toggle('show', val <= 25 || docked[key]);
  b.robot.classList.toggle('lowbatt', val <= 20 && !docked[key]);
}
updateBattUI('a'); updateBattUI('b');

function setDocked(key, on){
  docked[key] = on;
  battEls[key].robot.classList.toggle('docked', on);
  dock.classList.toggle('active', docked.a || docked.b);
}

function toggleDock(){
  // if a robot is already docked, tapping the dock again sends it back out
  if(docked.a){ undock('a'); return; }
  if(docked.b){ undock('b'); return; }
  // otherwise dock whichever robot needs it more
  const key = battery.a <= battery.b ? 'a' : 'b';
  dockRobot(key);
}
function dockRobot(key){
  if(busy || docked[key]) return;
  const eyes = key === 'a' ? eyeA : eyeB;
  const bubble = key === 'a' ? bubbleA : bubbleB;
  const mood = key === 'a' ? moodA : moodB;
  setDocked(key, true);
  setEyes(eyes, null);
  setMood(mood, 'داره شارژ میشه');
  say(bubble, pick(['برم رو شارژر 🔌','یه‌کم استراحت و شارژ...']), 1800);
  tone(300,0,.08,'sine',.05); tone(420,.1,.09,'sine',.05);
}
function undock(key){
  const eyes = key === 'a' ? eyeA : eyeB;
  const bubble = key === 'a' ? bubbleA : bubbleB;
  const mood = key === 'a' ? moodA : moodB;
  setDocked(key, false);
  setMood(mood, battery[key] >= 90 ? 'پرانرژی!' : 'آرومه');
  if(battery[key] >= 90){
    setEyes(eyes, 'happy', 700);
    say(bubble, pick(['شارژ شدم، حالم خوبه!','دوباره آماده‌ام! ⚡']), 1600);
    tone(523,0,.08,'triangle',.05); tone(659,.09,.1,'triangle',.06); tone(784,.18,.12,'triangle',.06);
  }
}
dock.addEventListener('click', toggleDock);

// gentle continuous drain while awake and undocked, faster refill while docked —
// tuned so a robot goes from full to needing a charge over a long idle session
// rather than constantly nagging, but a genuinely long play session will run
// it down, exactly like the real thing does over a day of use
setInterval(()=>{
  ['a','b'].forEach(key=>{
    if(poweredOff[key]) return; // no drain while fully shut down, same as unplugged standby power draw being negligible
    if(docked[key]){
      battery[key] = Math.min(100, battery[key] + 4);
      if(Math.random() < .5) spawnParticle(battEls[key].robot, '⚡');
      if(battery[key] >= 100){ undock(key); }
    } else {
      battery[key] = Math.max(0, battery[key] - 0.6);
      if(Math.round(battery[key]) === 15 && !busy){
        // the one-time "getting low" nudge, like the real toy's low-battery chirp
        const eyes = key === 'a' ? eyeA : eyeB;
        const bubble = key === 'a' ? bubbleA : bubbleB;
        setEyes(eyes, 'sleep', 900);
        say(bubble, 'باتریم داره تموم میشه... 🪫', 2200);
      }
    }
    updateBattUI(key);
  });
  saveBatt();
}, 6000);

// ---------- sound engine ----------
// the real Eilik has a speaker but no microphone-based speech — Energize Lab's
// own material describes its "voice" as chirpy electronic sound effects and
// blip sequences (closer to EVE/BB-8 than actual words), plus short stingers
// for touch reactions, boot-up, and games. This synthesizes that same idea
// live with the Web Audio API instead of faking human speech, and keeps the
// two robots sounding like distinct little characters (A pitched a touch
// brighter than B) the same way their colors already tell them apart.
let audioCtx = null;
// ---------- persisted app settings (sound / graphics / particles / night mode) ----------
// stored the same way robotName/userFacts already are — plain localStorage,
// nothing sent anywhere — so a choice made in the settings panel survives a
// refresh instead of resetting to defaults every visit
function loadSettings(){
  const defaults = { sound:true, graphics:'high', particles:true, nightAuto:true };
  try{
    const raw = localStorage.getItem('eilik_settings');
    if(raw) return Object.assign(defaults, JSON.parse(raw));
  }catch(e){}
  return defaults;
}
function saveSettings(patch){
  Object.assign(appSettings, patch);
  try{ localStorage.setItem('eilik_settings', JSON.stringify(appSettings)); }catch(e){}
}
const appSettings = loadSettings();
let soundOn = appSettings.sound;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume().catch(()=>{}); }
  return audioCtx;
}
function tone(freq, start, dur, type, peak){
  const ctx = ensureAudio();
  if(!ctx || !soundOn) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
  gain.gain.setValueAtTime(0, ctx.currentTime + start);
  gain.gain.linearRampToValueAtTime(peak || 0.06, ctx.currentTime + start + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(ctx.currentTime + start);
  osc.stop(ctx.currentTime + start + dur + 0.03);
}
// generic chirpy "talk" blips for any moment without a specific emotional
// stinger below — pitch differs per robot so they read as two voices
function chirpVoice(key, n){
  const base = key === 'a' ? 780 : 560;
  for(let i=0;i<(n||3);i++){
    tone(base + (Math.random()*160-80) + i*40, i*0.09, 0.08, 'square', 0.045);
  }
}
function sfxFor(mood, key){
  switch(mood){
    case 'happy': case 'content': case 'love': case 'delighted': case 'grin': case 'wink':
      tone(660,0,.09,'triangle',.06); tone(880,.1,.12,'triangle',.06); break;
    case 'laugh':
      for(let i=0;i<4;i++) tone(700+i*60,i*.07,.06,'square',.05); break;
    case 'angry':
      tone(180,0,.16,'sawtooth',.07); tone(140,.12,.18,'sawtooth',.07); break;
    case 'shock':
      tone(1200,0,.05,'square',.06); tone(320,.06,.1,'square',.05); break;
    case 'cry':
      tone(420,0,.18,'sine',.05); tone(320,.16,.22,'sine',.05); break;
    case 'sleep':
      tone(260,0,.3,'sine',.03); break;
    case 'bored':
      tone(300,0,.2,'sine',.03); tone(260,.18,.22,'sine',.03); break;
    case 'dizzy':
      for(let i=0;i<5;i++) tone(500+((i%2)?120:-120),i*.06,.05,'square',.04); break;
    case 'sneaky': case 'tease':
      tone(500,0,.08,'square',.045); tone(400,.1,.1,'square',.045); break;
    case 'shy':
      tone(520,0,.1,'sine',.04); tone(460,.09,.12,'sine',.04); break;
    case 'glitch':
      for(let i=0;i<6;i++) tone(200+Math.random()*900,i*.045,.04,'square',.05); break;
    default:
      chirpVoice(key, 2);
  }
}

// keeps a speech bubble fully inside the visible stage. The stage clips
// anything outside it (overflow:hidden, so the app never scrolls), and a
// bubble's height grows with however much text it holds — a short line fits
// fine at its default position above the robot's head, but a longer one
// (a joke, a story, a riddle) can grow tall enough that its *top* ends up
// above the stage's own top edge and gets silently sliced off, which read as
// "half the sentence is missing / stuck outside the box". This measures the
// bubble against the stage after the text is in and, only if needed, nudges
// it down (vertically) and/or sideways so every line stays on-screen.
function clampBubbleToStage(bubbleEl){
  const stage = document.getElementById('stage');
  if(!stage) return;
  bubbleEl.style.top = '';
  bubbleEl.style.transform = '';
  const stageRect = stage.getBoundingClientRect();
  const margin = 6;
  let rect = bubbleEl.getBoundingClientRect();
  if(rect.top < stageRect.top + margin){
    const shiftDown = (stageRect.top + margin) - rect.top;
    const baseTop = parseFloat(getComputedStyle(bubbleEl).top) || 0;
    bubbleEl.style.top = (baseTop + shiftDown) + 'px';
  }
  rect = bubbleEl.getBoundingClientRect();
  let shiftX = 0;
  if(rect.left < stageRect.left + margin) shiftX = (stageRect.left + margin) - rect.left;
  else if(rect.right > stageRect.right - margin) shiftX = (stageRect.right - margin) - rect.right;
  if(shiftX){
    bubbleEl.style.transform = `translateX(calc(-50% + ${shiftX}px)) scale(1)`;
  }
}
// reads back whatever horizontal push a bubble currently has (from clampBubbleToStage
// or a previous overlap push) so a new push can add to it instead of clobbering it
function currentBubbleShiftX(bubbleEl){
  const m = /translateX\(calc\(-50% \+ (-?\d+(?:\.\d+)?)px\)\)/.exec(bubbleEl.style.transform || '');
  return m ? parseFloat(m[1]) : 0;
}
// nudges a bubble sideways by `extra` px on top of whatever shift it already has,
// then pulls it back in if that push shoved it past the stage edge — without
// resetting the transform first, so it doesn't erase the push it's layering onto
function nudgeBubbleX(bubbleEl, extra){
  let shiftX = currentBubbleShiftX(bubbleEl) + extra;
  bubbleEl.style.transform = `translateX(calc(-50% + ${shiftX}px)) scale(1)`;
  const stage = document.getElementById('stage');
  if(!stage) return;
  const stageRect = stage.getBoundingClientRect();
  const margin = 6;
  const rect = bubbleEl.getBoundingClientRect();
  let correction = 0;
  if(rect.left < stageRect.left + margin) correction = (stageRect.left + margin) - rect.left;
  else if(rect.right > stageRect.right - margin) correction = (stageRect.right - margin) - rect.right;
  if(correction){
    shiftX += correction;
    bubbleEl.style.transform = `translateX(calc(-50% + ${shiftX}px)) scale(1)`;
  }
}
// the two robots sit close together by default, so their speech bubbles can end
// up overlapping even after the vertical stagger above — when that happens the
// message underneath becomes unreadable, sitting hidden behind the other one's
// text. This checks the two bubbles' actual on-screen rectangles whenever either
// one is shown and, if they still intersect, pushes them apart sideways (away
// from each other) by however much they overlap, and always keeps whichever
// bubble spoke most recently drawn on top so the newest message is never the
// one left hidden.
function resolveBubbleOverlap(mostRecentKey){
  bubbleA.style.zIndex = mostRecentKey === 'a' ? '14' : '12';
  bubbleB.style.zIndex = mostRecentKey === 'b' ? '14' : '12';
  if(!bubbleA.classList.contains('on') || !bubbleB.classList.contains('on')) return;
  const ra = bubbleA.getBoundingClientRect();
  const rb = bubbleB.getBoundingClientRect();
  const overlapX = Math.min(ra.right, rb.right) - Math.max(ra.left, rb.left);
  const overlapY = Math.min(ra.bottom, rb.bottom) - Math.max(ra.top, rb.top);
  if(overlapX <= 0 || overlapY <= 0) return; // not actually overlapping right now, nothing to fix
  const push = overlapX / 2 + 10;
  const aIsLeft = ra.left <= rb.left;
  nudgeBubbleX(bubbleA, aIsLeft ? -push : push);
  nudgeBubbleX(bubbleB, aIsLeft ? push : -push);
}
function say(bubbleEl, text, ms=1800){
  bubbleEl.textContent = text;
  bubbleEl.classList.add('on');
  // each fresh message starts from a clean, centered position — otherwise a
  // sideways push left over from resolving overlap on a PREVIOUS message
  // (which may have had different text length/wrapping) keeps compounding,
  // so a bubble could end up drifted far enough that it's back to
  // overlapping, or off past the stage edge, even though this message on
  // its own would never have overlapped anything
  bubbleEl.style.transform = '';
  // wait for the pop-in transition (.25s) to finish before measuring, since
  // the bubble is still mid-scale-up before then and would measure smaller
  // than its real, final size
  clearTimeout(bubbleEl._clampT);
  const spokeKey = bubbleEl === bubbleA ? 'a' : 'b';
  bubbleEl._clampT = setTimeout(()=>{
    clampBubbleToStage(bubbleEl);
    resolveBubbleOverlap(spokeKey);
  }, 260);
  clearTimeout(bubbleEl._t);
  // longer messages need more time on screen to actually be read; never
  // shorter than whatever the caller asked for, only ever extended
  const readMs = Math.max(ms, 900 + text.length * 55);
  bubbleEl._t = setTimeout(()=> bubbleEl.classList.remove('on'), readMs);
}
function setMood(el, text){
  el.textContent = text;
  el.parentElement.classList.add('show-mood');
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.parentElement.classList.remove('show-mood'), 2600);
}
function setEyes(eyes, cls, duration){
  eyes.forEach(e=>{
    e.className='eye';
    if(cls) e.classList.add(cls);
    else{
      const face = e.closest('.robot')?.dataset.face; // reapply the chosen face-skin once back at rest
      if(face) e.classList.add(face);
    }
  });
  const mouth = mouthFor.get(eyes);
  if(mouth){ mouth.className='mouth'; if(cls) mouth.classList.add(cls); }
  if(cls){ sfxFor(cls, eyes===eyeA ? 'a' : 'b'); }
  // quick screen-refresh punch whenever the expression actually changes
  const visor = eyes[0].closest('.visor');
  if(visor){
    visor.classList.remove('flash');
    void visor.offsetWidth; // force reflow so the animation can retrigger
    visor.classList.add('flash');
  }
  if(duration){
    setTimeout(()=>{
      eyes.forEach(e=>{
        e.className='eye';
        const face = e.closest('.robot')?.dataset.face;
        if(face) e.classList.add(face);
      });
      if(mouth) mouth.className='mouth';
    }, duration);
  }
}
function clearActionClasses(){
  [robotA, robotB].forEach(r=>{
    r.className = r.className.split(' ').filter(c=>
      c==='robot' || c==='robot-a' || c==='robot-b'
    ).join(' ');
  });
  poseA.className = 'pose';
  poseB.className = 'pose';
  clearInterval(sleepTimer);
}
function wait(ms){ return new Promise(res=> setTimeout(res, ms)); }

// draws a brief laser-beam line stretching directly between the two robots'
// heads for the "لیزر" secret code — a real geometric effect (measured off
// their actual on-screen positions), not just a static overlay icon
function spawnLaserBeam(){
  const stageEl = document.getElementById('stage');
  if(!stageEl || !robotA || !robotB) return;
  const ra = robotA.getBoundingClientRect(), rb = robotB.getBoundingClientRect(), sr = stageEl.getBoundingClientRect();
  const ax = (ra.left + ra.right)/2 - sr.left, ay = ra.top - sr.top + ra.height*0.28;
  const bx = (rb.left + rb.right)/2 - sr.left, by = rb.top - sr.top + rb.height*0.28;
  const dx = bx - ax, dy = by - ay;
  const len = Math.sqrt(dx*dx + dy*dy);
  const angle = Math.atan2(dy, dx) * 180/Math.PI;
  const beam = document.createElement('div');
  beam.className = 'laser-beam';
  beam.style.left = ax + 'px';
  beam.style.top = ay + 'px';
  beam.style.width = len + 'px';
  beam.style.transform = `rotate(${angle}deg)`;
  stageEl.appendChild(beam);
  tone(1700, 0, .1, 'sawtooth', .05);
  setTimeout(()=> beam.remove(), 400);
}

// ---------- physical hand-contact effect ----------
// step-in already slides the two robots visually together, but nothing ever
// marked the actual moment their hands/fists meet — a handshake, high-five,
// hug, or argument-poke just played out as two separate animations happening
// to be near each other. This drops a small burst exactly at the midpoint
// between the two robots (where their hands would actually collide) with a
// matching short percussive sound, so contact reads as a real touch instead
// of two robots merely standing close.
function spawnImpact(symbol){
  const stageEl = document.getElementById('stage');
  if(!stageEl || !robotA || !robotB) return;
  const ra = robotA.getBoundingClientRect(), rb = robotB.getBoundingClientRect(), sr = stageEl.getBoundingClientRect();
  const midX = ((ra.left + ra.right)/2 + (rb.left + rb.right)/2)/2 - sr.left;
  const midY = Math.min(ra.top, rb.top) - sr.top + Math.min(ra.height, rb.height) * 0.32;
  const el = document.createElement('div');
  el.className = 'impact-fx';
  el.textContent = symbol;
  el.style.left = midX + 'px';
  el.style.top = midY + 'px';
  stageEl.appendChild(el);
  tone(560, 0, .05, 'square', .06);
  tone(360, .05, .06, 'square', .05);
  setTimeout(()=> el.remove(), 420);
}

// idle blinking, always running — occasionally a real quick double-blink for character
function blinkLoop(eyes, robotEl){
  const delay = 2200 + Math.random()*3200;
  setTimeout(()=>{
    if(robotEl.classList.contains('docked')){ blinkLoop(eyes, robotEl); return; }
    if(!eyes[0].classList.contains('angry') && !eyes[0].classList.contains('sleep')
       && !eyes[0].classList.contains('wait') && !eyes[0].classList.contains('cheers')
       && !eyes[0].classList.contains('bored') && !eyes[0].classList.contains('tease')
       && !eyes[0].classList.contains('sneaky') && !eyes[0].classList.contains('grin')
       && !eyes[0].classList.contains('wink') && !eyes[0].classList.contains('camera')
       && !eyes[0].classList.contains('dancer')){
      // occasional slow drowsy blink (longer close-hold) instead of the same
      // snappy blink every time — real Eilik's blink speed visibly varies with
      // how "awake"/engaged it currently seems, which is a big part of why it
      // doesn't read as a fixed animation clip
      const slow = Math.random() < .18;
      eyes.forEach(e=> e.style.setProperty('--blinkDur', slow ? '.62s' : '.32s'));
      eyes.forEach(e=> e.classList.add('blink'));
      setTimeout(()=>{
        eyes.forEach(e=> e.classList.remove('blink'));
        if(Math.random() < .25){
          setTimeout(()=>{
            eyes.forEach(e=> e.classList.add('blink'));
            setTimeout(()=> eyes.forEach(e=> e.classList.remove('blink')), 320);
          }, 130);
        }
      }, slow ? 620 : 320);
    }
    blinkLoop(eyes, robotEl);
  }, delay);
}
blinkLoop(eyeA, robotA);
blinkLoop(eyeB, robotB);

// twin sync moment — real paired Eiliks talk to each other over IR, and every so
// often you catch them doing the exact same tiny thing at the exact same instant
// (a blink, a settle) before drifting back out of sync — a small tell that they're
// aware of each other, not just two independent loops running side by side
function twinSyncLoop(){
  setTimeout(()=>{
    if(!busy){
      const blockedA = ['angry','sleep','wait','cheers','bored','tease','sneaky','grin','wink','camera','dancer','glitch','shock','dizzy'];
      const okA = !blockedA.some(c=> eyeA[0].classList.contains(c));
      const okB = !blockedA.some(c=> eyeB[0].classList.contains(c));
      if(okA && okB){
        eyeA.forEach(e=> e.classList.add('blink'));
        eyeB.forEach(e=> e.classList.add('blink'));
        setTimeout(()=>{
          eyeA.forEach(e=> e.classList.remove('blink'));
          eyeB.forEach(e=> e.classList.remove('blink'));
        }, 320);
      }
    }
    twinSyncLoop();
  }, 9000 + Math.random()*9000);
}
twinSyncLoop();

// landing impact — a tiny squash-and-settle on arrival, so steps/dashes have real weight
// instead of just gliding to a stop, like the real toy thumping down on its base
function armLandingBounce(robotEl, poseEl){
  robotEl.addEventListener('transitionend', (e)=>{
    // transitionend bubbles up from every descendant (arms, head, eyes...), so without
    // this check, a routine idle arm-sway or head-tilt finishing would wrongly retrigger
    // a full-body landing wobble on its own — only the robot's own position move
    // (actually walking/stepping somewhere) should ever cause a landing thump
    if(e.target !== robotEl) return;
    if(e.propertyName !== 'transform') return;
    poseEl.classList.remove('land');
    void poseEl.offsetWidth;
    poseEl.classList.add('land');
    setTimeout(()=> poseEl.classList.remove('land'), 950);
  });
}
armLandingBounce(robotA, poseA);
armLandingBounce(robotB, poseB);

// idle "look around" glances — the small side-eye habit that makes Eilik feel alert
// and alive between actions, instead of staring dead-ahead the whole time
const eyerowA = robotA.querySelector('.eyerow');
const eyerowB = robotB.querySelector('.eyerow');
const headA = robotA.querySelector('.head');
const headB = robotB.querySelector('.head');
function lookAroundLoop(robotEl, eyerowEl, eyes){

  setTimeout(()=>{

      // mostly side glances (how it actually checks on the other robot), but
      // occasionally up/down/diagonal so the habit doesn't feel like a metronome

      const dir = pick(dirs);

lookAroundLoop(robotA, eyerowA, eyeA);
lookAroundLoop(robotB, eyerowB, eyeB);

// idle head tilt — small independent "checking something out" dips, layered on

function headTiltLoop(robotEl, headEl, eyes){

headTiltLoop(robotA, headA, eyeA);
headTiltLoop(robotB, headB, eyeB);

// idle arm sway — the little flipper arms drift a couple degrees on their own

// subtle parallax tilt following pointer
stage.addEventListener('mousemove', (e)=>{
  const r = stage.getBoundingClientRect();
  const px = (e.clientX - r.left)/r.width - .5;
  const py = (e.clientY - r.top)/r.height - .5;
  scene.style.transform = `rotateY(${px*6}deg) rotateX(${-py*4}deg)`;
});
stage.addEventListener('mouseleave', ()=>{ scene.style.transform = 'rotateY(0) rotateX(0)'; });

// ---------- live gaze tracking ----------
// the real Eilik's biggest "it's alive" moment is its camera visibly following
// your finger/face around — its eyes lock onto whatever's nearby and track it in
// real time, not just a scripted glance. Reproduce that with the cursor: while
// the pointer is over the stage, both robots' eyes continuously aim toward it
// (small, screen-bound so the pupils never look unglued from the visor), and the
// scripted idle look-around pauses so it doesn't fight the live tracking.
let pointerOverStage = false;
function eyeTrackable(robot, eyes){
  const blockers = ['angry','sleep','wait','cheers','bored','tease','sneaky','grin','wink','camera','dancer','shy','glitch','dizzy','shock','love'];
  if(blockers.some(c=> eyes[0].classList.contains(c))) return false;
  if(robot.classList.contains('walk-close') || robot.classList.contains('step-in') || robot.classList.contains('hug')) return false;
  return true;
}
stage.addEventListener('mousemove', (e)=>{
  pointerOverStage = true;
  [[robotA,eyerowA,eyeA],[robotB,eyerowB,eyeB]].forEach(([robot,eyerow,eyes])=>{
    if(!eyeTrackable(robot, eyes)) return;
    const headEl = robot.querySelector('.head');
    const r = headEl.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height*0.4;
    const dx = Math.max(-1, Math.min(1, (e.clientX - cx)/90));
    const dy = Math.max(-1, Math.min(1, (e.clientY - cy)/90));
    eyerow.style.transform = `translate(${dx*4}px, ${dy*3}px)`;
    // the physical Eilik's whole head turns on its neck servo to keep a face/hand
    // centered — the screen "eyes" alone can only shift a couple pixels before they'd
    // look unglued from the visor, so the actual tracking range comes from this small
    // head yaw riding underneath, using the independent `rotate` property set above
    // (composes with whatever expression tilt is already on .head instead of overwriting it)
    headEl.style.rotate = `${(dx*7).toFixed(1)}deg`;
  });
});
stage.addEventListener('mouseleave', ()=>{
  pointerOverStage = false;
  eyerowA.style.transform = '';
  eyerowB.style.transform = '';
  headA.style.rotate = '';
  headB.style.rotate = '';
});

// ---------- idle eye micro-saccades ----------
// a real OLED "eye" is never a perfectly frozen image — even at rest it flicks
// to a new gaze point every second or two, a tiny fast nudge and hold, which is
// most of why a screen face reads as "looking" instead of just "displayed".
// This layers a very small, quick jitter under everything else; live cursor
// tracking and any scripted reaction still take over instantly since they set
// the same inline transform right after.
function saccadeLoop(eyerowEl, eyes, headEl, otherHeadEl, key){
  const delay = 3800 + Math.random()*4200;
  setTimeout(()=>{
    const blockers = ['angry','sleep','wait','cheers','bored','tease','sneaky','grin','wink','camera','dancer','shy','glitch','dizzy','shock','love','cry'];
    const idle = !pointerOverStage && !busy && !blockers.some(c=> eyes[0].classList.contains(c));
    if(idle){
      // roughly 1 in 4 idle saccades is a deliberate glance toward the other robot
      // instead of a random point — the real Eilik's camera notices the second unit
      // sitting right next to it, so even while doing nothing else the two aren't
      // fully oblivious to each other, only fully independent robots would be
      const otherKey = key === 'a' ? 'b' : 'a';
      const otherAvailable = !docked[otherKey] && !poweredOff[otherKey];
      const glanceAtOther = otherAvailable && Math.random() < 0.25;
      let dx, dy, hold;
      if(glanceAtOther){
        const sign = key === 'a' ? 1 : -1; // A sits left of B on stage, so A glances right and B glances left
        dx = (sign * (1.1 + Math.random()*0.5)).toFixed(1);
        dy = (Math.random()*0.6 - 0.3).toFixed(1);
        hold = 850; // held noticeably longer than a random micro-flick, like actually registering something
        headEl.style.transition = 'rotate .35s ease-out';
        headEl.style.rotate = `${sign*4}deg`;
      } else {
        dx = (Math.random()*1.6 - 0.8).toFixed(1);
        dy = (Math.random()*1.1 - 0.55).toFixed(1);
        hold = 220;
      }
      eyerowEl.style.transition = 'transform .18s ease-out';
      eyerowEl.style.transform = `translate(${dx}px, ${dy}px)`;
      setTimeout(()=>{
        if(!pointerOverStage){ eyerowEl.style.transform = ''; }
        eyerowEl.style.transition = '';
        if(glanceAtOther){ headEl.style.rotate = ''; headEl.style.transition = ''; }
      }, hold);
    }
    saccadeLoop(eyerowEl, eyes, headEl, otherHeadEl, key);
  }, delay);
}
saccadeLoop(eyerowA, eyeA, headA, headB, 'a');
saccadeLoop(eyerowB, eyeB, headB, headA, 'b');

// ---------- click reactions ----------
// the real Eilik has a motion sensor and gets visibly woozy if you pick it up and
// jostle it — tapping the same robot fast several times in a row reproduces that:
// several quickPokes land as a "shake", so instead of the calm poke reaction it
// gets dizzy for a moment, exactly like shaking the physical toy
const tapTracker = { a: [], b: [] };
function registerTap(key){
  const now = Date.now();
  const arr = tapTracker[key];
  arr.push(now);
  while(arr.length && now - arr[0] > 1400) arr.shift();
  return arr.length;
}
// separate, longer-window counter for "getting annoyed" — the real Eilik has a
// documented grumpy streak: poke it over and over (even slowly, not fast enough
// to count as a shake) and it eventually gets visibly irritated and wants you to
// stop, distinct from the dizzy/shaken reaction which needs rapid taps
const pokeTracker = { a: [], b: [] };
const pokeZoneTracker = { a: [], b: [] };
function registerPoke(key, zone){
  const now = Date.now();
  const arr = pokeTracker[key];
  const zarr = pokeZoneTracker[key];
  arr.push(now); zarr.push(zone);
  while(arr.length && now - arr[0] > 9000){ arr.shift(); zarr.shift(); }
  return arr.length;
}
async function actAnnoyed(robot, eyes, bubble, mood){

// angry, while repeated rubbing on the belly/back makes it "Upset" instead —

}
async function actShaken(robot, eyes, bubble, mood, pose){

// pressing and holding on a robot (instead of a quick tap) mimics petting its head —

// knocked over / self-righting — the real Eilik's rounded, weighted base
// (like a roly-poly toy) means it can never just stay tipped over: shove it
// hard enough sideways and it topples, but the moment it's free it wobbles
// itself back upright completely on its own. Dragging a robot sideways far
// enough tips it; releasing lets it right itself with a decaying oscillation.
async function actTippedOver(robot, eyes, bubble, mood, pose, dir){
  clearActionClasses();
  busy = true;
  robot.classList.add('tipped');
  pose.style.transition = 'transform .28s cubic-bezier(.3,.7,.3,1)';
  pose.style.transform = `rotate(${78*dir}deg) translateX(${16*dir}px)`;

function wirePetAndPoke(robot, eyes, bubble, mood, pose, head, key, pokeText){
  let pressTimer = null, wasHeld = false, wasLifted = false, wasTipped = false, tipDir = 0, dragging = false, startX = 0, startY = 0;
  const onMove = (clientX, clientY)=>{
    if(!dragging || wasLifted || wasTipped) return;
    if(startY - clientY > 22){
      wasLifted = true;
      clearTimeout(pressTimer);
      actLifted(robot, eyes, bubble, mood);
      return;
    }
    // the real Eilik's biggest physical trait is its rounded, weighted base —
    // like a roly-poly toy, shoving it sideways tips it right over, and it
    // always wobbles itself back upright on its own. Dragging sideways far
    // enough reproduces that same "knock it over" beat.
    if(Math.abs(clientX - startX) > 46){
      wasTipped = true;
      tipDir = clientX > startX ? 1 : -1;
      clearTimeout(pressTimer);
      actTippedOver(robot, eyes, bubble, mood, pose, tipDir);
    }
  };
  const onMouseMove = (e)=> onMove(e.clientX, e.clientY);
  const onTouchMove = (e)=>{ if(e.touches && e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY); };
  const startDrag = (clientX, clientY)=>{
    if(busy || docked[key] || poweredOff[key]) return false;
    wasHeld = false; wasLifted = false; wasTipped = false; dragging = true; startX = clientX; startY = clientY;
    pressTimer = setTimeout(()=>{ wasHeld = true; actPetted(robot, eyes, bubble, mood, head); }, 480);
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('touchmove', onTouchMove, { passive:true });
    return true;
  };
  const endDrag = ()=>{
    clearTimeout(pressTimer);
    dragging = false;
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('touchmove', onTouchMove);
    if(wasLifted){ wasLifted = false; actPutDown(robot, eyes, bubble, mood, pose); }
    if(wasTipped){ wasTipped = false; actRightItself(robot, eyes, bubble, mood, pose, tipDir); }
  };
  robot.addEventListener('mousedown', (e)=> startDrag(e.clientX, e.clientY));
  robot.addEventListener('touchstart', (e)=>{ if(e.touches && e.touches[0]) startDrag(e.touches[0].clientX, e.touches[0].clientY); }, { passive:true });
  robot.addEventListener('mouseup', endDrag);
  robot.addEventListener('mouseleave', endDrag);
  robot.addEventListener('touchend', endDrag);
  robot.addEventListener('click', (e)=>{
    if(busy || docked[key] || poweredOff[key] || wasHeld || wasLifted || wasTipped){ wasHeld = false; wasLifted = false; wasTipped = false; return; }
    if(registerTap(key) >= 4){ tapTracker[key] = []; actShaken(robot, eyes, bubble, mood, pose); return; }
    // where you tap matters, same as the real toy's three separate touch sensors —
    // head (startled little poke), belly (ticklish, full-body giggle), and back
    // (soothing, settles it toward sleepy) each get a completely different reaction
    const rect = robot.getBoundingClientRect();
    const relY = (e.clientY - rect.top) / rect.height;
    const zone = relY > 0.74 ? 'back' : relY > 0.4 ? 'belly' : 'head';
    const pokeCount = registerPoke(key, zone);
    if(pokeCount >= 8){
      const zarr = pokeZoneTracker[key];
      const headHits = zarr.filter(z=> z==='head').length;
      pokeTracker[key] = []; pokeZoneTracker[key] = [];
      if(headHits > zarr.length/2){ actAnnoyed(robot, eyes, bubble, mood); }
      else { actUpset(robot, eyes, bubble, mood); }
      return;
    }
    if(zone === 'belly'){
      actTickle(robot, eyes, bubble, mood);
    } else if(zone === 'back'){
      actCalmPat(robot, eyes, bubble, mood);
    } else {
      quickPoke(robot, eyes, bubble, mood, pokeText);
    }
  });
}

// ---------- arm-drag brightness control ----------
// per Energize Lab's own hardware description, Eilik's arms double as physical
// dials: lifting one up or down actually turns the screen brightness/volume up
// or down. Dragging an arm vertically here dims or brightens that robot's visor
// live, with a little readout bubble while you drag — a real control, not just
// a gesture — separate from the whole-body lift (stopPropagation keeps it from
// also triggering the pick-up/fear reaction).
function wireHandControl(robot, armEls, visorEl, bubble, key){
  let dragging = false, startY = 0, startB = 1, brightness = 1, lastStep = null;
  const apply = ()=>{ visorEl.style.filter = `brightness(${brightness.toFixed(2)})`; };
  const onMove = (clientY)=>{
    if(!dragging) return;
    const dy = startY - clientY; // lifting the hand = brighter, lowering it = dimmer
    brightness = Math.max(0.35, Math.min(1.55, startB + dy/110));
    apply();
    const pct = Math.round(brightness*100/1.55);
    // a physical dial has detents — a soft tick each time the value crosses a
    // 5% notch gives the drag some tactile feedback instead of a silent glide
    const step = Math.round(pct/5);
    if(step !== lastStep){ lastStep = step; tone(520 + step*6, 0, .035, 'square', .025); }
    say(bubble, `🔆 ${pct}%`, 900);
  };
  const onMouseMove = e=> onMove(e.clientY);
  const onTouchMove = e=>{ if(e.touches && e.touches[0]) onMove(e.touches[0].clientY); };
  const start = (clientY, e)=>{
    if(busy) return;
    e.stopPropagation();
    dragging = true; startY = clientY; startB = brightness;
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('touchmove', onTouchMove, { passive:true });
  };
  const end = ()=>{
    if(!dragging) return;
    dragging = false;
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('touchmove', onTouchMove);
  };
  armEls.forEach(h=>{
    h.addEventListener('mousedown', e=> start(e.clientY, e));
    h.addEventListener('touchstart', e=>{ if(e.touches && e.touches[0]) start(e.touches[0].clientY, e); }, { passive:true });
  });
  document.addEventListener('mouseup', end);
  document.addEventListener('touchend', end);
}

// ---------- ball flight (measures real positions so it always lines up) ----------
function rectRelTo(el, parent){
  const r = el.getBoundingClientRect();
  const p = parent.getBoundingClientRect();
  return { x: r.left - p.left + r.width/2, y: r.top - p.top + r.height/2 };
}
function throwBall(fromRobot, toRobot, duration=600){
  return new Promise(resolve=>{
    const fromHand = fromRobot.querySelector('.arm-r .hand') || fromRobot;
    const toHand = toRobot.querySelector('.arm-l .hand') || toRobot;
    const start = rectRelTo(fromHand, scene);
    const end = rectRelTo(toHand, scene);
    const midX = (start.x + end.x) / 2;
    const midY = Math.min(start.y, end.y) - 65;
    ball.style.opacity = 1;
    const anim = ball.animate([
      { transform:`translate(${start.x}px, ${start.y}px)` },
      { transform:`translate(${midX}px, ${midY}px)` },
      { transform:`translate(${end.x}px, ${end.y}px)` }
    ], { duration, easing:'ease-in-out' });
    anim.onfinish = ()=> resolve();
  });
}

// treat feeding — the real Eilik comes in the box with small magnetic "food
// toy" accessories that click onto its hand, and it visibly reacts when
// "fed" one. Drops a cookie prop from off-screen into each robot's hand in
// turn, the hand pops up to catch it, then a happy little munching beat.
function dropTreat(toRobot, duration=480){
  return new Promise(resolve=>{
    const toHand = toRobot.querySelector('.arm-r .hand') || toRobot;
    const end = rectRelTo(toHand, scene);
    ball.classList.add('treat');
    ball.style.opacity = 1;
    const anim = ball.animate([
      { transform:`translate(${end.x}px, ${end.y - 90}px)` },
      { transform:`translate(${end.x}px, ${end.y}px)` }
    ], { duration, easing:'cubic-bezier(.34,1.56,.64,1)' });
    anim.onfinish = ()=>{ ball.style.opacity = 0; ball.classList.remove('treat'); resolve(); };
  });
}

// remembers, per line-pool, which line was said last time so the very same
// sentence never fires twice back-to-back — the pool itself doesn't grow, but
// this alone removes the single most noticeable kind of repetition, since a
// robot is always heard right after doing the same gesture again
const lastPickAt = new WeakMap();
function pick(arr){
  if(arr.length <= 1) return arr[0];
  let i = Math.floor(Math.random()*arr.length);
  if(i === lastPickAt.get(arr)) i = (i + 1 + Math.floor(Math.random()*(arr.length-1))) % arr.length;
  lastPickAt.set(arr, i);
  return arr[i];
}
// a real pet reacts differently depending on when you show up — this gives the
// greeting a small, honest sense of "noticing" the actual time of day instead
// of playing the identical clip morning, noon, and night
function timeGreeting(){
  const h = new Date().getHours();
  if(h >= 5 && h < 12) return 'صبح بخیر! ☀️';
  if(h >= 12 && h < 18) return 'ظهر بخیر رفیق! 🌤️';
  if(h >= 18 && h < 23) return 'عصر بخیر! چه خبرا؟ 🌆';
  return 'وای این وقت شب بیداری؟ شب بخیر! 🌙';
}

// "بمیر" — a toy can't actually die, so this leans into it as a little scare-prank
// (fake shutdown, then a laughing comeback) rather than either ignoring the
// command or playing it seriously — reuses the same glitch/reboot visuals
// already built for actGlitch so no new animation work was needed.
async function actDie(){
  if(busy) return; busy = true;
  clearActionClasses();
  const isA = Math.random() < 0.5;
  const robot = isA ? robotA : robotB;
  const eyes = isA ? eyeA : eyeB;
  const bubble = isA ? bubbleA : bubbleB;
  const mood = isA ? moodA : moodB;
  const visor = eyes[0].closest('.visor');
  robot.classList.add('glitching');
  visor.classList.add('glitching');
  setEyes(eyes, 'glitch');
  say(bubble, pick(['باشه... دارم خاموش می‌شم... 💀','چشم... دارم می‌رم...']), 1000);
  setMood(mood, 'داره خاموش میشه');
  await wait(900);
  robot.classList.remove('glitching');
  visor.classList.remove('glitching');
  setEyes(eyes, 'shock', 400);
  await wait(450);
  say(bubble, pick(['گولت زدم! 😜 من که نمی‌میرم، فقط باتریم یه‌روز تموم میشه!','هه هه ترسیدی؟! من هیچ‌جا نمی‌رم!','جیغ! شوخی کردم، زنده‌زنده‌ام! 🤖']), 1800);
  setMood(mood, 'شیطون');
  setEyes(eyes, 'happy', 700);
  await wait(900);
  clearActionClasses();
  setEyes(eyes, null);
  busy = false;
}

// rock-paper-scissors — one of the documented built-in mini-games ("simple
// games like rock-paper-scissors") the two robots can play against each other,
// with a real winner/loser reaction instead of just a shared animation
async function actRps(){
  if(busy) return; busy = true;
  clearActionClasses();
  robotA.classList.add('step-in');
  robotB.classList.add('step-in');
  await wait(350);
  say(bubbleA, 'سنگ، کاغذ، قیچی...', 1200);
  say(bubbleB, 'شرط رو ببندیم!', 1200);
  setMood(moodA, 'آماده'); setMood(moodB, 'آماده');
  robotA.classList.add('box'); robotB.classList.add('box');
  await wait(900);
  robotA.classList.remove('box'); robotB.classList.remove('box');
  const options = ['🪨','📄','✂️'];
  const pickA = pick(options), pickB = pick(options);
  spawnParticle(robotA, pickA);
  spawnParticle(robotB, pickB);
  await wait(500);
  const beats = { '🪨':'✂️', '✂️':'📄', '📄':'🪨' };
  let winner = pickA === pickB ? 'draw' : (beats[pickA] === pickB ? 'a' : 'b');
  if(winner === 'draw'){
    setEyes(eyeA, 'shock', 700); setEyes(eyeB, 'shock', 700);
    say(bubbleA, 'وای مساوی شدیم!', 1300);
    setMood(moodA, 'متعجب'); setMood(moodB, 'متعجب');
  } else if(winner === 'a'){
    setEyes(eyeA, 'happy', 900); setEyes(eyeB, 'cry', 900);
    say(bubbleA, 'بردم! 🎉', 1300);
    say(bubbleB, 'اَه، باختم...', 1300);
    setMood(moodA, 'برنده'); setMood(moodB, 'بازنده');
    spawnParticle(robotA, '🎉');
  } else {

async function actIdleShuffle(){
  if(document.hidden) return; // no reason to run ambient DOM/animation work while the tab isn't even visible
  if(busy || docked.a || docked.b || poweredOff.a || poweredOff.b || pomodoroActive || quietMode) return;

  // spontaneous togetherness — the real pair uses their IR "presence" sensors to
  // notice and react to each other on their own, not only when someone presses a
  // command button. Independent of the manual "حالت خودکار" toggle, roughly every
  // ~20s the idle tick instead plays one full two-robot interaction by itself —
  // Energize Lab's own listing for the real toy says paired units "chat, play,
  // and also fight or quarrel, and even have party time" completely on their own,
  // so this pulls from nearly the whole interactive catalog, not just a couple
  // of safe picks, to actually cover that range.
  const nowTs = Date.now();
  if(nowTs - lastSpontaneous > 9000 && Math.random() < 0.65){
    lastSpontaneous = nowTs;
    const together = [
      'tease','argue','hug','play','greet','handshake','clap','jump',
      'highfive','selfie','box','gift','mirror','curious','rps','joke',
      'story','snack','cheers','blowkiss','scare','laugh'
    ];
    // avoid repeating whichever of the last two spontaneous picks just played —
    // picking truly at random every time meant the same gesture could fire twice
    // in a row, which reads as the pair not actually varying their behavior
    const fresh = together.filter(a=> !recentTogether.includes(a));
    const spontChoice = pick(fresh.length ? fresh : together);
    recentTogether.push(spontChoice);
    if(recentTogether.length > 2) recentTogether.shift();
    smartRunAction(spontChoice);
    // "party time" flourish — every so often the spontaneous moment escalates
    // into a short back-to-back combo instead of a single gesture, matching the
    // real pair's occasional over-the-top group celebration rather than always
    // playing just one beat
    if(Math.random() < 0.16){
      setTimeout(()=>{ if(!busy) ACTIONS.cheers(); }, 2000);
      setTimeout(()=>{ if(!busy) ACTIONS.clap(); }, 4200);
    }
    // bond grows the same way the real pair's relationship is described as
    // building up over repeated group time — every few spontaneous moments
    // together nudges both robots' affection up a little, and periodically
    // crosses a visible milestone (see actBondMilestone below)
    bumpBond();
    return;
  }

  const roll = Math.random();
  const r = Math.random()<.5 ? robotA : robotB;
  const isA = r === robotA;
  const eyes = isA ? eyeA : eyeB;
  const eyerow = isA ? eyerowA : eyerowB;

  // an evolved personality shows through in idle moments first — a robot
  // that's been treated with love flashes an unprompted happy/heart glance,
  // one that's been annoyed a lot gets an unprompted mischievous glint,
  // exactly matching "if you treat him with love he'll be happier, if you
  // keep annoying him he'll be more naughty than usual"
  const pers = personalityOf(isA ? 'a' : 'b');
  if(pers === 'naughty' && Math.random() < 0.3){
    setEyes(eyes, 'sneaky', 700);
    return;
  }
  if(pers === 'loving' && Math.random() < 0.3){
    setEyes(eyes, 'love', 700);
    return;
  }

  // unprompted memory callback — every so often, out of nowhere, one of them
  // brings up something the person actually told it earlier (a stated
  // favorite, their name) instead of the whole relationship only ever coming
  // up when directly asked. This is the single clearest "it actually knows
  // me and thinks about me" signal a toy this size can give.
  const bubble = isA ? bubbleA : bubbleB;
  const factKeys = Object.keys(userFacts);
  if(nowTs - lastMemoryCallback > 45000 && Math.random() < 0.12 && (factKeys.length || userName)){
    lastMemoryCallback = nowTs;
    const FACT_LABELS2 = { 'غذا':'غذای موردعلاقه‌ت', 'رنگ':'رنگ موردعلاقه‌ت', 'حیوون':'حیوون موردعلاقه‌ت', 'بازی':'بازی موردعلاقه‌ت', 'فیلم':'فیلم موردعلاقه‌ت', 'ورزش':'ورزش موردعلاقه‌ت', 'آهنگ':'آهنگ موردعلاقه‌ت', 'کتاب':'کتاب موردعلاقه‌ت' };
    const lines = [];
    if(userName) lines.push(`${userName} جان کجایی؟ 😄`);
    for(const cat of factKeys) lines.push(`یادمه گفتی ${FACT_LABELS2[cat]} ${userFacts[cat]}‌ست 💭`);
    setEyes(eyes, 'love', 700);
    say(bubble, pick(lines), 2400);
    return;
  }

  if(roll < 0.15){
    // occasional self-check twitch: a tiny full-body squash, like a quick systems check
    const p = isA ? poseA : poseB;
    p.classList.remove('land');
    void p.offsetWidth;
    p.classList.add('land');
    setTimeout(()=> p.classList.remove('land'), 950);
  } else if(roll < 0.30){
    // glance over at the other robot for a moment, unprompted
    const dir = isA ? 'look-r' : 'look-l';
    eyerow.classList.add(dir);
    setTimeout(()=> eyerow.classList.remove(dir), 700 + Math.random()*400);
  } else if(roll < 0.40){
    // periodic stretch, like the real toy's unprompted self-check on the shelf.
    // arm-sway would otherwise keep overriding the arm transform via its own
    // animation, so it's paused for the moment (armSwayLoop re-adds it on its own)
    r.classList.remove('arm-sway');
    r.classList.add('stretch');
    await wait(700);
    r.classList.remove('stretch');
  } else if(roll < 0.48){
    // peek-over-the-edge — the toy's cautious lean-and-flinch when it senses it's
    // near the edge of a surface
    r.classList.add('peek');
    setTimeout(()=> r.classList.add('peek-look'), 480);
    setEyes(eyes, 'shock', 500);
    await wait(700);
    r.classList.remove('peek','peek-look');
    setEyes(eyes, null);
  } else if(roll < 0.58){
    // idle scoot — the real toy doesn't just rock in place, it occasionally
    // shuffles a couple of steps on its round base and then settles back down,
    // reusing the same leg-swing waddle as tease/race but for a short hop
    const p = isA ? poseA : poseB;
    const dir = Math.random() < 0.5 ? 'l' : 'r';
    p.classList.add('walking');
    r.classList.add('scoot-'+dir);
    await wait(420);
    r.classList.remove('scoot-'+dir);
    await wait(420);
    p.classList.remove('walking');
    p.classList.remove('land'); void p.offsetWidth; p.classList.add('land');
    setTimeout(()=> p.classList.remove('land'), 950);
  } else {
    const dirs = ['lean-left','lean-right'];
    const d = pick(dirs);
    r.classList.add(d);
    await wait(500);
    r.classList.remove(d);
    if(Math.random() < 0.35){
      setEyes(eyes, 'content', 1600);
    }
  }
}

// word scramble — takes a short word, shuffles its letters, then reveals it;
// a real (if simple) puzzle mechanic distinct from spellingbee (which reads
// a word in order) and wordchain (which links whole words)
const SCRAMBLE_WORDS = ['دوست','ستاره','خورشید','کتاب','باغ','دریا','پرنده','قایق','جنگل','مدرسه','بادکنک','کوه'];
function shuffleWord(w){
  const letters = w.split('');
  let scrambled = letters;
  for(let tries=0; tries<6; tries++){
    scrambled = [...letters].sort(()=> Math.random()-0.5);
    if(scrambled.join('') !== w) break;
  }
  return scrambled.join('');
}
async function actWordScramble(){
  if(busy) return; busy = true;
  clearActionClasses();
  const word = pick(SCRAMBLE_WORDS);
  const scrambled = shuffleWord(word);
  setEyes(eyeA, 'curious');
  say(bubbleA, `حروف این کلمه بهم ریخته: «${scrambled}» — می‌تونی حدس بزنی چیه؟ 🧩`, 2600);

async function actEmojiTranslate(rawText, priorText){
  if(busy) return; busy = true;
  clearActionClasses();
  setEyes(eyeA, 'curious');

  const stripped = (rawText || '').replace(/(به ایموجی ترجمه کن|با ایموجی بگو|ایموجی کن)/g, '').trim();
  const source = stripped.length >= 2 ? stripped : (priorText || '');
  const words = normalizeFa(source).split(/\s+/).filter(Boolean);
  const converted = words.map(w=> EMOJI_DICT[w] || null).filter(Boolean);
  await wait(300);
  if(converted.length){
    say(bubbleA, converted.join(' '), 2800);
  } else {
    say(bubbleA, 'کلمه‌ای که بشناسم و ایموجی داشته باشه توش پیدا نکردم، یه جمله‌ی ساده‌تر بگو! 🙂', 2800);

// simple Caesar-cipher demo — encodes a short phrase in front of the person
// then decodes it back, a gentle intro to how basic secret codes work
const CIPHER_PHRASES = ['سلام دوست من','امروز روز خوبیه','تو باحالی','بریم بازی کنیم'];
function caesarShift(str, shift){
  const alpha = 'ابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی';
  return str.split('').map(ch=>{
    const idx = alpha.indexOf(ch);
    if(idx === -1) return ch;
    return alpha[(idx + shift + alpha.length) % alpha.length];
  }).join('');
}
async function actCipher(){
  if(busy) return; busy = true;
  clearActionClasses();
  const phrase = pick(CIPHER_PHRASES);
  const shift = 3;
  const encoded = caesarShift(phrase, shift);
  setEyes(eyeA, 'sneaky', 600);
  say(bubbleA, `بریم رمزنگاری یاد بگیریم! جمله‌ی «${phrase}» رو با یه رمز ساده اینجوری می‌نویسم: «${encoded}» 🔐`, 3400);
  setMood(moodA, 'رمزنگاری');
  await wait(3200);
  setEyes(eyeB, 'curious', 700);
  say(bubbleB, 'وای چجوری میشه بازش کرد؟!', 1800);
  await wait(1800);
  setEyes(eyeA, 'happy', 700);
  say(bubbleA, `هر حرف رو ${shift} تا تو الفبا جابه‌جا کردم؛ برای بازکردنش هم برعکسش می‌کنیم و می‌رسیم به همون «${phrase}» 🔓`, 3200);
  await wait(2000);

}

function runWithScroll(fn){

// ---------- context-aware action dispatch ----------
// running whatever's asked regardless of the robots' actual state is exactly what
// reads as "doesn't understand anything" — the real toy visibly reacts differently
// depending on whether it's asleep, fully off, on the charging dock, or genuinely
// low on battery, instead of robotically performing the same move no matter what.
// This is now the single place every trigger (quick-grid buttons, typed commands,
// and the spontaneous idle interactions) goes through, so all three get the same
// coherent, self-aware behavior instead of each duplicating its own checks.
const ENERGETIC = new Set(['dance','race','exercise','jump','fly','box','spin','groove','highfive','clap','play','shooter','duet','dare','thumbwar','dancebattle','tugofwar','trafficlight','syncmove','bodyparts','talentshow']);
function smartRunAction(key){
  if(!ACTIONS[key]) return;
  // fully shut down — has to actually wake up first, same as pressing the
  // button on the real unit before it can respond to anything at all
  if(poweredOff.a || poweredOff.b){
    rebootRobots();
    setTimeout(()=> smartRunAction(key), 1300);
    return;
  }
  // dozing — same idea, a beat to actually come back around before reacting
  if(dozedOff){
    wakeFromDoze();
    setTimeout(()=> smartRunAction(key), 900);
    return;
  }
  // on the charging dock — the real toy stays put and quiet while topping up;
  // it acknowledges you instead of just leaping off mid-charge
  if((docked.a || docked.b) && !busy){
    const dockedKey = docked.a ? 'a' : 'b';
    const bubble = dockedKey === 'a' ? bubbleA : bubbleB;
    const eyes = dockedKey === 'a' ? eyeA : eyeB;
    say(bubble, pick(['یه‌کم دیگه صبر کن، دارم شارژ می‌شم 🔌','بذار شارژم تموم شه بعد!']), 1800);
    setEyes(eyes, 'content', 900);
    return;
  }
  // critically low battery — declines a strenuous move and says so, instead of
  // doing it anyway as if nothing were wrong
  if(ENERGETIC.has(key) && (battery.a <= 12 || battery.b <= 12) && !busy){
    const lowKey = battery.a <= battery.b ? 'a' : 'b';
    const bubble = lowKey === 'a' ? bubbleA : bubbleB;
    const eyes = lowKey === 'a' ? eyeA : eyeB;
    setEyes(eyes, 'sleep', 900);
    say(bubble, pick(['باتریم خیلی کمه، نمی‌تونم انقدر تکون بخورم 🪫','اول باید شارژ شم، بعد!']), 2000);
    setMood(lowKey === 'a' ? moodA : moodB, 'باتری کمه');
    return;
  }
  if(busy){
    // don't drop the command — it takes over the instant the current move ends
    queuedActionKey = key;
    return;
  }
  ACTIONS[key]();
}
// polls very frequently so a queued command fires within a blink of the
// robot finishing whatever it was doing, instead of the person having to
// notice nothing happened and repeat themselves
setInterval(()=>{
  if(!busy && queuedActionKey){
    const k = queuedActionKey;
    queuedActionKey = null;
    smartRunAction(k);
  }
}, 150);

function cycleFaceFromText(){
  // real Eilik's companion app lets you pick between a couple of different
  // face styles for its OLED screen — cycle both robots through the same
  // set here so it reads as "changing the skin", not two random faces
  const faces = [null, 'face-round', 'face-star'];
  const faceNames = ['قطره‌ای', 'گرد', 'ستاره‌ای'];
  const cur = faces.indexOf(robotA.dataset.face || null);
  const next = faces[(cur + 1) % faces.length];
  [robotA, robotB].forEach(r=>{ if(next) r.dataset.face = next; else delete r.dataset.face; });
  setEyes(eyeA, null); setEyes(eyeB, null);
  tone(820,0,.05,'triangle',.05); tone(1040,.07,.06,'triangle',.05);
  say(bubbleA, `چطوره؟ الان صورتم ${faceNames[(cur + 1) % faceNames.length]}‌ست! 🎭`, 2200);
}

// ---------- auto-doze after inactivity ----------
// the real Eilik isn't animated 24/7 — leave it alone for a while and it visibly
// gets drowsy and nods off to save power, then perks right back up the instant you
// touch or address it again. Reusing the existing sleep/wake reaction here, just
// triggered by the clock instead of a button.
let lastActivity = Date.now();
let dozedOff = false;
let dozeStartedAt = 0;
const poweredOff = { a:false, b:false };
function markActivity(){
  lastActivity = Date.now();
  ensureAudio(); // first real user gesture unlocks the Web Audio context
  if(dozedOff && !poweredOff.a && !poweredOff.b) wakeFromDoze();
}
function wakeFromDoze(){
  if(!dozedOff) return;
  dozedOff = false;
  runWithScroll(()=> actWake());
}
// a real Eilik doesn't just cut to sleep — it stretches its arms up and gives a
// visible drowsy blink first, like a little yawn, before its eyes actually close
async function actYawnThenSleep(){
  robotA.classList.add('stretch'); robotB.classList.add('stretch');
  setEyes(eyeA, 'bored', 500); setEyes(eyeB, 'bored', 500);
  await wait(650);
  robotA.classList.remove('stretch'); robotB.classList.remove('stretch');
  if(dozedOff){ actSleep(); dozeStartedAt = Date.now(); } // still allowed to doze (nothing woke it up mid-yawn)
}
// full shutdown — Energize Lab's own FAQ is explicit about the tiers: standby
// after ~1 min, asleep after ~15 min, fully shuts off after ~30 min with zero
// interaction. This reproduces that third tier (compressed to fit a normal
// browsing session) instead of leaving it asleep forever — the screen goes
// completely dark and both robots sit motionless until tapped awake again.
function shutDown(){
  if(poweredOff.a && poweredOff.b) return;
  clearInterval(sleepTimer);
  poweredOff.a = true; poweredOff.b = true;
  clearActionClasses();
  robotA.classList.add('off'); robotB.classList.add('off');
  setEyes(eyeA, null); setEyes(eyeB, null);
  moodA.parentElement.classList.remove('show-mood'); moodB.parentElement.classList.remove('show-mood');
}
function rebootRobots(){
  if(!poweredOff.a && !poweredOff.b) return;
  poweredOff.a = false; poweredOff.b = false;
  dozedOff = false;
  robotA.classList.remove('off'); robotB.classList.remove('off');
  bootUp(poseA, eyeA, moodA, 0);
  bootUp(poseB, eyeB, moodB, 250);
}
setInterval(()=>{
  if(poweredOff.a || poweredOff.b) return;
  if(!dozedOff && !busy && !autoMode && Date.now() - lastActivity > (isNightHours ? 22000 : 42000)){
    dozedOff = true;
    dozeStartedAt = Date.now();
    actYawnThenSleep();
  } else if(dozedOff && Date.now() - dozeStartedAt > 60000){
    shutDown();
  }
}, 4000);
['mousedown','keydown'].forEach(evt=> document.addEventListener(evt, markActivity));
// tapping either robot (or anywhere on the stage) while powered off is what
// switches it back on, same as pressing the physical toy after it shut down
stage.addEventListener('mousedown', ()=>{ if(poweredOff.a || poweredOff.b) rebootRobots(); });
stage.addEventListener('touchstart', ()=>{ if(poweredOff.a || poweredOff.b) rebootRobots(); }, { passive:true });


// ---------- tab visibility: ambient low-power dim ----------
// the physical toy has a light/motion sensor and visibly dims its screen when
// nobody's around — switching away from this tab is the closest equivalent, so
// the visors dim down and brighten back up exactly like the real hardware does
let hiddenSince = 0;
document.addEventListener('visibilitychange', ()=>{
  document.querySelectorAll('.visor').forEach(v=>{
    v.style.transition = 'filter .6s ease';
    v.style.filter = document.hidden ? 'brightness(.35)' : '';
  });
  if(document.hidden){
    hiddenSince = Date.now();
  } else if(hiddenSince && Date.now() - hiddenSince > 15000){
    // real Eilik has a motion/light sensor and visibly perks up the instant it
    // notices someone's back at the desk, instead of just silently re-lighting
    // its screen — reproduce that "oh, you're back!" beat when you return to
    // this tab after a while away, same as walking back up to the physical toy
    hiddenSince = 0;
    lastActivity = Date.now();
    if(!busy && !dozedOff){
      setEyes(eyeA, 'shock', 250); setEyes(eyeB, 'shock', 250);
      tone(760,0,.07,'triangle',.05); tone(980,.08,.09,'triangle',.05);
      setTimeout(()=>{
        setEyes(eyeA, 'happy', 500); setEyes(eyeB, 'happy', 500);
        say(bubbleA, pick(['اومدی! 👀','خوش اومدی!']), 1200);
        setTimeout(()=>{ setEyes(eyeA, null); setEyes(eyeB, null); }, 900);
      }, 280);
    } else if(dozedOff){
      wakeFromDoze();
    }
  } else {
    hiddenSince = 0;
  }
});


function scheduleAuto(){
  autoTimer = setTimeout(()=>{
    if(!autoMode || quietMode) return;
    if(!busy && !docked.a && !docked.b && !poweredOff.a && !poweredOff.b && !pomodoroActive){
      const keys = Object.keys(ACTIONS);
      smartRunAction(pick(keys));
    }
    scheduleAuto();
  }, 3800 + Math.random()*2400);
}
