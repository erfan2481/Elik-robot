<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eilik Robots</title>
<link rel="stylesheet" href="fonts/vazirmatn.css">
<style>
  :root{
    --bg-deep:#0c1224;
    --bg-mid:#161d3a;
    --floor:#0a0f22;
    --ink:#e9edf9;
    --dim:#8892b8;
    --a-main:#5fc9ae;
    --a-dark:#2f8a72;
    --a-light:#cdf3e6;
    --b-main:#f0a9c2;
    --b-dark:#d1698f;
    --b-light:#ffdce9;
    --body-white:#f5f7f8;
    --body-shade:#c9d0d3;
    --eye-cyan:#5fd8f0;
    --panel:#141a34;
    --panel-line:#2a3260;
    /* shared "alive" easing for arm/leg gestures — a quick organic snap with a hair
       of overshoot and a soft settle, instead of a flat linear ease-in-out, so hand
       and leg motions read like a spring-loaded servo rather than a metronome */
    --ease-life:cubic-bezier(.36,.74,.3,1.06);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:
      radial-gradient(ellipse at 20% -10%, #253066 0%, transparent 55%),
      radial-gradient(ellipse at 85% 0%, #3a2350 0%, transparent 45%),
      linear-gradient(180deg,var(--bg-deep),var(--bg-mid) 60%, var(--floor));
    font-family:'Vazirmatn',sans-serif;
    color:var(--ink);
    overflow:hidden; /* whole app is a single, fixed, non-scrolling screen */
  }
  /* whole page is exactly one screen tall (dvh tracks the real visible area on
     mobile browsers, where 100vh is wrong under the address bar) — everything
     lives inside this column so nothing ever needs to scroll */
  .wrap{
    max-width:980px;margin:0 auto;
    height:100vh;height:100dvh;
    padding:10px 12px;
    display:flex;flex-direction:column;gap:8px;
    box-sizing:border-box;
  }

  /* ---------- STAGE (fills all leftover space above the input bar) ---------- */
  .stage-outer{
    position:relative;
    flex:1 1 auto;
    min-height:0; /* required so a flex child can actually shrink instead of overflowing */
    border-radius:24px;
    padding:1px;
    background:linear-gradient(160deg,#3a4380,#141a34 40%, #1c2450);
    box-shadow:0 20px 45px -18px rgba(0,0,0,.7);
    display:flex;
  }
  .stage{
    position:relative;
    flex:1 1 auto;
    width:100%;
    min-height:0;
    border-radius:23px;
    overflow:hidden;
    perspective:1100px;
    background:
      radial-gradient(circle at 30% 20%, rgba(94,203,224,.10), transparent 45%),
      radial-gradient(circle at 75% 15%, rgba(240,161,84,.10), transparent 45%),
      linear-gradient(180deg,#12193a 0%, #0d1330 55%, #090c1e 100%);
  }
  .stars{position:absolute;inset:0;background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #ffffff55 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 10%, #ffffff33 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 60% 25%, #ffffff44 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 12%, #ffffff33 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 92% 30%, #ffffff55 50%, transparent 51%);
      opacity:.7;
  }
  .floorline{
    position:absolute;left:0;right:0;bottom:58px;height:1px;
    background:linear-gradient(90deg,transparent,#3d4a86,transparent);
  }
  .floorplane{
    position:absolute;left:0;right:0;bottom:0;height:62px;
    background:linear-gradient(180deg,#141c40,#0a0f22);
    border-top:1px solid #2c3568;
    cursor:pointer;
  }
  /* desk bump — the real Eilik has a vibration sensor and visibly startles when
     the table it sits on gets knocked; tapping the empty floor (not a robot
     directly) simulates bumping the desk under both of them at once */
  .stage-outer.bumped .stage{animation:deskBump .38s ease-out;}
  @keyframes deskBump{
    0%{transform:translate(0,0) rotate(0deg);}
    15%{transform:translate(-4px,2px) rotate(-.6deg);}
    35%{transform:translate(3px,-2px) rotate(.5deg);}
    55%{transform:translate(-2px,1px) rotate(-.3deg);}
    75%{transform:translate(1px,-1px) rotate(.15deg);}
    100%{transform:translate(0,0) rotate(0deg);}
  }
  /* idle scoot — the real toy occasionally shuffles a couple steps on its round
     base instead of only rocking in place; reuses the walking waddle/leg-swing
     already defined for tease/race but applied briefly during idle */
  .robot.scoot-l{transform:translateX(-22px);}
  .robot.scoot-r{transform:translateX(22px);}

  /* lifted / height-fear — the real Eilik has an infrared sensor and visibly
     startles/flails when picked up off the desk (per the manual: "may react
     with surprise or fear when lifted"), and calms back down once set back
     down and petted. Dragging a robot upward on screen reproduces that beat.
     Lift height bumped way up (was barely -10/-13px, unreadable as "picked
     up off the desk") to a clearly off-the-ground hold; putting it back down
     already gets a satisfying settle-bounce via the existing .pose.land
     (weebleSettle) class applied in actPutDown. */
  .robot.lifted .bobwrap{animation:none;}
  .robot.lifted .pose{animation:liftedWobble .5s ease-in-out infinite;}
  @keyframes liftedWobble{
    0%,100%{transform:translateY(-46px) rotate(-5deg);}
    50%{transform:translateY(-52px) rotate(5deg);}
  }
  .robot.lifted .arm-l{transform:rotate(-40deg) translateY(-4px);}
  .robot.lifted .arm-r{transform:rotate(40deg) translateY(-4px);}
  /* shadow shrinks and fades further the higher it's held, selling the extra
     height instead of barely changing like before */
  .robot.lifted .rshadow{opacity:.16; transform:translateX(-50%) scale(.48,.48);}

  .scene{
    position:absolute;inset:0;
    direction:ltr; /* keep layout math predictable regardless of page RTL */
    transform-style:preserve-3d;
    transition:transform .25s ease-out;
    display:flex;align-items:flex-end;justify-content:center;
    gap:58px;
    padding-bottom:62px;
  }

  .ball{
    position:absolute;
    top:0;left:0;
    width:18px;height:18px;border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%, #ffffff, #dcdcdc 40%, #8a8a8a 75%),
      conic-gradient(from 0deg, #222 0 20deg, transparent 20deg 160deg, #222 160deg 180deg, transparent 180deg 340deg, #222 340deg 360deg);
    box-shadow:0 3px 6px rgba(0,0,0,.5);
    opacity:0;
    pointer-events:none;
    z-index:8;
  }
  /* the real Eilik ships with little magnetic "food toy" accessories that snap
     onto its hand — reuses the same flying-prop element as the ball, just
     reskinned as a cookie, for the new treat-feeding command below */
  .ball.treat{
    background:radial-gradient(circle at 35% 30%, #ffe9b3, #d9a441 55%, #8a5a1f 100%);
    box-shadow:0 3px 6px rgba(0,0,0,.5), inset 0 0 0 2px #6b4416;
  }

  .particle{
    position:absolute;top:8%;
    font-size:15px;
    pointer-events:none;
    animation:floatUp 1.5s ease-out forwards;
    z-index:9;
  }
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(0) scale(.5);}
    18%{opacity:1;}
    100%{opacity:0;transform:translateY(-58px) scale(1.15);}
  }
  .impact-fx{
    position:absolute;font-size:26px;pointer-events:none;z-index:15;
    transform:translate(-50%,-50%);
    animation:impactPop .38s ease-out forwards;
  }
  @keyframes impactPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg);}
    35%{opacity:1;transform:translate(-50%,-50%) scale(1.35) rotate(6deg);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.6) rotate(0deg);}
  }
  /* a quick mutual recoil right as hands/fists actually meet — both robots
     flinch back a hair before settling, the same beat as two real objects
     colliding instead of just quietly overlapping */
  .robot-a.contact-bump{animation:contactBumpA .22s ease-out;}
  .robot-b.contact-bump{animation:contactBumpB .22s ease-out;}
  @keyframes contactBumpA{0%{transform:translateX(39px) rotate(3deg);}40%{transform:translateX(30px) rotate(1deg);}100%{transform:translateX(39px) rotate(3deg);}}
  @keyframes contactBumpB{0%{transform:translateX(-39px) rotate(-3deg);}40%{transform:translateX(-30px) rotate(-1deg);}100%{transform:translateX(-39px) rotate(-3deg);}}

  /* falling weather particles (rain/snow) drift down across the WHOLE stage
     width, not just near one robot — a separate class/keyframe from
     .particle above, which only ever floats upward right at a robot */
  .sky-particle{
    position:absolute;top:-6%;
    pointer-events:none;
    animation:fallDown linear forwards;
    z-index:3;
  }
  @keyframes fallDown{
    0%{opacity:0;transform:translateY(0) rotate(0deg);}
    10%{opacity:.95;}
    100%{opacity:.7;transform:translateY(340px) rotate(30deg);}
  }
  /* a quick red laser beam drawn between the two robots for the "لیزر" secret code */
  .laser-beam{
    position:absolute;height:3px;
    background:linear-gradient(90deg, rgba(255,40,40,0), #ff3b3b 50%, rgba(255,40,40,0));
    box-shadow:0 0 8px 2px rgba(255,60,60,.9);
    transform-origin:0 50%;
    z-index:16;pointer-events:none;
    animation:laserFlash .38s ease-out forwards;
  }
  @keyframes laserFlash{0%{opacity:0;}18%{opacity:1;}100%{opacity:0;}}
  /* rainbow color-cycling mode for the "حالت رنگین‌کمون" command — cycles hue
     continuously instead of a fixed recolor like the costume codes */
  .robot.rainbow-mode .pose{animation:rainbowCycle 2.2s linear infinite;}
  @keyframes rainbowCycle{
    0%{filter:hue-rotate(0deg) saturate(1.4);}
    100%{filter:hue-rotate(360deg) saturate(1.4);}
  }

  /* ---------- secret codes (hidden easter-egg transformations) ---------- */
  /* full-body monkey transformation — recolors the actual head/torso/arm
     surfaces to fur tones (not a filter over everything, so the visor/eyes
     stay crisp and readable) and adds real monkey ears + a muzzle + a tail,
     instead of the old approach of just floating one emoji in front of the
     face. The robot's own color-cap/chest-stripe/logo are hidden underneath
     since a real monkey wouldn't have them. */
  .robot.costume-monkey .head{
    background:linear-gradient(155deg,#dcb589 0%, #a9764a 55%, #6b4423 100%) !important;
    box-shadow:inset -7px -9px 14px rgba(0,0,0,.25), inset 4px 5px 8px rgba(255,255,255,.15), 0 6px 14px rgba(0,0,0,.4);
  }
  .robot.costume-monkey .head::before{opacity:0;} /* hide the team color-cap stripe */
  .robot.costume-monkey .earL,
  .robot.costume-monkey .earR{
    display:block;position:absolute;top:32px;width:28px;height:32px;border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #f0d3ab, #a9764a 70%, #6b4423 100%);
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.12), 0 3px 6px rgba(0,0,0,.35);
  }
  .robot.costume-monkey .earL{left:-13px;}
  .robot.costume-monkey .earR{right:-13px;}
  /* muzzle/snout patch sitting over the lower visor, plus nostrils — painted
     on top of (not instead of) the eyes, so expressions still read through */
  .robot.costume-monkey .head::after{
    content:'';position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
    width:54px;height:36px;border-radius:50% 50% 55% 55%/62% 62% 38% 38%;
    background:linear-gradient(165deg,#f2d7ae 0%,#cf9f68 85%);
    box-shadow:inset 0 -3px 5px rgba(0,0,0,.2), 0 2px 5px rgba(0,0,0,.3);
    z-index:11;pointer-events:none;
  }
  .robot.costume-monkey .torso{
    background:linear-gradient(160deg,#cf9f68 0%, #8a5a32 55%, #5c3b1e 100%) !important;
  }
  .robot.costume-monkey .torso::before{opacity:0;} /* hide the team color drip-collar */
  .robot.costume-monkey .brand{display:none;} /* hide the "Eilik" logo — a monkey has no brand stamp */
  .robot.costume-monkey .chestlight{opacity:.25;}
  .robot.costume-monkey .arm{
    background:linear-gradient(165deg,#cf9f68 0%, #a9764a 45%, #6b4423 100%) !important;
  }
  /* a small curled tail poking out from behind the torso */
  .robot.costume-monkey .torso::after{
    content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(18px) rotate(18deg);
    width:12px;height:34px;border-radius:40% 60% 50% 50%/60% 60% 40% 40%;
    background:linear-gradient(160deg,#cf9f68,#6b4423);
    box-shadow:0 2px 4px rgba(0,0,0,.3);
    z-index:-1;
  }
  /* a bit of extra "ooh-ooh-aah-aah" character on top of the recolor: a light
     bob/scratch loop while transformed, instead of standing perfectly still */
  .robot.costume-monkey .bobwrap{animation:monkeyBob 2.4s ease-in-out infinite;}
  @keyframes monkeyBob{
    0%,100%{transform:translate(0,0) rotate(0deg);}
    25%{transform:translate(-2px,-2px) rotate(-3deg);}
    50%{transform:translate(0,0) rotate(0deg);}
    75%{transform:translate(2px,-2px) rotate(3deg);}
  }

  .robot.costume-ghost{opacity:.5;filter:grayscale(1) brightness(1.4);animation:ghostFloat 1.1s ease-in-out infinite;}
  @keyframes ghostFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .robot.costume-giant{transform:scale(1.55);transform-origin:bottom center;}
  .robot.costume-tiny{transform:scale(.52);transform-origin:bottom center;}

  /* robot costume-golden: chrome/gold plating transformation for the new "طلایی" secret code */
  .robot.costume-golden .head{
    background:linear-gradient(155deg,#fff6d8 0%, #f0c453 55%, #a9791c 100%) !important;
    box-shadow:inset -7px -9px 14px rgba(0,0,0,.2), inset 4px 5px 10px rgba(255,255,255,.7), 0 6px 16px rgba(180,130,10,.5);
  }
  .robot.costume-golden .head::before{opacity:0;}
  .robot.costume-golden .torso{background:linear-gradient(160deg,#fff6d8 0%, #f0c453 55%, #a9791c 100%) !important;}
  .robot.costume-golden .torso::before{opacity:0;}
  .robot.costume-golden .arm{background:linear-gradient(165deg,#fff6d8 0%, #f0c453 45%, #a9791c 100%) !important;}
  .robot.costume-golden .visor{box-shadow:inset 0 3px 8px rgba(0,0,0,.75), inset 0 -2px 5px rgba(255,255,255,.1), 0 0 0 3px #f0c453, 0 0 14px 2px rgba(240,196,83,.6);}
  .robot.costume-golden .chestlight::after{background:#f0c453;box-shadow:0 0 8px 2px rgba(240,196,83,.9);}

  /* robot costume-fire: flame-toned transformation for the new "آتیش" secret code */
  .robot.costume-fire .head{
    background:linear-gradient(155deg,#ffe0a3 0%, #f2703c 55%, #9c1f16 100%) !important;
  }
  .robot.costume-fire .head::before{opacity:0;}
  .robot.costume-fire .torso{background:linear-gradient(160deg,#ffb25a 0%, #e8552e 55%, #8a1c12 100%) !important;}
  .robot.costume-fire .torso::before{opacity:0;}
  .robot.costume-fire .arm{background:linear-gradient(165deg,#ffb25a 0%, #e8552e 45%, #8a1c12 100%) !important;}
  .robot.costume-fire .visor{box-shadow:inset 0 3px 8px rgba(0,0,0,.75), inset 0 -2px 5px rgba(255,255,255,.05), 0 0 0 3px #f2703c, 0 0 16px 3px rgba(242,112,60,.7);}
  .robot.costume-fire .bobwrap{animation:fireFlicker 1.2s ease-in-out infinite;}
  @keyframes fireFlicker{
    0%,100%{transform:translate(0,0) rotate(0deg);}
    30%{transform:translate(-1px,-1px) rotate(-1.5deg);}
    60%{transform:translate(1px,0) rotate(1.5deg);}
  }

  /* robot costume-frost: icy/snow-covered transformation for the new "برفی" secret code */
  .robot.costume-frost .head{
    background:linear-gradient(155deg,#f5fcff 0%, #cbe8f7 55%, #8fb9cf 100%) !important;
    box-shadow:inset -7px -9px 14px rgba(0,0,0,.15), inset 4px 5px 10px rgba(255,255,255,.8), 0 6px 14px rgba(80,130,160,.4);
  }
  .robot.costume-frost .head::before{opacity:0;}
  .robot.costume-frost .torso{background:linear-gradient(160deg,#f5fcff 0%, #cbe8f7 55%, #8fb9cf 100%) !important;}
  .robot.costume-frost .torso::before{opacity:0;}
  .robot.costume-frost .arm{background:linear-gradient(165deg,#f5fcff 0%, #cbe8f7 45%, #8fb9cf 100%) !important;}
  .robot.costume-frost .visor{box-shadow:inset 0 3px 8px rgba(0,0,0,.75), inset 0 -2px 5px rgba(255,255,255,.15), 0 0 0 3px #cbe8f7, 0 0 12px 2px rgba(203,232,247,.7);}
  .robot.costume-frost .bobwrap{animation:frostShiver .28s ease-in-out infinite;}
  @keyframes frostShiver{0%,100%{transform:translate(0,0);}50%{transform:translate(1.2px,0);}}

  /* robot costume-laser: glowing red laser eyes for the new "لیزر" secret code —
     overrides whatever the current eye expression is, since a laser needs a
     consistent glow no matter what mood was showing right before the code fired */
  .robot.costume-laser .eye{
    background:radial-gradient(circle at 35% 30%, #ff8a8a, #ff3b3b 55%, #b30000 100%) !important;
    box-shadow:0 0 10px 3px rgba(255,50,50,.85) !important;
  }

  /* robot costume-diamond: sparkling crystal transformation for the new "الماس" secret code (round 13) */
  .robot.costume-diamond .head{
    background:linear-gradient(155deg,#f0feff 0%, #a6e9f7 45%, #5fc4e0 75%, #2f8fae 100%) !important;
    box-shadow:inset -7px -9px 14px rgba(0,0,0,.15), inset 4px 5px 10px rgba(255,255,255,.85), 0 6px 16px rgba(60,180,210,.5);
  }
  .robot.costume-diamond .head::before{opacity:0;}
  .robot.costume-diamond .torso{background:linear-gradient(160deg,#f0feff 0%, #a6e9f7 45%, #5fc4e0 75%, #2f8fae 100%) !important;}
  .robot.costume-diamond .torso::before{opacity:0;}
  .robot.costume-diamond .arm{background:linear-gradient(165deg,#f0feff 0%, #a6e9f7 45%, #5fc4e0 75%, #2f8fae 100%) !important;}
  .robot.costume-diamond .visor{box-shadow:inset 0 3px 8px rgba(0,0,0,.75), inset 0 -2px 5px rgba(255,255,255,.2), 0 0 0 3px #a6e9f7, 0 0 16px 3px rgba(166,233,247,.8);}
  .robot.costume-diamond .chestlight::after{background:#a6e9f7;box-shadow:0 0 10px 3px rgba(166,233,247,.95);}
  .robot.costume-diamond{animation:diamondSparkle 1.4s ease-in-out infinite;}
  @keyframes diamondSparkle{0%,100%{filter:brightness(1) saturate(1);}50%{filter:brightness(1.25) saturate(1.3);}}

  /* robot costume-ninja: matte black stealth transformation for the new "نینجا" secret code (round 13) */
  .robot.costume-ninja .head{
    background:linear-gradient(155deg,#3a3a42 0%, #1c1c22 55%, #0a0a0d 100%) !important;
    box-shadow:inset -7px -9px 14px rgba(0,0,0,.5), inset 4px 5px 10px rgba(255,255,255,.06), 0 6px 14px rgba(0,0,0,.6);
  }
  .robot.costume-ninja .head::before{opacity:0;}
  .robot.costume-ninja .torso{background:linear-gradient(160deg,#3a3a42 0%, #1c1c22 55%, #0a0a0d 100%) !important;}
  .robot.costume-ninja .torso::before{opacity:0;}
  .robot.costume-ninja .arm{background:linear-gradient(165deg,#3a3a42 0%, #1c1c22 45%, #0a0a0d 100%) !important;}
  .robot.costume-ninja .visor{box-shadow:inset 0 3px 8px rgba(0,0,0,.85), inset 0 -2px 5px rgba(255,255,255,.05), 0 0 0 3px #1c1c22, 0 0 10px 2px rgba(140,60,220,.6);}
  .robot.costume-ninja .chestlight::after{background:#8c3cdc;box-shadow:0 0 8px 2px rgba(140,60,220,.85);}

  /* robot costume-cheetah: leopard-print transformation for the new "پلنگ" secret code (round 14) */
  .robot.costume-cheetah .head{
    background:
      radial-gradient(circle at 25% 30%, #2b1a0d 0 5px, transparent 6px),
      radial-gradient(circle at 60% 20%, #2b1a0d 0 4px, transparent 5px),
      radial-gradient(circle at 75% 55%, #2b1a0d 0 5px, transparent 6px),
      radial-gradient(circle at 35% 65%, #2b1a0d 0 4px, transparent 5px),
      linear-gradient(155deg,#f6c877 0%, #e0a34c 55%, #b97a2a 100%) !important;
  }
  .robot.costume-cheetah .head::before{opacity:0;}
  .robot.costume-cheetah .torso{
    background:
      radial-gradient(circle at 30% 25%, #2b1a0d 0 5px, transparent 6px),
      radial-gradient(circle at 65% 45%, #2b1a0d 0 4px, transparent 5px),
      radial-gradient(circle at 20% 70%, #2b1a0d 0 5px, transparent 6px),
      linear-gradient(160deg,#f6c877 0%, #e0a34c 55%, #b97a2a 100%) !important;
  }
  .robot.costume-cheetah .torso::before{opacity:0;}
  .robot.costume-cheetah .arm{background:linear-gradient(165deg,#f6c877 0%, #e0a34c 45%, #b97a2a 100%) !important;}
  .robot.costume-cheetah .visor{box-shadow:inset 0 3px 8px rgba(0,0,0,.75), inset 0 -2px 5px rgba(255,255,255,.1), 0 0 0 3px #e0a34c, 0 0 12px 2px rgba(224,163,76,.6);}

  /* robot costume-sparky: crackling electric-blue transformation for the new "برقی" secret code (round 14) */
  .robot.costume-sparky .head{
    background:linear-gradient(155deg,#eafcff 0%, #7de0ff 50%, #1e9fd6 100%) !important;
    box-shadow:inset -7px -9px 14px rgba(0,0,0,.2), inset 4px 5px 10px rgba(255,255,255,.7), 0 0 18px 4px rgba(80,210,255,.6);
  }
  .robot.costume-sparky .head::before{opacity:0;}
  .robot.costume-sparky .torso{background:linear-gradient(160deg,#eafcff 0%, #7de0ff 50%, #1e9fd6 100%) !important;}
  .robot.costume-sparky .torso::before{opacity:0;}
  .robot.costume-sparky .arm{background:linear-gradient(165deg,#eafcff 0%, #7de0ff 45%, #1e9fd6 100%) !important;}
  .robot.costume-sparky .visor{box-shadow:inset 0 3px 8px rgba(0,0,0,.75), inset 0 -2px 5px rgba(255,255,255,.15), 0 0 0 3px #7de0ff, 0 0 16px 3px rgba(125,224,255,.85);}
