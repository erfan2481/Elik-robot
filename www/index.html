  /* ---------- ROBOT ---------- */
  .robot{
    position:relative;
    width:140px;
    transform-style:preserve-3d;
    transform:translateX(0);
    transition:transform .5s cubic-bezier(.34,1.56,.64,1);
    cursor:pointer;
    direction:rtl; /* restore rtl for text children */
    will-change:transform; /* hints the browser to keep this on its own GPU layer instead of repainting on every bob/tilt tick — cuts a lot of the per-frame cost on weaker mobile GPUs */
  }
  .robot .rshadow{
    position:absolute;bottom:-6px;left:50%;
    width:90px;height:16px;
    background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);
    transform:translateX(-50%);
    filter:blur(1px);
  }

  /* bobwrap = ambient idle motion ONLY (always running) — a gentle weeble-wobble
     rock on the round base, like the real Eilik toy settling instead of a flat bob */
  .bobwrap{
    animation:bob 3.1s ease-in-out infinite;
    transform-origin:bottom center;
    will-change:transform; /* this one never stops animating, so it benefits most from staying composited */
  }
  .robot-b .bobwrap{ animation-duration:3.6s; animation-delay:-1.1s; } /* desync so the two never move in lockstep */
  /* real roly-poly bases don't just bounce straight up — the round dome rolls
     a hair sideways as it rocks (weight shifting off-center), so a tiny
     translateX is paired with each rotate step here instead of a pure
     vertical bob */
  @keyframes bob{
    0%,100%{transform:translate(0,0) rotate(0deg);}
    22%{transform:translate(-1.2px,-1px) rotate(-2.2deg);}
    50%{transform:translate(0,-7px) rotate(0deg);}
    78%{transform:translate(1.2px,-1px) rotate(2.2deg);}
  }
  /* base shadow breathes opposite the wobble — squeezes as the body lifts, like real
     weight shifting on the round dome base */
  .robot .rshadow{ animation:shadowPulse 3.1s ease-in-out infinite; }
  .robot-b .rshadow{ animation-duration:3.6s; animation-delay:-1.1s; }
  @keyframes shadowPulse{
    0%,100%{transform:translateX(-50%) scale(1,1); opacity:1;}
    50%{transform:translateX(-50%) scale(.86,.86); opacity:.75;}
  }

  /* pose = deliberate gestures (free to use transform/transition without fighting bob) */
  .pose{
    transform-origin:bottom center;
    transition:transform .45s cubic-bezier(.34,1.4,.64,1);
  }
  /* weeble-settle — the real Eilik has a rounded, weighted base (like a roly-poly
     toy), so it never just stops dead: it thumps down, rocks a couple of times with
     decaying amplitude, and self-rights. This single motion is the biggest tell of
     "real toy physics" vs a flat digital snap, so it fires on every arrival/poke. */
  .pose.land{animation:weebleSettle .95s cubic-bezier(.24,.9,.4,1);}
  @keyframes weebleSettle{
    0%{transform:scale(1,1) rotate(0deg);}
    20%{transform:scale(1.07,.91) rotate(-6deg);}
    46%{transform:scale(.97,1.04) rotate(4deg);}
    72%{transform:scale(1.015,.99) rotate(-1.5deg);}
    100%{transform:scale(1,1) rotate(0deg);}
  }
  /* anticipation — a tiny servo-like wind-up crouch right before a big move (jump,
     spin, dash). Real motors visibly load up before releasing energy; without this
     beat, sudden moves read as a video cut instead of a physical push-off */
  .robot.anticipate .pose{animation:anticipate .15s ease-out;}
  @keyframes anticipate{
    0%{transform:scale(1,1) translateY(0);}
    100%{transform:scale(1.07,.88) translateY(3px);}
  }

  .mood-label{
    position:absolute;top:-26px;left:50%;transform:translateX(-50%);
    font-size:11px;color:var(--dim);white-space:nowrap;
    background:#0d1330cc;border:1px solid var(--panel-line);
    padding:2px 9px;border-radius:20px;
    opacity:0;transition:opacity .3s;
    direction:rtl;
  }
  .robot.show-mood .mood-label{opacity:1;}

  /* ---------- BATTERY + CHARGING DOCK ----------
     the physical Eilik runs off a rechargeable battery and ships with a
     magnetic charging dock; it visibly slows down and dims when the charge
     gets low, and sits there quietly lit up while docked, exactly like this. */
  .battery-badge{
    position:absolute;top:-26px;left:50%;transform:translateX(-50%);
    font-size:10.5px;color:var(--dim);white-space:nowrap;
    background:#0d1330cc;border:1px solid var(--panel-line);
    padding:1px 8px;border-radius:20px;
    opacity:0;transition:opacity .3s;
    display:flex;align-items:center;gap:3px;
    pointer-events:none;
    direction:ltr;
  }
  .robot.show-mood .battery-badge{opacity:0;} /* mood bubble takes priority over battery when both would show */
  .battery-badge.show{opacity:1;}
  .battery-badge .batt-icon{font-size:10px;filter:grayscale(.15);}
  .battery-badge.low .batt-icon{animation:battBlink 1s steps(1) infinite;}
  @keyframes battBlink{0%,49%{opacity:1;}50%,100%{opacity:.25;}}

  .dock{
    position:absolute;left:16px;bottom:10px;width:38px;height:30px;z-index:6;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .dock-icon{
    font-size:16px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));
    transition:transform .2s ease;
  }
  .dock:hover .dock-icon{transform:scale(1.15) rotate(-8deg);}
  .dock-glow{
    position:absolute;inset:-6px;border-radius:50%;
    background:radial-gradient(circle, rgba(94,216,240,.35), transparent 70%);
    opacity:0;transition:opacity .4s ease;
    pointer-events:none;
  }
  .dock.active .dock-glow{opacity:1;animation:dockPulse 1.4s ease-in-out infinite;}
  @keyframes dockPulse{0%,100%{transform:scale(.9);}50%{transform:scale(1.25);}}

  /* docked robot slides to sit right over the dock and goes quiet — arms drop,
     ambient wobble slows way down, and the screen shows a calm slow charging
     pulse instead of its usual lively expressions */
  .robot.docked{ transform:translateX(var(--dockX,-210px)) scale(.82); z-index:5; }
  .robot-b.docked{ --dockX:-330px; }
  .robot.docked .bobwrap{animation-duration:5.5s !important;}
  .robot.docked .arm-l{transform:rotate(8deg);}
  .robot.docked .arm-r{transform:rotate(-8deg);}
  .robot.docked .visor{animation:chargeGlow 1.8s ease-in-out infinite;}
  @keyframes chargeGlow{0%,100%{filter:brightness(1);}50%{filter:brightness(1.35);}}
  .robot.docked .eye{animation:none !important;filter:drop-shadow(0 0 5px #5fd8f0aa);}

  /* low battery: everything about the robot reads "running out of juice" —
     slower transitions (sluggish reactions), a dimmer visor, and a much
     longer idle-bob period instead of its normal energetic rocking */
  .robot.lowbatt .visor{filter:brightness(.6);}
  .robot.lowbatt.docked .visor{filter:brightness(1);}
  .robot.lowbatt .bobwrap{animation-duration:5.2s !important;}
  .robot.lowbatt{transition-duration:.9s;}
  .robot.lowbatt .head{transition-duration:.9s;}
  .robot.lowbatt .pose{transition-duration:.75s;}

  /* full power-off — the real Eilik doesn't just doze forever, it shuts all the
     way down after a long stretch with nobody around; screen goes fully dark
     and it sits completely still until touched again, needing the same little
     power-on wake-up as first switching it on */
  .robot.off{cursor:pointer;}
  .robot.off .bobwrap{animation:none;}
  .robot.off .visor{filter:brightness(0);transition:filter .4s ease;}
  .robot.off .arm-l{transform:rotate(6deg);}
  .robot.off .arm-r{transform:rotate(-6deg);}
  .robot.off .rshadow{animation:none;opacity:.4;}

  .bubble{
    position:absolute;top:-64px;left:50%;transform:translateX(-50%) scale(.7);
    background:#f4f6ff;color:#1c2140;
    padding:7px 12px;border-radius:14px;
    font-size:12.5px;font-weight:600;
    /* width:max-content (capped by max-width) instead of the default shrink-to-fit
       "auto" — some mobile WebViews compute shrink-to-fit width from the
       MINIMUM content size once any word-breaking property is present, which
       collapsed the bubble down to single-word/mid-word-splitting width. Forcing
       max-content sizing keeps it sized to fit the actual sentence on as few
       lines as it needs, up to the max-width cap below. */
    white-space:normal;width:max-content;max-width:min(230px,72vw);text-align:center;line-height:1.35;
    /* safety net for the rare very-long message: scrolls instead of getting
       silently cut off with no way to read the rest */
    max-height:44vh;overflow-y:auto;
    opacity:0;transition:opacity .25s cubic-bezier(.34,1.56,.64,1),transform .25s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none;
    box-shadow:0 6px 16px rgba(0,0,0,.35);
    z-index:12;
    direction:rtl;
  }
  .bubble::after{
    content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
    width:0;height:0;border:7px solid transparent;border-top-color:#f4f6ff;
  }
  .bubble.on{opacity:1;transform:translateX(-50%) scale(1);}
  /* staggered heights so the two speech bubbles never overlap when the robots are close together */
  .bubble-a.on{top:-126px;}
  .bubble-b.on{top:-40px;}

  /* --- ANTENNA (Eilik has none) --- */
  .antenna{display:none;}

  /* --- HEAD: smooth rounded dome/acorn, no ear flaps, like the real Eilik toy --- */
  .head{
    width:92px;height:98px;margin:0 auto 0;
    border-radius:50% 50% 46% 46%/52% 52% 48% 48%;
    position:relative;
    transform-style:preserve-3d;
    background:linear-gradient(155deg,#ffffff 0%, var(--body-white) 55%, var(--body-shade) 100%);
    box-shadow:inset -7px -9px 14px rgba(0,0,0,.12), inset 4px 5px 8px rgba(255,255,255,.8), 0 6px 14px rgba(0,0,0,.4);
    overflow:hidden;
    transition:transform .48s steps(6,end), /* EM3-servo feel, more pronounced: discrete stepped jumps to target instead of an eased glide, matching how a real PWM servo snaps and brakes rather than coasting */
      rotate .5s cubic-bezier(.24,.7,.28,1.18); /* live gaze-tracking stays continuously eased (a servo still sweeps smoothly while actively following a moving target) — only the deliberate pose snaps above go stepped */
    transform-origin:bottom center;
    /* servo micro-hold jitter — a real EM3 servo doesn't lock perfectly still while
       "at rest"; it makes tiny, discrete corrective steps to hold its position
       against gravity, which is a big part of why the physical Eilik reads as a
       powered machine instead of a puppet. This uses the separate `translate`
       CSS property (not `transform`) so it layers underneath the tilt/gesture
       transforms above without fighting them, and steps() instead of an eased
       curve so it snaps between holds like a motor, never drifts smoothly. */
    animation:servoHoldHead 2.6s steps(1,end) infinite;
  }
  .robot-b .head{ animation-duration:2.9s; animation-delay:-.8s; } /* desynced so both heads never twitch in lockstep */
  @keyframes servoHoldHead{
    0%,100%{translate:0 0;}
    9%{translate:.8px -.6px;}
    18%{translate:0 0;}
    41%{translate:-.6px .6px;}
    52%{translate:0 0;}
    77%{translate:.3px 0;}
    86%{translate:0 0;}
  }
  /* color cap swept over the top of the head, dripping to a point on the forehead, like the Eilik toy */
  .head::before{
    content:"";position:absolute;top:-4px;left:-4px;right:-4px;height:58px;
    clip-path:polygon(0% 0%,100% 0%,100% 55%,62% 55%,50% 88%,38% 55%,0% 55%);
  }
  .robot-a .head::before{background:linear-gradient(160deg,var(--a-light) 0%,var(--a-main) 55%, var(--a-dark) 100%);}
  .robot-b .head::before{background:linear-gradient(160deg,var(--b-light) 0%,var(--b-main) 55%, var(--b-dark) 100%);}

  .earL,.earR{display:none;}

  /* --- VISOR: single big dark screen, nearly filling the head, like the Eilik toy --- */
  .visor{
    position:absolute;left:5px;right:5px;top:26px;bottom:6px;
    border-radius:50% 50% 46% 46%/56% 56% 44% 44%;
    background:radial-gradient(circle at 35% 26%, #1c2530, #05070a 78%);
    box-shadow:inset 0 3px 8px rgba(0,0,0,.75), inset 0 -2px 5px rgba(255,255,255,.05), 0 0 0 3px rgba(255,255,255,.85);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    overflow:hidden;
  }
  .eyerow{display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .35s cubic-bezier(.34,1.56,.64,1);}
  .eyerow.look-l{transform:translateX(-4px);}
  .eyerow.look-r{transform:translateX(4px);}
  /* real Eilik's eyes dart up/down too, not just side to side — checking the ceiling,
     glancing down at a hand reaching in. Small vertical component makes the glance
     read as genuine curiosity instead of a mechanical left-right tic */
  .eyerow.look-u{transform:translateY(-3px);}
  .eyerow.look-d{transform:translateY(3px);}
  .eyerow.look-ul{transform:translate(-4px,-3px);}
  .eyerow.look-ur{transform:translate(4px,-3px);}

  /* screen glare — real Eilik's visor is curved glass over an OLED, so it always
     shows a soft diagonal highlight, not a flat matte black. This alone is what
     sells "physical screen" instead of "drawn shape" */
  .visor::before{
    content:"";position:absolute;top:2px;left:8px;right:30%;height:38%;
    background:linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,0) 70%);
    border-radius:50% 50% 50% 50%/70% 70% 30% 30%;
    pointer-events:none;z-index:2;
  }
  /* faint scanline texture — real OLED/LCD panels have a visible pixel/line
     structure up close; this is subtle enough to not fight legibility but it's
     what makes the visor read as "a screen" instead of a flat painted shape.
     Grid runs both directions and is a touch bolder than a single scanline pass,
     closer to how coarse a real 128x64 monochrome OLED's pixel grid actually
     looks this close up, without turning into visual noise over the eye shapes. */
  .visor::after{
    content:"";position:absolute;inset:0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.09) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);
    pointer-events:none;z-index:1;mix-blend-mode:overlay;
  }

  /* default eye: big glowing teardrop — pointed top, round bottom — this IS the whole face,
     exactly like the real Eilik toy's screen (no separate mouth) */
  .eye{
    width:22px;height:28px;
    position:relative;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), opacity .2s;
    background:radial-gradient(circle at 38% 62%,#eafffd,var(--eye-cyan) 55%, #1c7a8f);
    clip-path:polygon(50% 0%,78% 34%,86% 62%,72% 88%,50% 100%,28% 88%,14% 62%,22% 34%);
    filter:drop-shadow(0 0 7px #5fd8f0cc);
    border-radius:0;border:none;
    animation:eyeIdle 3.2s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes eyeIdle{0%,100%{filter:drop-shadow(0 0 7px #5fd8f0cc);}50%{filter:drop-shadow(0 0 11px #5fd8f0f0);}}
  .eye::after{display:none;}
  /* alternate resting eye shapes — the real Eilik's companion app lets you pick
     from a few different face styles for its OLED screen. Only applied to the
     default idle eye (see setEyes()); every mood expression (angry, happy,
     love, etc.) below keeps its own distinct shape regardless of which face
     style is picked, exactly like the physical toy's expressions still read
     the same no matter which face skin you've chosen. */
  .eye.face-round{clip-path:circle(47% at 50% 50%);}
  .eye.face-star{clip-path:polygon(50% 0%,63% 36%,99% 36%,69% 58%,80% 93%,50% 72%,20% 93%,31% 58%,1% 36%,37% 36%);}
  /* screen "refresh pop" — the visor snaps to a new expression with a tiny digital
     punch, like the real Eilik's OLED screen redrawing instantly */
  .visor{transform-origin:center; transition:transform .1s ease;}
  .visor.flash{animation:visorPop .22s cubic-bezier(.34,1.56,.64,1);}
  @keyframes visorPop{
    0%{transform:scale(1);}
    35%{transform:scale(1.05,.95);}
    100%{transform:scale(1);}
  }
  .eye.blink{animation:blink var(--blinkDur,.32s) ease;}
  @keyframes blink{0%,100%{transform:scaleY(1);}50%{transform:scaleY(.1);}}

  /* timer face — the real Eilik's documented "time assistance" feature: press its
     head and it counts down using numbers right on its screen, then flips to a
     pixel alarm bell that blinks and beeps when time's up. Rendered in a real
     pixel-grid font (not the rounded UI font) so the digits read as coarse,
     blocky OLED pixels — matching the toy's actual 128x64 monochrome panel —
     instead of smooth anti-aliased type. */
  .timer-display{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Press Start 2P','Vazirmatn',sans-serif;font-weight:400;font-size:19px;
    color:var(--eye-cyan);text-shadow:0 0 2px var(--eye-cyan), 0 0 8px var(--eye-cyan);
    opacity:0;pointer-events:none;letter-spacing:1px;
  }
  .visor.timer-mode .eyerow, .visor.timer-mode .mouth{opacity:0;}
  .visor.timer-mode .timer-display{opacity:1;}
  .timer-display.alarm{font-size:22px;animation:alarmBlink .4s steps(1) infinite;}
  @keyframes alarmBlink{0%,49%{opacity:1;}50%,100%{opacity:.12;}}

  /* angry: slanted glaring wedge eyes that tilt down toward the middle, monochrome cyan, like real Eilik */
  .eye.angry{
    width:24px;height:11px;clip-path:none;border-radius:2px;
    background:linear-gradient(90deg,#eafffd,var(--eye-cyan));
    filter:drop-shadow(0 0 7px #5fd8f0cc);
    animation:none;
  }
  .eyerow .eye.angry:nth-child(1){clip-path:polygon(0% 100%,100% 0%,100% 100%);transform:none;}
  .eyerow .eye.angry:nth-child(2){clip-path:polygon(0% 0%,100% 100%,0% 100%);transform:none;}
  .eyerow .eye.angry:nth-child(1){animation:angryBrowL .4s ease-in-out infinite;}
  .eyerow .eye.angry:nth-child(2){animation:angryBrowR .4s ease-in-out infinite;}
  @keyframes angryBrowL{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(1px);}
  }
  @keyframes angryBrowR{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(1px);}
  }

  /* happy / laugh: big squinting "^" laugh-crease that bounces with the giggle */
  .eye.happy,.eye.laugh{
    width:18px;height:18px;background:none;filter:none;clip-path:none;
    animation:none;
  }
  .eye.happy::after,.eye.laugh::after{
    content:"";display:block;position:absolute;left:1px;top:4px;
    width:14px;height:14px;
    border-top:5px solid var(--eye-cyan);
    border-right:5px solid var(--eye-cyan);
    border-radius:4px 10px 0 0;
    background:none;opacity:1;
    filter:drop-shadow(0 0 6px #5fd8f0cc);
    animation:happyWiggle .45s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes happyWiggle{
    0%,100%{transform:rotate(-45deg) translateY(0) scale(1);}
    50%{transform:rotate(-45deg) translateY(-2px) scale(1.06);}
  }

  /* sleep: soft closed lash arcs that breathe gently */
  .eye.sleep{
    width:20px;height:9px;clip-path:none;border-radius:0 0 20px 20px/0 0 14px 14px;
    background:none;border-bottom:4px solid #6f7aa0;
    filter:none;
    animation:sleepBreathe 2.2s ease-in-out infinite;
    transform-origin:top center;
  }
  @keyframes sleepBreathe{0%,100%{transform:scaleX(1);}50%{transform:scaleX(.86);}}
  .eye.sleep::after{display:none;}

  /* love: glowing heart eyes that beat */
  .eye.love{
    width:24px;height:22px;background:none;filter:none;clip-path:none;
    overflow:visible;animation:none;
  }
  .eye.love::after{
    content:"";display:block;position:absolute;top:-1px;left:-1px;
    width:24px;height:23px;opacity:1;
    background:radial-gradient(circle at 35% 30%,#ffe3f1,#ff8fc7 50%,#d63e82 100%);
    filter:drop-shadow(0 0 5px #ff8fc7d0);
    clip-path:polygon(50% 20%,63% 6%,80% 6%,94% 20%,94% 38%,50% 78%,6% 38%,6% 20%,20% 6%,37% 6%);
    border-radius:0;
    animation:heartBeat .7s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes heartBeat{
    0%,100%{transform:scale(1);}
    25%{transform:scale(1.18);}
    40%{transform:scale(.94);}
    60%{transform:scale(1.1);}
  }

  /* shock: wide startled round eyes that pulse */
  .eye.shock{
    clip-path:none;border-radius:50%;width:24px;height:24px;
    background:radial-gradient(circle at 35% 30%,#eafffd,var(--eye-cyan) 60%,#1c7a8f);
    filter:drop-shadow(0 0 9px #5fd8f0e0);
    animation:shockPulse .35s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes shockPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}

  /* cry: droopy blue teardrop eyes that quiver, with a falling tear */
  .eye.cry{
    background:radial-gradient(circle at 38% 55%,#eaf6ff,#6fb8e0 55%,#2c5f82);
    filter:drop-shadow(0 0 6px #6fb8e0aa);
    animation:cryQuiver .5s ease-in-out infinite;
    transform-origin:top center;
  }
  @keyframes cryQuiver{0%,100%{transform:translateY(0) scaleY(1);}50%{transform:translateY(1px) scaleY(.9);}}
  .eye.cry::before{
    content:"";display:block;position:absolute;top:26px;left:50%;
    width:6px;height:8px;border-radius:50% 50% 50% 0;
    background:linear-gradient(180deg,#8fd3ff,#4a9fe0);
    animation:teardrop 1s ease-in infinite;
    opacity:0;
  }
  @keyframes teardrop{
    0%{opacity:0;transform:translate(-50%,-3px) scale(.5);}
    25%{opacity:.95;}
    100%{opacity:0;transform:translate(-50%,11px) scale(1);}
  }

  /* dizzy: swirly spinning eyes */
  .eye.dizzy{
    clip-path:none;border-radius:50%;width:22px;height:22px;
    background:conic-gradient(from 0deg,var(--eye-cyan),#eafffd,var(--eye-cyan),#1c7a8f,var(--eye-cyan));
    filter:drop-shadow(0 0 6px #5fd8f0aa);
    animation:dizzySpin .5s linear infinite;
  }
  @keyframes dizzySpin{to{transform:rotate(360deg);}}

  /* wait: bored-of-waiting alarm-clock face that takes over the whole screen,
     exactly like the "checking the time" gag in the reference footage */
  .eye.wait{opacity:0;width:0;}
  .eyerow .eye.wait:first-child{
    opacity:1;position:absolute;left:50%;top:50%;
    width:30px;height:30px;border-radius:50%;
    border:3px solid var(--eye-cyan);background:transparent;
    box-shadow:0 0 7px 1px #5fd8f0cc, -12px -13px 0 -11px var(--eye-cyan), 12px -13px 0 -11px var(--eye-cyan);
    clip-path:none;filter:none;animation:clockTick 1s steps(1) infinite;
    transform:translate(-50%,-50%);
  }
  .eyerow .eye.wait:first-child::before{
    content:"";display:block;position:absolute;left:50%;top:50%;width:2px;height:9px;
    background:var(--eye-cyan);box-shadow:0 0 4px #5fd8f0cc;
    transform-origin:bottom center;transform:translate(-50%,-100%) rotate(20deg);
  }
  .eyerow .eye.wait:first-child::after{
    content:"";display:block;position:absolute;left:50%;top:50%;width:2px;height:6px;
    background:var(--eye-cyan);box-shadow:0 0 4px #5fd8f0cc;
    transform-origin:bottom center;transform:translate(-50%,-100%) rotate(-115deg);
  }
  @keyframes clockTick{0%,49%{transform:translate(-50%,-50%) rotate(0deg);}50%,100%{transform:translate(-50%,-50%) rotate(6deg);}}

  /* cheers: two little glowing bottle/glass icons — the celebration toast from the shelf scene */
  .eye.cheers{
    width:15px;height:27px;background:var(--eye-cyan);border-radius:0;
    clip-path:polygon(38% 0%,62% 0%,62% 28%,82% 46%,82% 100%,18% 100%,18% 46%,38% 28%);
    filter:drop-shadow(0 0 6px #5fd8f0cc);animation:cheersClink .6s ease-in-out infinite;
    transform-origin:bottom center;
  }
  @keyframes cheersClink{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-6deg) translateY(-1px);}}
  .eyerow .eye.cheers:nth-child(2){animation-name:cheersClinkR;}
  @keyframes cheersClinkR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(6deg) translateY(-1px);}}

  /* bored: flat, half-lidded, unimpressed stare — the "done waiting" deadpan look */
  .eye.bored{
    width:21px;height:11px;background:none;clip-path:none;filter:none;animation:none;
    border-bottom:4px solid var(--eye-cyan);border-radius:0 0 60% 60%/0 0 100% 100%;
    box-shadow:0 4px 6px -2px #5fd8f0aa;
  }

  /* tease: playful squinting ">  <" eyes, exactly like the poking/teasing moment in the footage */
  .eye.tease{width:16px;height:20px;background:none;clip-path:none;filter:none;animation:none;position:relative;}
  .eyerow .eye.tease:nth-child(1)::after{
    content:">";display:block;position:absolute;inset:0;
    color:var(--eye-cyan);font-family:Arial,Helvetica,sans-serif;font-weight:900;
    font-size:20px;line-height:20px;text-align:center;
    filter:drop-shadow(0 0 5px #5fd8f0cc);
  }
  .eyerow .eye.tease:nth-child(2)::after{
    content:"<";display:block;position:absolute;inset:0;
    color:var(--eye-cyan);font-family:Arial,Helvetica,sans-serif;font-weight:900;
    font-size:20px;line-height:20px;text-align:center;
    filter:drop-shadow(0 0 5px #5fd8f0cc);
  }

  /* sneaky: mischievous downward-pointing squint, paired with the toothy grin mouth,
     exactly like the impish grin in the footage */
  .eye.sneaky{width:18px;height:13px;background:none;clip-path:none;filter:none;animation:none;position:relative;}
  .eye.sneaky::after{
    content:"";display:block;position:absolute;inset:0;background:var(--eye-cyan);
    clip-path:polygon(6% 0%,94% 0%,50% 100%);
    filter:drop-shadow(0 0 6px #5fd8f0cc);
  }

  /* grin: one giant glowing "W" smile that takes over the whole screen —
     the super-delighted, over-the-moon face from the bedroom scene */
  .eye.grin{opacity:0;width:0;background:none;clip-path:none;filter:none;animation:none;}
  .eyerow{position:relative;width:100%;height:34px;}
  .eyerow .eye.grin:first-child{
    opacity:1;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:40px;height:34px;background:none;clip-path:none;filter:none;animation:none;
  }
  .eyerow .eye.grin:first-child::after{
    content:"w";display:block;position:absolute;inset:0;
    color:var(--eye-cyan);font-family:Arial,Helvetica,sans-serif;font-weight:900;
    font-size:34px;line-height:34px;text-align:center;
    filter:drop-shadow(0 0 8px #5fd8f0dd);
    animation:grinPulse .5s ease-in-out infinite;
  }
  .eyerow .eye.grin:last-child{display:none;}

  /* wink: one eye stays open, the other closes into a playful curved wink line */
  .eye.wink{background:none;clip-path:none;filter:none;animation:none;position:relative;border:none;border-radius:0;box-shadow:none;}
  .eyerow .eye.wink:nth-child(1){
    width:22px;height:28px;
    background:radial-gradient(circle at 38% 62%,#eafffd,var(--eye-cyan) 55%, #1c7a8f);
    clip-path:polygon(50% 0%,78% 34%,86% 62%,72% 88%,50% 100%,28% 88%,14% 62%,22% 34%);
    filter:drop-shadow(0 0 7px #5fd8f0cc);
    border:none;box-shadow:none;
  }
  .eyerow .eye.wink:nth-child(2){
    width:18px;height:9px;background:none;clip-path:none;filter:none;
    border:none;border-bottom:4px solid var(--eye-cyan);border-radius:0 0 60% 60%/0 0 100% 100%;
    box-shadow:0 3px 6px -2px #5fd8f0aa;
  }

  /* camera: a glowing aperture/shutter icon for the selfie moment, paired with a closed eye */
  .eye.camera{opacity:0;width:0;background:none;clip-path:none;filter:none;animation:none;border:none;box-shadow:none;}
  .eyerow .eye.camera:first-child{
    opacity:1;position:absolute;left:32%;top:50%;transform:translate(-50%,-50%);
    width:24px;height:24px;border-radius:50%;clip-path:none;border:none;
    background:conic-gradient(var(--eye-cyan) 0deg 40deg, transparent 40deg 60deg,
      var(--eye-cyan) 60deg 100deg, transparent 100deg 120deg,
      var(--eye-cyan) 120deg 160deg, transparent 160deg 180deg,
      var(--eye-cyan) 180deg 220deg, transparent 220deg 240deg,
      var(--eye-cyan) 240deg 280deg, transparent 280deg 300deg,
      var(--eye-cyan) 300deg 340deg, transparent 340deg 360deg);
    filter:drop-shadow(0 0 6px #5fd8f0cc);
    animation:dizzySpin 3s linear infinite;
    box-shadow:none;
  }
  .eyerow .eye.camera:first-child::after{
    content:"";display:block;position:absolute;left:50%;top:50%;
    width:7px;height:7px;border-radius:50%;background:#05070a;
    transform:translate(-50%,-50%);
  }
  .eyerow .eye.camera:last-child{
    opacity:1;position:absolute;left:74%;top:50%;transform:translate(-50%,-50%);
    width:16px;height:8px;background:none;clip-path:none;filter:none;border:none;
    border-bottom:4px solid var(--eye-cyan);border-radius:0 0 60% 60%/0 0 100% 100%;
    box-shadow:0 3px 6px -2px #5fd8f0aa;
  }

  /* dancer: a little glowing dancing-figure icon on the screen — the groovy dance-scene face */
  .eye.dancer{opacity:0;width:0;background:none;clip-path:none;filter:none;animation:none;border:none;box-shadow:none;}
  .eyerow .eye.dancer:first-child{
    opacity:1;position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    width:22px;height:30px;background:none;clip-path:none;border:none;box-shadow:none;
  }
  .eyerow .eye.dancer:first-child::after{
    content:"";display:block;position:absolute;inset:0;
    background:var(--eye-cyan);
    clip-path:polygon(46% 0%,58% 0%,58% 20%,74% 30%,70% 40%,58% 34%,58% 52%,80% 70%,74% 82%,56% 66%,52% 100%,42% 100%,46% 62%,26% 78%,18% 68%,42% 46%,42% 20%);
    filter:drop-shadow(0 0 6px #5fd8f0cc);
    animation:danceWiggle .4s ease-in-out infinite;
    transform-origin:bottom center;
  }
  @keyframes danceWiggle{
    0%,100%{transform:rotate(-6deg) scale(1,1);}
    25%{transform:rotate(-2deg) scale(1.015,.985);}
    50%{transform:rotate(6deg) scale(1,1);}
    75%{transform:rotate(2deg) scale(1.015,.985);}
  }
  .eyerow .eye.dancer:last-child{display:none;}

  /* content: calm, gently-pleased default eyes with a small flat smile line —
     the quiet content look from the shelf scene */
  .eye.content{
    width:20px;height:24px;
    background:radial-gradient(circle at 38% 62%,#eafffd,var(--eye-cyan) 55%, #1c7a8f);
    clip-path:polygon(50% 6%,76% 36%,82% 62%,68% 86%,50% 96%,32% 86%,18% 62%,24% 36%);
    filter:drop-shadow(0 0 7px #5fd8f0cc);
    animation:contentGlow 2.4s ease-in-out infinite;
  }
  @keyframes contentGlow{0%,100%{filter:drop-shadow(0 0 7px #5fd8f0cc);}50%{filter:drop-shadow(0 0 10px #5fd8f0e0);}}

  /* give previously-frozen expressions a slow living pulse instead of staying
     a static sticker whenever they're held on screen for more than a beat */
  .eye.bored{animation:boredSigh 2.6s ease-in-out infinite;}
  @keyframes boredSigh{0%,100%{transform:scaleY(1);}50%{transform:scaleY(.7);}}
  .eye.tease{animation:teaseSquint 1.1s ease-in-out infinite;}
  @keyframes teaseSquint{0%,100%{transform:scaleY(1);}50%{transform:scaleY(.85);}}
  .eye.sneaky::after{animation:sneakyGlow 1.4s ease-in-out infinite;}
  @keyframes sneakyGlow{0%,100%{filter:drop-shadow(0 0 6px #5fd8f0cc);}50%{filter:drop-shadow(0 0 10px #5fd8f0f0);}}
  .eyerow .eye.wink:nth-child(1){animation:eyeIdle 3.2s ease-in-out infinite;}

  /* --- HEAD REACTS TO THE FACE ---
     the real Eilik commits its whole head to an expression, not just the screen —
     these rules let the dome tilt automatically to match whatever the eyes are
     doing right now, without needing separate JS wiring for every action */
  /* shy: eyes duck into a small nervous, half-lidded look — paired with the arms
     coming up to cover the visor, exactly like the real Eilik's classic bashful
     reaction when it gets complimented or hugged */
  .eye.shy{
    width:15px;height:9px;background:none;clip-path:none;filter:none;
    border-bottom:3px solid var(--eye-cyan);border-radius:0 0 60% 60%/0 0 100% 100%;
    opacity:.9;animation:shyBlink 1.6s ease-in-out infinite;
  }
  @keyframes shyBlink{0%,100%{transform:scaleY(1) translateY(0);}50%{transform:scaleY(.6) translateY(1px);}}

  /* glitch: scrambled scanline "static" face for the comedic malfunction/reboot gag —
     the real toy occasionally does this exact confused-screen-noise reaction */
  .eye.glitch{
    width:24px;height:26px;clip-path:none;border-radius:2px;filter:none;
    background:repeating-linear-gradient(0deg, var(--eye-cyan) 0 2px, #05070a 2px 4px);
    animation:glitchFlicker .11s steps(2) infinite;
  }
  @keyframes glitchFlicker{
    0%{opacity:1;transform:translateX(0);}
    25%{opacity:.35;transform:translateX(-2px);}
    50%{opacity:1;transform:translateX(2px);}
    75%{opacity:.55;transform:translateX(-1px);}
    100%{opacity:1;transform:translateX(0);}
  }
  .visor.glitching{animation:visorGlitch .1s steps(2) infinite;}
  @keyframes visorGlitch{
    0%,100%{background:radial-gradient(circle at 35% 26%, #1c2530, #05070a 78%);}
    50%{background:#123240;}
  }
  .robot.glitching .pose{animation:glitchShake .1s linear infinite;}
  @keyframes glitchShake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-2px) rotate(-1deg);}
    75%{transform:translateX(2px) rotate(1deg);}
  }

  .head:has(.eye.shy){transform:rotate(-6deg) translateY(3px);}
  .head:has(.eye.glitch){transform:translateY(-1px);}

  /* arms rise to cover the screen for the shy reaction */
  .robot.shy .arm-l{transform:rotate(155deg) translateX(15px) translateY(-32px);}
  .robot.shy .arm-r{transform:rotate(-155deg) translateX(-15px) translateY(-32px);}
  .robot.shy .pose{animation:shySway 1.1s ease-in-out infinite;}
  @keyframes shySway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}

  /* --- HEAD REACTS TO THE FACE ---
     the real Eilik commits its whole head to an expression, not just the screen —
     these rules let the dome tilt automatically to match whatever the eyes are
     doing right now, without needing separate JS wiring for every action */
  .head:has(.eye.angry){transform:rotate(-4deg) translateY(-1px);}
  .head:has(.eye.tease){transform:rotate(7deg);}
  .head:has(.eye.sneaky){transform:rotate(-8deg) translateY(1px);}
  .head:has(.eye.wink){transform:rotate(5deg);}
  .head:has(.eye.bored){transform:rotate(4deg) translateY(2px);}
  .head:has(.eye.shock){transform:translateY(-2px) scale(1.03);}
  .head:has(.eye.love){transform:rotate(4deg);}
  .head:has(.eye.dizzy){transform:rotate(3deg);}
  .head:has(.eye.grin){transform:rotate(-5deg) translateY(-1px);}
  .head:has(.eye.cheers){transform:rotate(-4deg);}
  .head:has(.eye.dancer){transform:rotate(6deg);}
  .head:has(.eye.camera){transform:rotate(-3deg);}

  /* --- MOUTH: hidden by default (the real Eilik shows just eyes most of the time),
     but a small glowing mouth appears on the screen for specific expressions,
     exactly like the reference footage --- */
  .mouth{ display:none; }

  /* content: a small calm flat smile line under gently-pleased eyes */
  .mouth.content{
    display:block;width:11px;height:3px;background:var(--eye-cyan);
    border-radius:2px;filter:drop-shadow(0 0 4px #5fd8f0aa);
  }

  /* happy / tease: small content "w" smile curve under the eyes */
  .mouth.happy, .mouth.tease{
    display:block;width:14px;height:7px;position:relative;
  }
  .mouth.happy::after, .mouth.tease::after{
    content:"w";display:block;position:absolute;inset:0;
    color:var(--eye-cyan);font-family:Arial,Helvetica,sans-serif;font-weight:900;
    font-size:13px;line-height:7px;text-align:center;
    filter:drop-shadow(0 0 5px #5fd8f0cc);
    animation:grinPulse .5s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes grinPulse{0%,100%{transform:scaleY(1);}50%{transform:scaleY(1.15);}}

  /* laugh / sneaky: wide mischievous grin with teeth, like the real Eilik's cheeky face */
  .mouth.laugh, .mouth.sneaky{
    display:block;width:24px;height:13px;border-radius:4px 4px 8px 8px;
    background:var(--eye-cyan);
    filter:drop-shadow(0 0 6px #5fd8f0cc);
    -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 3px, transparent 3px 6px);
    mask-image:repeating-linear-gradient(90deg,#000 0 3px, transparent 3px 6px);
    animation:laughPulse .35s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes laughPulse{0%,100%{transform:scale(1,1);}50%{transform:scale(1.08,.9);}}

  /* sleep / angry / dizzy / default: no mouth, matching the reference footage */

  /* love: same soft "w" content-smile as happy */
  .mouth.love{
    display:block;width:14px;height:7px;position:relative;
  }
  .mouth.love::after{
    content:"w";display:block;position:absolute;inset:0;
    color:#ff8fc7;font-family:Arial,Helvetica,sans-serif;font-weight:900;
    font-size:13px;line-height:7px;text-align:center;
    filter:drop-shadow(0 0 5px #ff8fc7cc);
    animation:heartBeat .7s ease-in-out infinite;
    transform-origin:center;
  }

  /* shock: small round startled "o" mouth */
  .mouth.shock{
    display:block;width:9px;height:9px;border-radius:50%;
    background:var(--eye-cyan);
    filter:drop-shadow(0 0 6px #5fd8f0cc);
    animation:shockPulse .35s ease-in-out infinite;
    transform-origin:center;
  }

  /* cry: small trembling wavy mouth, like the scared/upset frame in the reference */
  .mouth.cry{
    display:block;width:13px;height:7px;position:relative;
  }
  .mouth.cry::after{
    content:"u";display:block;position:absolute;inset:0;
    color:#6fb8e0;font-family:Arial,Helvetica,sans-serif;font-weight:900;
    font-size:12px;line-height:8px;text-align:center;
    filter:drop-shadow(0 0 4px #6fb8e0aa);
    animation:cryTremble .3s ease-in-out infinite;
  }
  @keyframes cryTremble{0%,100%{transform:translateX(0);}25%{transform:translateX(-1px);}75%{transform:translateX(1px);}}

  /* --- NECK/TORSO --- */
  .neck{width:28px;height:3px;margin:0 auto;
    background:var(--body-shade);
    border-radius:3px;
    opacity:.5;
  }
  .torso{
    width:104px;height:108px;margin:-8px auto 0;
    border-radius:50% 50% 48% 48%/42% 42% 58% 58%;
    position:relative;
    background:linear-gradient(160deg,#ffffff 0%, var(--body-white) 55%, var(--body-shade) 100%);
    box-shadow:inset -8px -9px 14px rgba(0,0,0,.12), inset 6px 6px 9px rgba(255,255,255,.85), 0 10px 18px rgba(0,0,0,.35);
    animation:torsoBreathe 3.4s ease-in-out infinite, servoHoldTorso 3.1s steps(1,end) infinite;
    transform-origin:bottom center;
  }
  .robot-b .torso{ animation-duration:3.4s, 3.5s; animation-delay:0s, -1.4s; }
  @keyframes torsoBreathe{
    0%,100%{transform:scale(1,1);}
    50%{transform:scale(1.018,.982);}
  }
  /* same servo micro-hold idea as the head, applied to the torso via `translate`
     so it stacks with torsoBreathe's `transform:scale()` instead of overriding it */
  @keyframes servoHoldTorso{
    0%,100%{translate:0 0;}
    14%{translate:-.3px 0;}
    27%{translate:0 0;}
    58%{translate:.3px -.2px;}
    69%{translate:0 0;}
  }
  /* the paint-drip color patch flowing from the neck down the chest — a V-collar that
     tapers to a narrow drip point, like the real Eilik toy */
  .torso::before{
    content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:46px;height:56px;
    clip-path:polygon(0% 0%,100% 0%,100% 22%,54% 78%,50% 100%,46% 78%,0% 22%);
  }
  .robot-a .torso::before{background:linear-gradient(160deg,var(--a-main),var(--a-dark));}
  .robot-b .torso::before{background:linear-gradient(160deg,var(--b-main),var(--b-dark));}

  .brand{
    position:absolute;top:50px;left:50%;transform:translateX(5px);
    font-family:Arial,Helvetica,sans-serif;
    font-size:8px;font-weight:700;letter-spacing:.2px;
    color:#3a4048;opacity:.55;
    direction:ltr;
  }

  .chestlight{
    position:absolute;top:53px;left:50%;transform:translateX(-22px);
    width:7px;height:7px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle,#3a4048,#20242a);
  }
  .chestlight::after{
    content:"";width:4px;height:4px;border-radius:50%;
    background:#181b20;
    animation:corepulse 2.4s ease-in-out infinite;
  }
  @keyframes corepulse{0%,100%{opacity:.9;}50%{opacity:.4;}}

  /* groove mode — real-world reviews of Eilik note it has sound-recognition and
     "can react to music... creating more dynamic and responsive behavior
     patterns." This reuses the chest light as the beat indicator (it lights
     up bright on each hit like a little speaker-reactive LED) and bounces the
     whole body on the downbeat, in time with a short synthesized rhythm. */
  .robot.grooving .chestlight::after{
    animation:beatFlash .5s steps(1,end) infinite;
    background:var(--eye-cyan);
  }
  .robot-a.grooving .chestlight::after{ box-shadow:0 0 6px 1px var(--a-main); }
  .robot-b.grooving .chestlight::after{ box-shadow:0 0 6px 1px var(--b-main); }
  @keyframes beatFlash{0%,100%{opacity:.35;}50%{opacity:1;}}
  .robot.grooving .bobwrap{animation:beatBounce .5s ease-in-out infinite;}
  .robot-b.grooving .bobwrap{ animation-delay:-.25s; } /* B lands on the off-beat so they don't thump in unison */
  @keyframes beatBounce{
    0%,100%{transform:translateY(0) rotate(0deg);}
    30%{transform:translateY(-8px) rotate(-3deg);}
    55%{transform:translateY(1px) rotate(2deg);}
  }
  /* meditate command — slow, gentle breathing scale instead of the normal bob,
     and the chest light pulses on the same slow rhythm like a breathing guide */
  .robot.meditating .bobwrap{animation:meditateBreathe 3.6s ease-in-out infinite;}
  @keyframes meditateBreathe{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.035);}
  }
  .robot.meditating .chestlight::after{animation:corepulse 3.6s ease-in-out infinite;}

  .panelline{display:none;}

  /* --- ARMS (short rounded flipper paddles at the shoulders, like Eilik's side flaps) --- */
  .arm{
    position:absolute;top:28px;width:24px;height:50px;
    border-radius:50% 50% 55% 45%/34% 34% 66% 66%;
    transform-origin:top center;
    /* EM3 servo feel, made more pronounced per the real hardware: PWM servos snap
       through a handful of discrete micro-steps to a target angle and brake hard,
       they don't glide on an eased curve like a stepper/DC motor would — steps()
       chops the same .5s move into visible jumps instead of a smooth tween */
    transition:transform .48s steps(7,end);
    box-shadow:0 4px 8px rgba(0,0,0,.2);
    cursor:ns-resize; /* the arms double as brightness/volume dials on the real toy — drag up/down */
    animation:servoHoldArm 2.2s steps(1,end) infinite; /* same servo micro-hold jitter as the head/torso, via `translate` so it stacks with the rotate() poses above */
  }
  .robot-b .arm{ animation-duration:2.5s; animation-delay:-.5s; }
  @keyframes servoHoldArm{
    0%,100%{translate:0 0;}
    20%{translate:.6px .4px;}
    33%{translate:0 0;}
    64%{translate:-.6px 0;}
    75%{translate:0 0;}
  }
  .arm-l{left:-16px;transform:rotate(-14deg);border-radius:50% 50% 45% 55%/34% 34% 66% 66%;}
  .arm-r{right:-16px;transform:rotate(14deg);}
  .robot-a .arm{background:linear-gradient(165deg,var(--a-light) 0%, var(--a-main) 45%, var(--a-dark) 100%);}
  .robot-b .arm{background:linear-gradient(165deg,var(--b-light) 0%, var(--b-main) 45%, var(--b-dark) 100%);}
  .hand{display:none;}

  /* idle arm sway — the real Eilik's little flipper arms are never perfectly still;
     they drift a couple of degrees on their own between gestures, like a resting
     servo that hasn't fully locked. Cleared instantly by clearActionClasses()
     whenever a real gesture needs the arms, so it never fights a pose. */
  .robot.arm-sway .arm-l{animation:armSwayL 2.8s ease-in-out infinite;}
  .robot.arm-sway .arm-r{animation:armSwayR 2.8s ease-in-out infinite;}
  @keyframes armSwayL{0%,100%{transform:rotate(-14deg);}50%{transform:rotate(-9deg);}}
  @keyframes armSwayR{0%,100%{transform:rotate(14deg);}50%{transform:rotate(9deg);}}

  /* unprompted stretch — a periodic self-systems-check the real Eilik does while
     just sitting on the shelf: both little arms reach up and the body rises and
     elongates for a beat, then settles back down with a soft thump */
  .robot.stretch .arm-l{transform:rotate(-172deg) translateY(-10px);}
  .robot.stretch .arm-r{transform:rotate(172deg) translateY(-10px);}
  .robot.stretch .pose{animation:stretchRise .7s cubic-bezier(.34,1.2,.64,1);}
  @keyframes stretchRise{
    0%{transform:scale(1,1) translateY(0);}
    55%{transform:scale(.96,1.09) translateY(-5px);}
    100%{transform:scale(1,1) translateY(0);}
  }

  /* peek-over-the-edge — the real Eilik has an edge sensor on its base and does this
     exact cautious-lean-then-flinch-back move when it gets near the lip of a table:
     it creeps forward, dips its "gaze" down and forward like it's checking the drop,
     then startles and snaps back a little too fast, as if it surprised itself */
  .robot.peek .pose{animation:peekOver 1.4s cubic-bezier(.3,.7,.3,1);}
  @keyframes peekOver{
    0%{transform:translateY(0) rotate(0deg);}
    35%{transform:translateY(3px) rotate(9deg);}
    55%{transform:translateY(4px) rotate(9deg);}
    70%{transform:translateY(-3px) rotate(-6deg);}
    85%{transform:translateY(1px) rotate(2deg);}
    100%{transform:translateY(0) rotate(0deg);}
  }
  .robot.peek .eyerow{transition:transform .3s ease;}
  .robot.peek.peek-look .eyerow{transform:translateY(2px);}

  /* nodding "yes" — real Eilik gives this exact quick double head-bob when it
     agrees with something or gets praised. Applied to .head so it layers on top
     of whatever the body/pose is doing, and stays snappy/mechanical (short,
     linear-ish) rather than soft, since it reads as a deliberate signal, not
     an ambient wobble */
  .robot.nod-yes .head{animation:nodYes .55s ease-in-out 2;}
  @keyframes nodYes{
    0%,100%{transform:rotate(0deg) translateY(0);}
    30%{transform:rotate(0deg) translateY(6px);}
    60%{transform:rotate(0deg) translateY(-1px);}
  }
  /* shaking "no" — the natural counterpart the real toy also does: a quick
     side-to-side head twist (not the up/down nod) when it disagrees or is told
     no. Same short/mechanical timing as nodYes so the two read as a matched
     pair of deliberate signals rather than one being an afterthought */
  .robot.shake-no .head{animation:shakeNo .5s ease-in-out 2;}
  @keyframes shakeNo{
    0%,100%{transform:rotate(0deg) translateY(0);}
    25%{transform:rotate(-11deg) translateY(1px);}
    75%{transform:rotate(11deg) translateY(1px);}
  }

  /* tickled — tapping the round tummy is a different touch sensor than the
     head/screen, so the reaction is a completely different flavor of physical:
     a fast helpless full-body jiggle with both arms flapping in, like the real
     Eilik curling and squirming when you tickle its belly */
  .robot.tickled .pose{animation:tickleJiggle .18s ease-in-out infinite;}
  @keyframes tickleJiggle{
    0%,100%{transform:translateX(0) rotate(-3deg) scale(1,1);}
    50%{transform:translateX(3px) rotate(3deg) scale(1.02,.97);}
  }
  .robot.tickled .arm-l{animation:tickleArmL .18s ease-in-out infinite;}
  .robot.tickled .arm-r{animation:tickleArmR .18s ease-in-out infinite;}
  @keyframes tickleArmL{0%,100%{transform:rotate(-40deg);}50%{transform:rotate(-70deg);}}
  @keyframes tickleArmR{0%,100%{transform:rotate(40deg);}50%{transform:rotate(70deg);}}

  /* idle head tilt — a small curious dip to one side, independent of the eyes,
     the same "checking something out" habit the real toy does while just sitting there */
  .head.tilt-l{transform:rotate(-5deg);}
  .head.tilt-r{transform:rotate(5deg);}

  /* --- LEGS (Eilik has none — the egg body sits straight on its base) --- */
  .legs{display:flex;gap:14px;justify-content:center;margin-top:0;height:0;overflow:visible;}
  .leg{width:0;height:0;opacity:0;}

  /* --- BASE (the little plastic stand Eilik rests on) --- */
  .rshadow{
    bottom:-9px!important;
    width:106px!important;height:19px!important;
    background:linear-gradient(180deg,#eef1f3,#c7ccd1)!important;
    border-radius:50%!important;
    box-shadow:0 6px 10px rgba(0,0,0,.35);
    filter:none!important;
  }

  /* ================= ACTION ANIMATIONS ================= */

  /* idle lean / quick reactions (pose-level, plain transition, no conflict) */
  .robot.lean-right .pose{transform:rotate(6deg) translateX(2px);}
  .robot.lean-left .pose{transform:rotate(-6deg) translateX(-2px);}
  .robot.recoil .pose{animation:recoil .5s ease;}
  @keyframes recoil{
    0%{transform:translateX(0) rotate(0);}
    30%{transform:translateX(16px) rotate(6deg);}
    100%{transform:translateX(0) rotate(0);}
  }
  .robot.turn-away.robot-a .pose{transform:rotate(-12deg) translateX(-6px);}
  .robot.turn-away.robot-b .pose{transform:rotate(12deg) translateX(6px);}

  /* walking toward each other (top-level .robot, physical coords: A is left, B is right)
     — a slight lean in the direction of travel, like the toy tipping forward as it pushes off.
     A fluid accelerate-glide-then-settle curve carries the actual travel distance now (a
     stepped/strobed transition read as laggy rather than mechanical); the "geared toy" texture
     instead comes entirely from the waddle/legswing rocking layered on top during the move,
     the same way the real Eilik's base rolls smoothly while its body still visibly waddles. */
  .robot.walk-close, .robot.step-in, .robot.bump-back{
    transition-timing-function: cubic-bezier(.28,.74,.16,1.02);
    transition-duration:.58s;
  }
  .robot.race-run, .robot.race-back{
    transition-timing-function: cubic-bezier(.32,.7,.14,1.04);
    transition-duration:.4s;
  }
  .robot-a.walk-close{transform:translateX(66px) rotate(4deg);}
  .robot-b.walk-close{transform:translateX(-66px) rotate(-4deg);}
  .robot-a.step-in{transform:translateX(39px) rotate(3deg);}
  .robot-b.step-in{transform:translateX(-39px) rotate(-3deg);}
  .robot-a.bump-back{transform:translateX(15px);}
  .robot-b.bump-back{transform:translateX(-15px);}

  /* mutual gaze — whenever the two robots are close (walking toward each other,
     stepping in, hugging), their eyes actually turn to look at one another instead
     of staring straight ahead. This is the single biggest cue that they're reacting
     to *each other* and not just running two separate animations side by side. */
  .robot-a.walk-close .eyerow, .robot-a.step-in .eyerow, .robot-a.hug .eyerow{transform:translateX(4px);}
  .robot-b.walk-close .eyerow, .robot-b.step-in .eyerow, .robot-b.hug .eyerow{transform:translateX(-4px);}

  /* quick leg alternation while walking (kept for poses that do show legs) —
     denser mid-frames so the swing reads as one continuous pendulum sweep
     instead of hopping between three widely-spaced poses */
  .pose.walking .leg:nth-child(1){animation:legswing .3s var(--ease-life) infinite;}
  .pose.walking .leg:nth-child(2){animation:legswing .3s var(--ease-life) infinite reverse;}
  @keyframes legswing{
    0%{transform:translateY(0) rotate(0deg);}
    18%{transform:translateY(-1.5px) rotate(2deg);}
    35%{transform:translateY(-3.5px) rotate(5deg);}
    50%{transform:translateY(-5px) rotate(8deg);}
    65%{transform:translateY(-3.5px) rotate(5deg);}
    82%{transform:translateY(-1.5px) rotate(2deg);}
    100%{transform:translateY(0) rotate(0deg);}
  }
  /* Eilik has no legs — it "walks" by tipping and waddling on its round base,
     exactly like the real toy sliding across a table. This is the visible motion
     during every walk-close/step-in/race transition. Dense in-between frames
     (7 points instead of 5) make the rock read as one continuous roll from
     side to side rather than a handful of poses snapping between each other. */
  .pose.walking{animation:waddle .3s var(--ease-life) infinite;}
  @keyframes waddle{
    0%{transform:translateY(0) rotate(-6deg) scaleX(1);}
    15%{transform:translateY(-1px) rotate(-4deg) scaleX(1.006);}
    30%{transform:translateY(-3px) rotate(0deg) scaleX(1.02);}
    50%{transform:translateY(-5px) rotate(6deg) scaleX(1.04);}
    70%{transform:translateY(-3px) rotate(0deg) scaleX(1.02);}
    85%{transform:translateY(-1px) rotate(-4deg) scaleX(1.006);}
    100%{transform:translateY(0) rotate(-6deg) scaleX(1);}
  }
  /* desync the two robots' step timing the same way bobwrap already is (line ~198)
     so a side-by-side walk never looks like one mirrored puppet — each body reads
     as running its own independent gait */
  .robot-b .pose.walking{ animation-duration:.34s; animation-delay:-.09s; }
  .robot-b .pose.walking .leg:nth-child(1),
  .robot-b .pose.walking .leg:nth-child(2){ animation-duration:.34s; }
  .pose.race{animation:waddle .17s var(--ease-life) infinite;}
  .robot-b .pose.race{ animation-duration:.19s; animation-delay:-.05s; }

  /* arms were dead weight during a walk before — the base rocked but the arms
     never responded to that shifting weight, which read stiff. A small
     counter-swing opposite the lean (like a person's arms countering a hip
     sway) sells the same weight-shift the base is already doing. Gestures that
     set an explicit arm pose (poke, wave, etc.) keep winning since those
     classes sit on .robot and are more specific than this .pose-scoped rule. */
  .pose.walking .arm-l{animation:walkArmL .3s var(--ease-life) infinite;}
  .pose.walking .arm-r{animation:walkArmR .3s var(--ease-life) infinite;}
  @keyframes walkArmL{
    0%,100%{transform:rotate(-14deg) translateY(0);}
    50%{transform:rotate(-24deg) translateY(-2px);}
  }
  @keyframes walkArmR{
    0%,100%{transform:rotate(14deg) translateY(0);}
    50%{transform:rotate(4deg) translateY(-2px);}
  }
  .robot-b .pose.walking .arm-l,
  .robot-b .pose.walking .arm-r{ animation-duration:.34s; animation-delay:-.09s; }

  /* poke gesture */
  .robot.poke .arm-r{transform:rotate(-100deg) translateY(-4px);}
  .robot.poke .arm-l{transform:rotate(100deg) translateY(-4px);}

  /* pointing / arguing gestures */
  .robot-a.point .arm-r{animation:pointR .5s ease;}
  .robot-b.point .arm-l{animation:pointL .5s ease;}
  @keyframes pointR{
    0%{transform:rotate(8deg);}
    30%{transform:rotate(-55deg) translateX(6px);}
    60%{transform:rotate(-35deg) translateX(3px);}
    100%{transform:rotate(8deg);}
  }
  @keyframes pointL{
    0%{transform:rotate(-8deg);}
    30%{transform:rotate(55deg) translateX(-6px);}
    60%{transform:rotate(35deg) translateX(-3px);}
    100%{transform:rotate(-8deg);}
  }
  .robot.stomp .leg:nth-child(1){animation:stomp .32s ease;}
  @keyframes stomp{
    0%{transform:translateY(0);}
    40%{transform:translateY(-8px);}
    70%{transform:translateY(1px);}
    100%{transform:translateY(0);}
  }
  .robot.shake .pose{animation:shake .28s ease-in-out 3;}
  @keyframes shake{
    0%,100%{transform:translateX(0) rotate(0);}
    25%{transform:translateX(-5px) rotate(-4deg);}
    75%{transform:translateX(5px) rotate(4deg);}
  }

  /* throwing / catching a ball */
  .robot-a.throw .arm-r{animation:throwR .55s ease;}
  .robot-b.throw .arm-l{animation:throwL .55s ease;}
  @keyframes throwR{
    0%{transform:rotate(8deg);}
    35%{transform:rotate(-85deg) translateX(4px);}
    100%{transform:rotate(8deg);}
  }
  @keyframes throwL{
    0%{transform:rotate(-8deg);}
    35%{transform:rotate(85deg) translateX(-4px);}
    100%{transform:rotate(-8deg);}
  }
  .robot.catch .pose{animation:catchBounce .3s ease;}
  @keyframes catchBounce{
    0%{transform:scale(1);}
    50%{transform:scale(.92) translateY(4px);}
    100%{transform:scale(1);}
  }

  /* dancing: full-body groove + kicking legs + waving arms */
  .robot.dance .pose{animation:dance .62s var(--ease-life) infinite;}
  @keyframes dance{
    0%{transform:translateY(0) rotate(-7deg);}
    50%{transform:translateY(-13px) rotate(7deg);}
    100%{transform:translateY(0) rotate(-7deg);}
  }
  .robot.dance .arm-l{animation:waveL .62s var(--ease-life) infinite;}
  .robot.dance .arm-r{animation:waveR .62s var(--ease-life) infinite;}
  @keyframes waveL{0%,100%{transform:rotate(-150deg);}50%{transform:rotate(-100deg);}}
  @keyframes waveR{0%,100%{transform:rotate(150deg);}50%{transform:rotate(100deg);}}
  .robot.dance .leg:nth-child(1){animation:kickL .5s var(--ease-life) infinite;}
  .robot.dance .leg:nth-child(2){animation:kickR .5s var(--ease-life) infinite;}
  @keyframes kickL{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-6px) rotate(-14deg);}}
  @keyframes kickR{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-6px) rotate(14deg);}}

  /* hugging */
  .robot-a.hug{transform:translateX(29px) rotate(-3deg);}
  .robot-b.hug{transform:translateX(-29px) rotate(3deg);}
  .robot-a.hug .arm-r{transform:rotate(60deg) translateY(4px);}
  .robot-b.hug .arm-l{transform:rotate(-60deg) translateY(4px);}

  /* sleeping: head droops, slow breathing */
  .robot.sleepy .pose{animation:breathe 2.4s ease-in-out infinite;}
  @keyframes breathe{
    0%,100%{transform:translateY(0) rotate(-3deg);}
    50%{transform:translateY(2px) rotate(-3deg);}
  }
  .robot.sleepy .head{transform:rotate(-8deg) translateY(3px);}

  /* waving hello */
  .robot.wave .arm-r{animation:waveHi .5s ease-in-out 3;}
  @keyframes waveHi{
    0%{transform:rotate(8deg);}
    25%{transform:rotate(-35deg);}
    50%{transform:rotate(-5deg);}
    75%{transform:rotate(-35deg);}
    100%{transform:rotate(8deg);}
  }

  /* clapping / cheering */
  .robot.clap .arm-l{animation:clapL .4s var(--ease-life) infinite;}
  .robot.clap .arm-r{animation:clapR .4s var(--ease-life) infinite;}
  @keyframes clapL{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(55deg);}}
  @keyframes clapR{0%,100%{transform:rotate(8deg);}50%{transform:rotate(-55deg);}}
  .robot.clap .pose{animation:cheerBounce .4s ease-in-out infinite;}
  @keyframes cheerBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}

  /* jumping together */
  .robot.jump .pose{animation:jumpUp .5s ease-in-out 2;}
  @keyframes jumpUp{
    0%{transform:translateY(0) scaleY(1);}
    25%{transform:translateY(3px) scaleY(.92);}
    55%{transform:translateY(-24px) scaleY(1.05);}
    80%{transform:translateY(0) scaleY(.95);}
    100%{transform:translateY(0) scaleY(1);}
  }

  /* handshake */
  .robot-a.handshake .arm-r{animation:shakeArmR .35s ease-in-out 3;}
  .robot-b.handshake .arm-l{animation:shakeArmL .35s ease-in-out 3;}
  @keyframes shakeArmR{0%,100%{transform:rotate(-72deg) translateY(0);}50%{transform:rotate(-72deg) translateY(6px);}}
  @keyframes shakeArmL{0%,100%{transform:rotate(72deg) translateY(0);}50%{transform:rotate(72deg) translateY(6px);}}

  /* shocked / startled eyes for the "scare" action */
  .robot.scared .pose{animation:scareJump .45s cubic-bezier(.34,1.56,.64,1) 2;}
  @keyframes scareJump{
    0%{transform:translateY(0) scale(1);}
    30%{transform:translateY(-16px) scale(1.08,.92);}
    60%{transform:translateY(2px) scale(.95,1.05);}
    100%{transform:translateY(0) scale(1);}
  }
  .robot-a.scared{transform:translateX(-12px);}
  .robot-b.scared{transform:translateX(12px);}

  /* spinning around */
  .robot.spin .pose{animation:spinAround .6s linear;}
  @keyframes spinAround{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
  }
  .robot.spin.dizzy .pose{animation:none;}

  /* laughing: happy bounce with head wobble */
  .robot.laugh .pose{animation:laughBounce .35s ease-in-out infinite;}
  @keyframes laughBounce{
    0%,100%{transform:translateY(0) rotate(-4deg);}
    50%{transform:translateY(-9px) rotate(4deg);}
  }

  /* crying: droopy head, tears via particles */
  .robot.cry .pose{animation:cryShake .4s ease-in-out infinite;}
  @keyframes cryShake{
    0%,100%{transform:translateY(0) rotate(-2deg);}
    50%{transform:translateY(2px) rotate(2deg);}
  }
  .robot.cry .head{transform:rotate(6deg) translateY(2px);}

  /* high five */
  .robot-a.highfive .arm-r{transform:rotate(-95deg) translateX(4px) translateY(-8px);}
  .robot-b.highfive .arm-l{transform:rotate(95deg) translateX(-4px) translateY(-8px);}

  /* singing: gentle sway with a raised "mic" arm */
  .robot.sing .pose{animation:singBounce .45s ease-in-out infinite;}
  @keyframes singBounce{
    0%,100%{transform:translateY(0) rotate(-3deg);}
    50%{transform:translateY(-5px) rotate(3deg);}
  }
  .robot.sing .arm-r{transform:rotate(-110deg) translateY(-4px);}

  /* selfie: lean in close with a little pop */
  .robot.selfie .pose{animation:selfiePop .3s ease;}
  @keyframes selfiePop{
    0%{transform:scale(1);}
    50%{transform:scale(1.06);}
    100%{transform:scale(1);}
  }
  .robot-a.selfie .arm-r{transform:rotate(-60deg) translateX(10px) translateY(-10px);}
  .robot-b.selfie .arm-l{transform:rotate(60deg) translateX(-10px) translateY(-10px);}

  /* mock boxing: rapid alternating jabs */
  .robot-a.box .arm-r{animation:jabR .3s var(--ease-life) infinite;}
  .robot-b.box .arm-l{animation:jabL .3s var(--ease-life) infinite;}
  @keyframes jabR{0%,100%{transform:rotate(8deg);}50%{transform:rotate(-70deg) translateX(10px);}}
  @keyframes jabL{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(70deg) translateX(-10px);}}

  /* Monster Shooter mini-game — listed on the real unit's own control graphic
     alongside Pomodoro/Dance to Beat. A rapid point-and-fire arm jab, distinct
     from the two-player .box jab above (this one's solo, aimed up-and-out at
     a target rather than at the other robot). */
  .robot.shooting .arm-r{animation:shootArm .22s var(--ease-life) infinite;}
  @keyframes shootArm{
    0%,100%{transform:rotate(-68deg) translateX(5px) translateY(-6px);}
    50%{transform:rotate(-92deg) translateX(9px) translateY(-10px);}
  }

  /* Fishing mini-game — cast (arm rears back and snaps down/out), then a
     rhythmic reel-in while waiting for a bite */
  .robot.casting .arm-r{transform:rotate(-150deg) translateX(9px) translateY(-16px); transition:transform .35s var(--ease-life);}
  .robot.reeling .arm-r{animation:reelArm .32s var(--ease-life) infinite;}
  @keyframes reelArm{
    0%,100%{transform:rotate(-42deg) translateY(-3px);}
    50%{transform:rotate(-58deg) translateY(2px);}
  }

  /* gift giving */
  .robot-a.gift-give .arm-r{transform:rotate(-65deg) translateX(6px) translateY(-2px);}
  .robot-b.gift-receive .arm-l{transform:rotate(55deg) translateX(-6px) translateY(-2px);}

  /* thinking: hand on chin, slight head tilt */
  .robot.think .arm-r{transform:rotate(-145deg) translateX(7px) translateY(-15px);}
  .robot.think .head{transform:rotate(-6deg);}

  /* salute */
  .robot.salute .arm-r{transform:rotate(-152deg) translateX(9px) translateY(-19px);}

  /* blowing a kiss */
  .robot.blowkiss .arm-r{animation:kissR .5s ease;}
  @keyframes kissR{
    0%{transform:rotate(8deg);}
    30%{transform:rotate(-130deg) translateX(6px) translateY(-11px);}
    70%{transform:rotate(-55deg) translateX(12px);}
    100%{transform:rotate(8deg);}
  }

  /* exercise / jumping jacks */
  .robot.exercise .arm-l{animation:jackL .4s var(--ease-life) infinite;}
  .robot.exercise .arm-r{animation:jackR .4s var(--ease-life) infinite;}
  @keyframes jackL{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(-172deg);}}
  @keyframes jackR{0%,100%{transform:rotate(8deg);}50%{transform:rotate(172deg);}}
  .robot.exercise .leg:nth-child(1){animation:jackLegL .4s var(--ease-life) infinite;}
  .robot.exercise .leg:nth-child(2){animation:jackLegR .4s var(--ease-life) infinite;}
  @keyframes jackLegL{0%,100%{transform:translateX(0) rotate(0);}50%{transform:translateX(-6px) rotate(-10deg);}}
  @keyframes jackLegR{0%,100%{transform:translateX(0) rotate(0);}50%{transform:translateX(6px) rotate(10deg);}}

  /* racing across the stage */
  .robot-a.race-run{transform:translateX(128px) rotate(6deg);}
  .robot-b.race-run{transform:translateX(-128px) rotate(-6deg);}
  .robot-a.race-back{transform:translateX(0) rotate(0);}
  .robot-b.race-back{transform:translateX(0) rotate(0);}
  .pose.race .leg:nth-child(1){animation:legswing .16s var(--ease-life) infinite;}
  .pose.race .leg:nth-child(2){animation:legswing .16s var(--ease-life) infinite reverse;}
  .pose.race .arm-l{animation:runArmL .32s var(--ease-life) infinite;}
  .pose.race .arm-r{animation:runArmR .32s var(--ease-life) infinite;}
  @keyframes runArmL{0%,100%{transform:rotate(-40deg);}50%{transform:rotate(20deg);}}
  @keyframes runArmR{0%,100%{transform:rotate(40deg);}50%{transform:rotate(-20deg);}}

  /* ---------- CONTROLS ---------- */
  /* one fixed-height bar pinned under the stage — everything a person needs
     (typing a request, toggling the two optional sensors) lives in this single
     row, so nothing pushes the page taller than one screen */
  .controls{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:16px;
    padding:9px;
    position:relative;
    z-index:1;
  }
  .cmdrow{
    display:flex;gap:7px;align-items:center;
  }
  .cmdrow input{
    flex:1;
    min-width:0;
    background:#0d1330;
    border:1px solid var(--panel-line);
    color:var(--ink);
    padding:11px 14px;
    border-radius:12px;
    font-family:inherit;
    font-size:14px;
    outline:none;
  }
  .cmdrow input:focus{border-color:var(--a-main);}
  .cmdrow button#cmdBtn{
    background:linear-gradient(135deg,var(--a-main),var(--a-dark));
    border:none;color:#08222a;font-weight:700;
    padding:0 18px;border-radius:12px;cursor:pointer;
    font-family:inherit;font-size:14px;
    flex:0 0 auto;
  }
  /* small round sensor-toggle icons (mic / shake) next to the input — status
     shows as a color change plus a browser tooltip instead of eating layout
     space with full sentences */
  .icon-btn{
    flex:0 0 auto;
    width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    background:#1a2148;border:1px solid var(--panel-line);
    border-radius:50%;
    font-size:16px;line-height:1;
    cursor:pointer;
    padding:0;
  }
  .icon-btn.on{border-color:var(--a-main);background:#20365a;box-shadow:0 0 0 2px rgba(95,201,174,.25);}

  /* ---------- TOPBAR + SETTINGS PANEL ---------- */
  /* a tiny fixed-height header above the stage — just a title and a gear icon,
     so opening settings never pushes the one-screen layout taller or eats into
     the stage's room. The panel itself drops down as an overlay instead of
     shifting layout, for the same reason. */
  .topbar{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:2px 4px;
  }
  .topbar-title{
    font-size:13px;font-weight:700;color:var(--dim);
    letter-spacing:.2px;
  }
  #settingsBtn{
    transition:transform .3s ease;
  }
  #settingsBtn.spun{transform:rotate(75deg);}
  .settings-backdrop{
    position:fixed;inset:0;
    background:rgba(6,9,22,.55);
    z-index:20;
    display:flex;align-items:flex-start;justify-content:center;
    padding-top:10vh;
    animation:fadeIn .18s ease;
  }
  .settings-backdrop[hidden]{display:none;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .settings-panel{
    width:min(340px, 88vw);
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:18px;
    padding:16px 16px 10px;
    box-shadow:0 20px 50px -15px rgba(0,0,0,.7);
    animation:panelIn .2s cubic-bezier(.34,1.4,.64,1);
  }
  @keyframes panelIn{from{opacity:0;transform:translateY(-10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .settings-panel h3{
    margin:0 0 12px;font-size:15px;color:var(--ink);
    display:flex;align-items:center;justify-content:space-between;
  }
  .settings-panel h3 button{
